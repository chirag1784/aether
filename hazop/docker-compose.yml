# HAZOP MASTER AI — local/private-server deployment.
# Postgres with pgvector, and the web app when you build it against the
# migrations. The single-page deployment in dist/ needs none of this.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hazop
      POSTGRES_PASSWORD: hazop
      POSTGRES_DB: hazop
    ports:
      - "5432:5432"
    volumes:
      - hazop-db:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hazop -d hazop"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Serves dist/index.html for a private-network deployment with no database.
  # Useful for the worksheet, the engines and the exports on their own.
  static:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  hazop-db:
