// packages/calculations/dedup.js
// Recommendation deduplication. Merges only on technical equivalence and never
// loses a backlink to the originating scenario.

const DEDUP_VERSION = 'dedup-1.0.0';

const STOPWORDS = new Set([
  'a', 'an', 'the', 'to', 'of', 'for', 'and', 'or', 'in', 'on', 'at', 'is', 'are', 'be',
  'should', 'shall', 'must', 'may', 'ensure', 'please', 'provide', 'provided', 'providing',
  'system', 'systems', 'all', 'any', 'as', 'per', 'with', 'by', 'from', 'that', 'this',
  'it', 'its', 'do', 'done', 'being', 'shall',
]);

// Words that change the engineering meaning of an action. Two recommendations
// that differ on any of these are NOT equivalent, however similar their wording.
const DISCRIMINATORS = new Set([
  'alarm', 'trip', 'interlock', 'psv', 'relief', 'rupture', 'disc', 'sil', 'sif',
  'nitrogen', 'inerting', 'earthing', 'bonding', 'grounding', 'vent', 'scrubber',
  'flame', 'arrestor', 'detector', 'detection', 'sprinkler', 'deluge', 'hydrant',
  'calibration', 'maintenance', 'pm', 'sop', 'training', 'ppe', 'signage',
  'dyke', 'bund', 'kerb', 'spill', 'kit', 'isolation', 'lockout', 'dust',
  'collector', 'ventilation', 'cooling', 'jacket', 'agitator', 'stirrer',
  'level', 'temperature', 'pressure', 'flow', 'ph', 'sampling', 'valve',
  'nrv', 'check', 'pump', 'blower', 'filter', 'conductivity', 'static',
  'thermic', 'brine', 'chilled', 'steam', 'emergency', 'shutdown', 'esd',
]);

function tokenize(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/[^a-z0-9\s./-]/g, ' ')
    .split(/\s+/)
    .map((t) => t.replace(/^[-./]+|[-./]+$/g, ''))
    .filter((t) => t.length > 1 && !STOPWORDS.has(t));
}

function jaccard(a, b) {
  const sa = new Set(a);
  const sb = new Set(b);
  if (sa.size === 0 && sb.size === 0) return 1;
  let inter = 0;
  for (const t of sa) if (sb.has(t)) inter += 1;
  return inter / (sa.size + sb.size - inter);
}

function discriminatorsOf(tokens) {
  return new Set(tokens.filter((t) => DISCRIMINATORS.has(t)));
}

function setsEqual(a, b) {
  if (a.size !== b.size) return false;
  for (const x of a) if (!b.has(x)) return false;
  return true;
}

const DEFAULT_SIMILARITY = 0.72;

/**
 * Are two recommendations technically equivalent?
 *
 * Requires: the same equipment scope, the same discriminator set, the same
 * hierarchy-of-control level, and high lexical similarity. Any difference in
 * the discriminator set blocks the merge even at similarity 0.99.
 */
function isTechnicallyEquivalent(a, b, opts) {
  const o = opts || {};
  const threshold = Number.isFinite(Number(o.threshold)) ? Number(o.threshold) : DEFAULT_SIMILARITY;

  const ta = tokenize(a.text);
  const tb = tokenize(b.text);
  const sim = jaccard(ta, tb);

  const da = discriminatorsOf(ta);
  const db = discriminatorsOf(tb);
  if (!setsEqual(da, db)) {
    return { equivalent: false, similarity: sim, reason: 'DIFFERENT_TECHNICAL_MEASURE', a: Array.from(da), b: Array.from(db) };
  }

  const eqA = (a.equipmentTags || []).slice().sort().join('|');
  const eqB = (b.equipmentTags || []).slice().sort().join('|');
  if (eqA !== eqB) return { equivalent: false, similarity: sim, reason: 'DIFFERENT_EQUIPMENT_SCOPE' };

  if ((a.controlLevel || '') !== (b.controlLevel || '')) {
    return { equivalent: false, similarity: sim, reason: 'DIFFERENT_CONTROL_LEVEL' };
  }
  if (sim < threshold) return { equivalent: false, similarity: sim, reason: 'BELOW_SIMILARITY_THRESHOLD' };
  return { equivalent: true, similarity: sim, reason: 'TECHNICALLY_EQUIVALENT' };
}

/**
 * Deduplicate a list of recommendations.
 * Nothing is deleted: the survivor accumulates mergedFrom[] and every
 * originating scenario keeps a backlink in raisedFrom[].
 *
 * @param {Array} recs [{ id, text, scenarioId, nodeId, equipmentTags[], controlLevel, priority, ... }]
 * @returns {Object} { kept: [...], merges: [{ survivorId, mergedId, similarity }] }
 */
function deduplicateRecommendations(recs, opts) {
  const list = (recs || []).slice();
  const kept = [];
  const merges = [];

  for (const rec of list) {
    let target = null;
    let verdict = null;
    for (const k of kept) {
      const v = isTechnicallyEquivalent(k, rec, opts);
      if (v.equivalent) {
        target = k;
        verdict = v;
        break;
      }
    }
    if (!target) {
      kept.push(
        Object.assign({}, rec, {
          mergedFrom: (rec.mergedFrom || []).slice(),
          raisedFrom: dedupeRefs((rec.raisedFrom || []).concat([{ scenarioId: rec.scenarioId, nodeId: rec.nodeId, recId: rec.id }])),
        })
      );
      continue;
    }
    target.mergedFrom = dedupeStrings(target.mergedFrom.concat([rec.id]));
    target.raisedFrom = dedupeRefs(
      target.raisedFrom.concat(rec.raisedFrom || [], [{ scenarioId: rec.scenarioId, nodeId: rec.nodeId, recId: rec.id }])
    );
    // The survivor keeps the highest priority and the earliest target date.
    target.priority = higherPriority(target.priority, rec.priority);
    target.targetDate = earlierDate(target.targetDate, rec.targetDate);
    merges.push({ survivorId: target.id, mergedId: rec.id, similarity: verdict.similarity });
  }

  return { kept, merges, engine: DEDUP_VERSION };
}

const PRIORITY_ORDER = ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'];

function higherPriority(a, b) {
  const ia = PRIORITY_ORDER.indexOf(a);
  const ib = PRIORITY_ORDER.indexOf(b);
  if (ia === -1) return b || a || null;
  if (ib === -1) return a;
  return ia >= ib ? a : b;
}

function earlierDate(a, b) {
  if (!a) return b || null;
  if (!b) return a;
  return String(a) <= String(b) ? a : b;
}

function dedupeStrings(arr) {
  return Array.from(new Set((arr || []).filter(Boolean)));
}

function dedupeRefs(arr) {
  const seen = new Set();
  const out = [];
  for (const r of arr || []) {
    if (!r) continue;
    const k = (r.scenarioId || '') + '|' + (r.nodeId || '') + '|' + (r.recId || '');
    if (seen.has(k)) continue;
    seen.add(k);
    out.push(r);
  }
  return out;
}

// Vague recommendation text the engine flags (MASTER_STRUCTURE §14).
const VAGUE_PATTERNS = [
  /^\s*take\s+care\b/i,
  /^\s*be\s+careful\b/i,
  /^\s*use\s+ppe\.?\s*$/i,
  /^\s*wear\s+ppe\.?\s*$/i,
  /^\s*follow\s+sop\.?\s*$/i,
  /^\s*train\s+(the\s+)?operator\.?\s*$/i,
  /^\s*ensure\s+safety\.?\s*$/i,
  /^\s*good\s+housekeeping\.?\s*$/i,
];

function assessRecommendationQuality(rec) {
  const text = String((rec && rec.text) || '').trim();
  const issues = [];
  if (text.length < 12) issues.push({ code: 'TOO_SHORT', detail: 'State the measure, the location and the acceptance condition.' });
  for (const p of VAGUE_PATTERNS) {
    if (p.test(text)) {
      issues.push({ code: 'VAGUE_ACTION', detail: 'Replace with a specific measure; consider an engineering control first.' });
      break;
    }
  }
  if (!rec || !rec.controlLevel) issues.push({ code: 'NO_CONTROL_LEVEL', detail: 'Classify against the hierarchy of control.' });
  if (rec && rec.controlLevel === 'PPE') {
    issues.push({ code: 'PPE_AS_PRIMARY', detail: 'PPE is the last resort; record why elimination, substitution or an engineering control is not reasonably practicable.' });
  }
  if (!rec || !rec.responsibleDepartment) issues.push({ code: 'NO_OWNER', detail: 'Assign a responsible department.' });
  if (!rec || !rec.targetDate) issues.push({ code: 'NO_TARGET_DATE', detail: 'Set a target date.' });
  if (!rec || !rec.technicalBasis) issues.push({ code: 'NO_TECHNICAL_BASIS', detail: 'Record the technical basis for the action.' });
  return { ok: issues.length === 0, issues };
}

const CONTROL_LEVELS = Object.freeze([
  { key: 'ELIMINATE', label: 'Eliminate', rank: 1 },
  { key: 'SUBSTITUTE', label: 'Substitute', rank: 2 },
  { key: 'ENGINEERING', label: 'Engineering control', rank: 3 },
  { key: 'ADMINISTRATIVE', label: 'Administrative control', rank: 4 },
  { key: 'PPE', label: 'PPE', rank: 5 },
]);

// packages/calculations/completeness.js
// Two separate completeness figures, each returning what is missing.
// Never blended into a single "score".



const COMPLETENESS_VERSION = 'completeness-1.0.0';

// Project profile fields tracked for overall data completeness.
const PROFILE_FIELDS = [
  { path: 'projectName', label: 'Project name' },
  { path: 'clientName', label: 'Client' },
  { path: 'siteName', label: 'Site' },
  { path: 'siteAddress', label: 'Site address' },
  { path: 'product', label: 'Product' },
  { path: 'process', label: 'Process' },
  { path: 'processStage', label: 'Process stage' },
  { path: 'department', label: 'Department' },
  { path: 'projectType', label: 'Project type' },
  { path: 'processDescription', label: 'Process description' },
  { path: 'chemistry', label: 'Chemistry' },
  { path: 'batchSize', label: 'Batch size' },
  { path: 'productionRate', label: 'Production rate' },
  { path: 'utilities', label: 'Utilities' },
  { path: 'startupBasis', label: 'Start-up basis' },
  { path: 'shutdownBasis', label: 'Shutdown basis' },
  { path: 'emergencyShutdownBasis', label: 'Emergency shutdown basis' },
  { path: 'studyStartDate', label: 'Study start date' },
];

// Jurisdiction fields the legal engine must have resolved before it can reach
// any confirmed applicability conclusion.
const REQUIRED_JURISDICTION = [
  { path: 'country', label: 'Country' },
  { path: 'state', label: 'State / UT' },
  { path: 'district', label: 'District / local authority' },
  { path: 'appropriateGovernment', label: 'Appropriate government' },
  { path: 'establishmentCategory', label: 'Establishment / factory category' },
  { path: 'processCategory', label: 'Process category' },
  { path: 'hazardousProcess', label: 'Hazardous-process status' },
  { path: 'consentAuthority', label: 'Consent authority' },
  { path: 'environmentalCategory', label: 'Environmental category' },
];

function has(v) {
  if (v === null || v === undefined) return false;
  if (typeof v === 'string') return v.trim().length > 0;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'boolean') return true;
  if (typeof v === 'number') return Number.isFinite(v);
  if (typeof v === 'object') return Object.keys(v).length > 0;
  return false;
}

function pctOf(done, total) {
  if (!total) return 0;
  return Math.round((done / total) * 100);
}

/**
 * Overall project-profile completeness.
 * @returns {Object} { percent, present, total, missing: [{path,label}] }
 */
function dataCompleteness(project) {
  const p = project || {};
  const missing = [];
  let present = 0;
  for (const f of PROFILE_FIELDS) {
    if (has(p[f.path])) present += 1;
    else missing.push(f);
  }
  const j = p.jurisdiction || {};
  let jPresent = 0;
  for (const f of REQUIRED_JURISDICTION) {
    if (has(j[f.path])) jPresent += 1;
    else missing.push({ path: 'jurisdiction.' + f.path, label: f.label });
  }
  const total = PROFILE_FIELDS.length + REQUIRED_JURISDICTION.length;
  return { percent: pctOf(present + jPresent, total), present: present + jPresent, total, missing, engine: COMPLETENESS_VERSION };
}

/**
 * Critical completeness — the subset that blocks HAZOP conclusions.
 *
 * @param {Object} ctx { project, chemicals[], chemProperties[], equipment[], nodes[], matrix }
 */
function criticalCompleteness(ctx) {
  const c = ctx || {};
  const project = c.project || {};
  const j = project.jurisdiction || {};
  const checks = [];

  // 1. Jurisdiction resolution
  for (const f of REQUIRED_JURISDICTION) {
    checks.push({
      id: 'jurisdiction.' + f.path,
      label: 'Jurisdiction: ' + f.label,
      pass: has(j[f.path]),
      group: 'Jurisdiction',
      fixHint: 'Set it on the project jurisdiction profile.',
    });
  }

  // 2. Risk matrix
  checks.push({
    id: 'matrix',
    label: 'Risk matrix selected',
    pass: !!(c.matrix && c.matrix.id),
    group: 'Methodology',
    fixHint: 'Choose or define a matrix on the Risk page.',
  });

  // 3. Chemicals: identity, quantity, state
  for (const ch of c.chemicals || []) {
    const name = ch.canonicalName || ch.name || ch.id;
    checks.push({
      id: 'chem.' + ch.id + '.identity',
      label: 'Chemical identity resolved: ' + name,
      pass: !!(ch.cas && ch.casValid !== false) || ch.identityStatus === 'USER_CONFIRMED',
      group: 'Chemicals',
      fixHint: 'Enter a valid CAS number or confirm the identity manually.',
    });
    checks.push({
      id: 'chem.' + ch.id + '.quantity',
      label: 'Inventory quantity: ' + name,
      pass: has(ch.quantity) && has(ch.quantityUnit),
      group: 'Chemicals',
      fixHint: 'Quantity and unit are required before any legal threshold can be evaluated.',
    });
    checks.push({
      id: 'chem.' + ch.id + '.state',
      label: 'Physical state: ' + name,
      pass: has(ch.physicalState),
      group: 'Chemicals',
      fixHint: 'Needed for storage-type and threshold classification.',
    });
  }

  // 4. Flammability data for chemicals handled at or above ambient
  const props = c.chemProperties || [];
  const propFor = (chemId, key) => props.filter((p) => p.chemicalId === chemId && p.key === key)[0];
  for (const ch of c.chemicals || []) {
    const name = ch.canonicalName || ch.name || ch.id;
    const fp = propFor(ch.id, 'flashPoint');
    checks.push({
      id: 'chem.' + ch.id + '.flashPoint',
      label: 'Flash point status known: ' + name,
      pass: !!fp && (isUsable(fp.status) || fp.status === 'NOT_APPLICABLE'),
      group: 'Chemicals',
      fixHint: 'Attach an SDS or mark not applicable with a reason. An unknown flash point blocks flammability alerts.',
    });
  }

  // 5. Pressure equipment: design pressure/temperature and relief
  for (const eq of c.equipment || []) {
    const tag = eq.tag || eq.id;
    if (eq.pressureEquipment) {
      checks.push({
        id: 'eq.' + eq.id + '.designP',
        label: 'Design pressure: ' + tag,
        pass: has(eq.designPressure),
        group: 'Equipment',
        fixHint: 'From the equipment datasheet or nameplate.',
      });
      checks.push({
        id: 'eq.' + eq.id + '.designT',
        label: 'Design temperature: ' + tag,
        pass: has(eq.designTemperature),
        group: 'Equipment',
        fixHint: 'From the equipment datasheet or nameplate.',
      });
      checks.push({
        id: 'eq.' + eq.id + '.relief',
        label: 'Relief / vent arrangement: ' + tag,
        pass: has(eq.reliefArrangement),
        group: 'Equipment',
        fixHint: 'Record the relief device or vent arrangement, or state that none is fitted.',
      });
    }
    checks.push({
      id: 'eq.' + eq.id + '.moc',
      label: 'Material of construction: ' + tag,
      pass: has(eq.materialOfConstruction),
      group: 'Equipment',
      fixHint: 'Needed for chemical compatibility checks.',
    });
  }

  // 6. Nodes have a design intent
  for (const n of c.nodes || []) {
    checks.push({
      id: 'node.' + n.id + '.intent',
      label: 'Design intent recorded: Node ' + (n.nodeNumber || n.id),
      pass: has(n.designIntent),
      group: 'Nodes',
      fixHint: 'A node without a design intent cannot generate meaningful deviations.',
    });
  }

  const failed = checks.filter((k) => !k.pass);
  return {
    percent: pctOf(checks.length - failed.length, checks.length),
    present: checks.length - failed.length,
    total: checks.length,
    checks,
    missing: failed,
    byGroup: groupCounts(checks),
    engine: COMPLETENESS_VERSION,
  };
}

function groupCounts(checks) {
  const map = new Map();
  for (const k of checks) {
    if (!map.has(k.group)) map.set(k.group, { group: k.group, total: 0, pass: 0 });
    const g = map.get(k.group);
    g.total += 1;
    if (k.pass) g.pass += 1;
  }
  return Array.from(map.values()).map((g) => Object.assign(g, { percent: pctOf(g.pass, g.total) }));
}

/**
 * Report readiness is the quality gate's blocking-check pass rate, kept
 * separate from data completeness so the two cannot be confused.
 */
function reportReadiness(gateResult) {
  const checks = ((gateResult && gateResult.checks) || []).filter((k) => k.severity === 'BLOCKING');
  const pass = checks.filter((k) => k.pass).length;
  return { percent: pctOf(pass, checks.length), pass, total: checks.length };
}

// packages/chemical/properties.js
// Chemical identity resolution and the fixed property schema (MASTER_STRUCTURE §7.2).
// The property key list is fixed so the alert engine can rely on it.

const CHEM_VERSION = 'chemical-1.0.0';

/**
 * CAS check-digit validation. Not a regex: the last digit is
 * sum(digit_i * position_from_right) mod 10.
 * 64-19-7 (acetic acid) validates; 64-19-8 does not.
 */
function validateCas(cas) {
  const s = String(cas || '').trim();
  const m = /^(\d{2,7})-(\d{2})-(\d)$/.exec(s);
  if (!m) return { valid: false, reason: 'FORMAT', normalized: null };
  const digits = (m[1] + m[2]).split('').reverse();
  let sum = 0;
  for (let i = 0; i < digits.length; i += 1) sum += Number(digits[i]) * (i + 1);
  const expected = sum % 10;
  const given = Number(m[3]);
  if (expected !== given) return { valid: false, reason: 'CHECK_DIGIT', normalized: s, expected, given };
  return { valid: true, reason: 'OK', normalized: s };
}

function normName(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/\(.*?\)/g, ' ')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim()
    .replace(/\s+/g, ' ');
}

/**
 * Resolve a chemical identity against the project's own chemical list and any
 * supplied reference entries. There is no built-in chemical database: the
 * system does not invent a CAS number for a name it has not been given.
 *
 * @param {Object} input { name, cas, synonyms[] }
 * @param {Array} known  existing chemical records to match against
 * @returns {Object} { canonicalName, cas, casValid, matchKind, candidates[], notes[] }
 */
function resolveChemical(input, known) {
  const inp = input || {};
  const list = known || [];
  const notes = [];
  const casCheck = inp.cas ? validateCas(inp.cas) : null;
  if (casCheck && !casCheck.valid) {
    notes.push(
      casCheck.reason === 'CHECK_DIGIT'
        ? 'CAS ' + inp.cas + ' fails its check digit (expected final digit ' + casCheck.expected + '). Correct it against the source document.'
        : 'CAS "' + inp.cas + '" is not in the format nnnnnnn-nn-n.'
    );
  }

  if (casCheck && casCheck.valid) {
    const hit = list.filter((k) => k.cas === casCheck.normalized);
    if (hit.length === 1) {
      return { canonicalName: hit[0].canonicalName || hit[0].name, cas: casCheck.normalized, casValid: true, matchKind: 'EXACT_CAS', candidates: hit, notes };
    }
    if (hit.length > 1) {
      return { canonicalName: null, cas: casCheck.normalized, casValid: true, matchKind: 'AMBIGUOUS', candidates: hit, notes: notes.concat(['More than one inventory record carries this CAS.']) };
    }
    return { canonicalName: inp.name || null, cas: casCheck.normalized, casValid: true, matchKind: 'EXACT_CAS', candidates: [], notes };
  }

  const n = normName(inp.name);
  if (!n) return { canonicalName: null, cas: null, casValid: casCheck ? casCheck.valid : null, matchKind: 'UNRESOLVED', candidates: [], notes: notes.concat(['No name or CAS supplied.']) };

  const exact = list.filter((k) => normName(k.canonicalName || k.name) === n);
  if (exact.length === 1) {
    return { canonicalName: exact[0].canonicalName || exact[0].name, cas: exact[0].cas || null, casValid: exact[0].cas ? validateCas(exact[0].cas).valid : null, matchKind: 'EXACT_NAME', candidates: exact, notes };
  }
  if (exact.length > 1) return { canonicalName: null, cas: null, casValid: null, matchKind: 'AMBIGUOUS', candidates: exact, notes };

  const syn = list.filter((k) => (k.synonyms || []).some((s) => normName(s) === n));
  if (syn.length === 1) {
    return { canonicalName: syn[0].canonicalName || syn[0].name, cas: syn[0].cas || null, casValid: syn[0].cas ? validateCas(syn[0].cas).valid : null, matchKind: 'SYNONYM', candidates: syn, notes };
  }
  if (syn.length > 1) return { canonicalName: null, cas: null, casValid: null, matchKind: 'AMBIGUOUS', candidates: syn, notes };

  return {
    canonicalName: inp.name || null,
    cas: casCheck && casCheck.valid ? casCheck.normalized : null,
    casValid: casCheck ? casCheck.valid : null,
    matchKind: 'UNRESOLVED',
    candidates: [],
    notes: notes.concat(['Not matched to an existing inventory record. Confirm the identity before any threshold evaluation.']),
  };
}

/** Identity states that block every downstream legal threshold conclusion. */
function identityBlocksThreshold(resolution) {
  if (!resolution) return true;
  if (resolution.matchKind === 'AMBIGUOUS' || resolution.matchKind === 'UNRESOLVED') return true;
  if (resolution.casValid === false) return true;
  return false;
}

  PROPERTY_GROUPS.reduce((acc, g) => acc.concat(g.properties.map((p) => Object.assign({}, p, { group: g.key, groupLabel: g.label }))), [])
);

function propertyMeta(key) {
  return ALL_PROPERTIES.filter((p) => p.key === key)[0] || null;
}

const CRITICAL_PROPERTIES = Object.freeze(ALL_PROPERTIES.filter((p) => p.critical).map((p) => p.key));

// Chemical source classes in priority order (MASTER_STRUCTURE §7.1).
const CHEM_SOURCE_CLASSES = Object.freeze([
  { key: 'SUPPLIER_SDS', label: 'Manufacturer / supplier SDS', rank: 1 },
  { key: 'REGULATOR_DB', label: 'Government or regulator database', rank: 2 },
  { key: 'OCCUPATIONAL_DB', label: 'Occupational-health database', rank: 3 },
  { key: 'SCIENTIFIC_DB', label: 'Scientific chemical database', rank: 4 },
  { key: 'LITERATURE', label: 'Peer-reviewed literature', rank: 5 },
  { key: 'OTHER_TECHNICAL', label: 'Other technical source', rank: 6 },
]);

function chemSourceRank(key) {
  const c = CHEM_SOURCE_CLASSES.filter((x) => x.key === key)[0];
  return c ? c.rank : CHEM_SOURCE_CLASSES.length + 1;
}

/**
 * SDS completeness for one chemical: how many critical properties have a
 * usable status. Returns what is missing, not just a number.
 */
function sdsCompleteness(chemicalId, properties) {
  const usable = ['VERIFIED', 'USER_CONFIRMED', 'DOCUMENT_EXTRACTED', 'WEB_SOURCED'];
  const rows = (properties || []).filter((p) => p.chemicalId === chemicalId);
  const missing = [];
  const conflicts = [];
  let present = 0;
  for (const key of CRITICAL_PROPERTIES) {
    const p = rows.filter((x) => x.key === key)[0];
    if (p && p.status === 'CONFLICT') {
      conflicts.push(key);
      continue;
    }
    if (p && (usable.indexOf(p.status) !== -1 || p.status === 'NOT_APPLICABLE')) present += 1;
    else missing.push(key);
  }
  const total = CRITICAL_PROPERTIES.length;
  return {
    percent: total ? Math.round((present / total) * 100) : 0,
    present,
    total,
    missing,
    conflicts,
    missingLabels: missing.map((k) => (propertyMeta(k) || {}).label || k),
    status: conflicts.length ? 'CONFLICT' : missing.length === 0 ? 'COMPLETE' : present === 0 ? 'NONE' : 'PARTIAL',
  };
}

// packages/chemical/alerts.js
// Process-vs-property reasoning. Deterministic comparisons only.
// An alert is emitted ONLY when both sides have a usable status. A missing
// property produces a data gap, never a "no hazard" conclusion.





const ALERTS_VERSION = 'alerts-1.0.0';

const NEAR_FLASH_K = 10; // margin below flash point that is still an alert
const NEAR_DECOMP_K = 25; // margin below decomposition onset

function prop(props, chemId, key) {
  return (props || []).filter((p) => p.chemicalId === chemId && p.key === key)[0] || null;
}

function usableNumber(p) {
  if (!p) return null;
  if (!isUsable(p.status)) return null;
  const n = Number(p.value);
  return Number.isFinite(n) ? n : null;
}

function usableBool(p) {
  if (!p || !isUsable(p.status)) return null;
  return p.value === true || p.value === 'true' || p.value === 'yes';
}

function usableList(p) {
  if (!p || !isUsable(p.status)) return null;
  if (Array.isArray(p.value)) return p.value;
  if (typeof p.value === 'string') return p.value.split(/[,;]/).map((s) => s.trim()).filter(Boolean);
  return null;
}

function tempC(value, unit) {
  const r = toCelsius(value, unit || 'C');
  return r.ok ? r.value : null;
}

function gap(chemId, chemName, nodeId, propKey, blocks) {
  return {
    kind: 'DATA_GAP',
    chemicalId: chemId,
    chemicalName: chemName,
    nodeId,
    property: propKey,
    propertyLabel: (propertyMeta(propKey) || {}).label || propKey,
    blocks,
    detail: 'No usable value for ' + ((propertyMeta(propKey) || {}).label || propKey) + '. Attach an SDS or mark it not applicable with a reason.',
    resolveWith: ['SDS', 'MANUFACTURER_DATA', 'REGULATOR_DB', 'SCIENTIFIC_DB'],
  };
}

function alert(spec) {
  return Object.assign(
    {
      kind: 'ALERT',
      engine: ALERTS_VERSION,
      severity: 'REVIEW',
      // The mandated presentation shape (MASTER_STRUCTURE §7.3)
      chain: {
        fact: spec.fact,
        source: spec.source,
        processContext: spec.processContext,
        mechanism: spec.mechanism,
        node: spec.nodeLabel,
        review: spec.review,
      },
    },
    spec
  );
}

function refsOf(p) {
  return (p && p.sourceRefs) || [];
}

function srcLabel(p) {
  if (!p) return 'no source';
  const r = refsOf(p)[0];
  if (!r) return p.status + ' (no citation recorded)';
  return [r.sourceLabel || r.sourceType || 'source', r.documentName, r.page ? 'p.' + r.page : null, r.retrievedAt || r.extractedAt].filter(Boolean).join(' · ');
}

/**
 * Run every rule for one node.
 *
 * @param {Object} req { node, equipment[], chemicals[], chemProperties[], safeguards[] }
 * @returns {Object} { alerts: [...], gaps: [...] }
 */
function runNodeAlerts(req) {
  const r = req || {};
  const node = r.node || {};
  const nodeLabel = 'Node ' + (node.nodeNumber || node.id || '?') + (node.worksheetName ? ' — ' + node.worksheetName : '');
  const eq = (r.equipment || []).filter((e) => (node.equipmentIds || []).indexOf(e.id) !== -1);
  const chems = (r.chemicals || []).filter((c) => (node.chemicalIds || []).indexOf(c.id) !== -1);
  const props = r.chemProperties || [];
  const alerts = [];
  const gaps = [];

  const opT = tempC(node.operatingTemperature, node.operatingTemperatureUnit);
  const opTmax = tempC(node.operatingTemperatureMax, node.operatingTemperatureUnit);
  const processT = opTmax !== null ? opTmax : opT;

  for (const ch of chems) {
    const name = ch.canonicalName || ch.name || ch.id;

    // --- flash point -------------------------------------------------------
    const fpP = prop(props, ch.id, 'flashPoint');
    const fp = usableNumber(fpP);
    if (fp === null) {
      if (processT !== null) gaps.push(gap(ch.id, name, node.id, 'flashPoint', ['TEMP_ABOVE_FLASH', 'TEMP_NEAR_FLASH', 'STATIC_CREDIBLE']));
    } else if (processT !== null) {
      if (processT >= fp) {
        alerts.push(
          alert({
            rule: 'TEMP_ABOVE_FLASH',
            severity: 'HIGH',
            chemicalId: ch.id,
            chemicalName: name,
            nodeId: node.id,
            nodeLabel,
            title: name + ' handled at or above its flash point',
            fact: 'Flash point of ' + name + ' = ' + fp + ' °C',
            source: srcLabel(fpP),
            processContext: 'Node operating temperature ' + processT + ' °C',
            mechanism: 'A flammable atmosphere can exist in the vapour space and at any opening; an ignition source is then sufficient for a fire or deflagration.',
            review: 'Confirm inerting, vapour containment and ignition-source control for this node, and record the basis in the worksheet.',
            arithmetic: processT + ' °C >= ' + fp + ' °C',
            sourceRefs: refsOf(fpP),
            suggestParameters: [{ parameter: 'temperature', guideword: 'MORE' }, { parameter: 'staticCharge', guideword: 'AS_WELL_AS' }],
          })
        );
      } else if (processT >= fp - NEAR_FLASH_K) {
        alerts.push(
          alert({
            rule: 'TEMP_NEAR_FLASH',
            severity: 'MEDIUM',
            chemicalId: ch.id,
            chemicalName: name,
            nodeId: node.id,
            nodeLabel,
            title: 'Small margin to the flash point of ' + name,
            fact: 'Flash point of ' + name + ' = ' + fp + ' °C',
            source: srcLabel(fpP),
            processContext: 'Node operating temperature ' + processT + ' °C (margin ' + (fp - processT).toFixed(1) + ' K)',
            mechanism: 'A temperature excursion of less than ' + NEAR_FLASH_K + ' K produces a flammable atmosphere.',
            review: 'Check the high-temperature alarm / trip setting against this margin.',
            arithmetic: processT + ' °C >= ' + fp + ' - ' + NEAR_FLASH_K + ' °C',
            sourceRefs: refsOf(fpP),
            suggestParameters: [{ parameter: 'temperature', guideword: 'MORE' }],
          })
        );
      }
    }

    // --- boiling point -----------------------------------------------------
    const bpP = prop(props, ch.id, 'boilingPoint');
    const bp = usableNumber(bpP);
    if (bp !== null && processT !== null && processT >= bp) {
      alerts.push(
        alert({
          rule: 'TEMP_ABOVE_BOILING',
          severity: 'HIGH',
          chemicalId: ch.id,
          chemicalName: name,
          nodeId: node.id,
          nodeLabel,
          title: name + ' at or above its boiling point',
          fact: 'Boiling point of ' + name + ' = ' + bp + ' °C',
          source: srcLabel(bpP),
          processContext: 'Node operating temperature ' + processT + ' °C',
          mechanism: 'Rapid vaporization raises pressure in a closed system and can overpressure the vessel or discharge through the vent.',
          review: 'Verify the relief and vent arrangement against the vaporization rate, and confirm the design pressure.',
          arithmetic: processT + ' °C >= ' + bp + ' °C',
          sourceRefs: refsOf(bpP),
          suggestParameters: [{ parameter: 'pressure', guideword: 'MORE' }, { parameter: 'temperature', guideword: 'MORE' }],
        })
      );
    }

    // --- decomposition -----------------------------------------------------
    const dcP = prop(props, ch.id, 'decompositionTemperature');
    const dc = usableNumber(dcP);
    if (dc === null && processT !== null && (node.isReactionStep || node.hasHeating || eq.some((e) => e.heatingSystem))) {
      gaps.push(gap(ch.id, name, node.id, 'decompositionTemperature', ['TEMP_ABOVE_DECOMP', 'TEMP_NEAR_DECOMP']));
    } else if (dc !== null && processT !== null) {
      if (processT >= dc) {
        alerts.push(
          alert({
            rule: 'TEMP_ABOVE_DECOMP',
            severity: 'CRITICAL',
            chemicalId: ch.id,
            chemicalName: name,
            nodeId: node.id,
            nodeLabel,
            title: name + ' handled at or above its decomposition onset',
            fact: 'Decomposition onset of ' + name + ' = ' + dc + ' °C',
            source: srcLabel(dcP),
            processContext: 'Node operating temperature ' + processT + ' °C',
            mechanism: 'Self-heating decomposition can run away, generating gas and pressure faster than a conventional relief can handle.',
            review: 'This needs a thermal-stability assessment (DSC / ARC data) and a relief sizing basis for the decomposition case, not only a HAZOP row.',
            arithmetic: processT + ' °C >= ' + dc + ' °C',
            sourceRefs: refsOf(dcP),
            suggestParameters: [{ parameter: 'temperature', guideword: 'MORE' }, { parameter: 'reaction', guideword: 'OTHER_THAN' }],
          })
        );
      } else if (processT >= dc - NEAR_DECOMP_K) {
        alerts.push(
          alert({
            rule: 'TEMP_NEAR_DECOMP',
            severity: 'HIGH',
            chemicalId: ch.id,
            chemicalName: name,
            nodeId: node.id,
            nodeLabel,
            title: 'Small margin to decomposition onset for ' + name,
            fact: 'Decomposition onset of ' + name + ' = ' + dc + ' °C',
            source: srcLabel(dcP),
            processContext: 'Node operating temperature ' + processT + ' °C (margin ' + (dc - processT).toFixed(1) + ' K)',
            mechanism: 'A heating-system failure or loss of agitation can carry the mass through the onset temperature.',
            review: 'Check the maximum attainable temperature on loss of cooling, and the high-temperature trip setting.',
            arithmetic: processT + ' °C >= ' + dc + ' - ' + NEAR_DECOMP_K + ' °C',
            sourceRefs: refsOf(dcP),
            suggestParameters: [{ parameter: 'cooling', guideword: 'NO' }],
          })
        );
      }
    }

    // --- vapour pressure vs design pressure --------------------------------
    const vpP = prop(props, ch.id, 'vapourPressure');
    const vp = usableNumber(vpP);
    if (vp !== null) {
      const vpBar = toBar(vp, vpP.unit || 'bar');
      for (const e of eq) {
        if (!e.designPressure) continue;
        const dp = toBar(e.designPressure, e.designPressureUnit || 'barg');
        const cmp = comparePressure(vpBar, dp);
        if (cmp && cmp.comparable && cmp.delta > 0) {
          alerts.push(
            alert({
              rule: 'VP_EXCEEDS_DESIGN',
              severity: 'CRITICAL',
              chemicalId: ch.id,
              chemicalName: name,
              nodeId: node.id,
              nodeLabel,
              title: 'Vapour pressure of ' + name + ' exceeds the design pressure of ' + (e.tag || e.id),
              fact: 'Vapour pressure ' + vp + ' ' + (vpP.unit || 'bar') + (vpP.atTemperature ? ' at ' + vpP.atTemperature + ' °C' : ''),
              source: srcLabel(vpP),
              processContext: (e.tag || e.id) + ' design pressure ' + e.designPressure + ' ' + (e.designPressureUnit || 'barg'),
              mechanism: 'A closed vessel can reach a pressure above its design rating on temperature alone.',
              review: 'Confirm the relief set pressure and the design basis for the vessel, and record the temperature at which the vapour pressure was measured.',
              arithmetic: vpBar.value + ' bar > ' + dp.value + ' bar',
              sourceRefs: refsOf(vpP),
              suggestParameters: [{ parameter: 'pressure', guideword: 'MORE' }],
            })
          );
        } else if (cmp && !cmp.comparable) {
          gaps.push({
            kind: 'DATA_GAP',
            chemicalId: ch.id,
            chemicalName: name,
            nodeId: node.id,
            property: 'pressureBasis',
            propertyLabel: 'Pressure basis (gauge / absolute)',
            blocks: ['VP_EXCEEDS_DESIGN'],
            detail: 'Cannot compare vapour pressure with design pressure: ' + cmp.reason + '. State gauge or absolute on both values.',
            resolveWith: ['PROJECT_DOCUMENT'],
          });
        }
      }
    }

    // --- combustible dust --------------------------------------------------
    const cdP = prop(props, ch.id, 'combustibleDust');
    const cd = usableBool(cdP);
    const powderInNode = /solid|powder|granule|flake/i.test(ch.physicalState || '') || eq.some((e) => e.powderHandling);
    if (powderInNode) {
      if (cd === null) {
        gaps.push(gap(ch.id, name, node.id, 'combustibleDust', ['DUST_EXPLOSION_CREDIBLE']));
      } else if (cd === true) {
        const kst = usableNumber(prop(props, ch.id, 'kst'));
        const mie = usableNumber(prop(props, ch.id, 'mie'));
        alerts.push(
          alert({
            rule: 'DUST_EXPLOSION_CREDIBLE',
            severity: 'HIGH',
            chemicalId: ch.id,
            chemicalName: name,
            nodeId: node.id,
            nodeLabel,
            title: 'Combustible dust handled in this node',
            fact: name + ' has combustible-dust evidence' + (kst !== null ? ' (Kst ' + kst + ' bar·m/s)' : '') + (mie !== null ? ', MIE ' + mie + ' mJ' : ''),
            source: srcLabel(cdP),
            processContext: 'Powder / granular handling in ' + (eq.map((e) => e.tag || e.id).join(', ') || 'this node'),
            mechanism: 'A dust cloud in a confined volume with an ignition source can deflagrate; an unrelieved enclosure then fails.',
            review: 'Confirm dust-cloud control, ignition-source control (including static), and whether explosion protection is required for the enclosure.',
            sourceRefs: refsOf(cdP),
            suggestParameters: [{ parameter: 'staticCharge', guideword: 'AS_WELL_AS' }, { parameter: 'ventilation', guideword: 'NO' }],
          })
        );
      }
    }

    // --- static ------------------------------------------------------------
    const lowCond = usableBool(prop(props, ch.id, 'conductivityLow'));
    const staticCredible = (powderInNode && cd === true) || (lowCond === true && fp !== null && processT !== null && processT >= fp - NEAR_FLASH_K);
    if (staticCredible && (node.hasCharging || node.hasTransfer)) {
      const hasEarthing = (r.safeguards || []).some((s) => s.nodeId === node.id && /earth|ground|bond/i.test(s.text || ''));
      alerts.push(
        alert({
          rule: 'STATIC_CREDIBLE',
          severity: hasEarthing ? 'MEDIUM' : 'HIGH',
          chemicalId: ch.id,
          chemicalName: name,
          nodeId: node.id,
          nodeLabel,
          title: 'Static ignition credible during charging / transfer',
          fact: powderInNode ? name + ' is a combustible powder' : name + ' is a low-conductivity liquid handled near its flash point',
          source: srcLabel(powderInNode ? cdP : prop(props, ch.id, 'conductivityLow')),
          processContext: 'Charging or transfer operation in ' + (eq.map((e) => e.tag || e.id).join(', ') || 'this node'),
          mechanism: 'Charge separation during pouring or pneumatic transfer can produce a brush or cone discharge with enough energy to ignite the atmosphere.',
          review: hasEarthing
            ? 'Earthing and bonding are recorded on this node; confirm the grounding-resistance verification interval and that it covers drums, hoses and the operator.'
            : 'No earthing or bonding safeguard is recorded on this node. Confirm the arrangement and add it to the worksheet.',
          sourceRefs: refsOf(cdP),
          suggestParameters: [{ parameter: 'staticCharge', guideword: 'AS_WELL_AS' }],
        })
      );
    }

    // --- MOC compatibility -------------------------------------------------
    const incMocP = prop(props, ch.id, 'incompatibleMoc');
    const incMoc = usableList(incMocP);
    if (incMoc) {
      for (const e of eq) {
        const moc = String(e.materialOfConstruction || '');
        if (!moc) continue;
        const hit = incMoc.filter((m) => moc.toLowerCase().indexOf(String(m).toLowerCase()) !== -1)[0];
        if (hit) {
          alerts.push(
            alert({
              rule: 'MOC_INCOMPATIBLE',
              severity: 'HIGH',
              chemicalId: ch.id,
              chemicalName: name,
              nodeId: node.id,
              nodeLabel,
              title: name + ' is incompatible with the material of construction of ' + (e.tag || e.id),
              fact: name + ' is incompatible with ' + hit,
              source: srcLabel(incMocP),
              processContext: (e.tag || e.id) + ' material of construction: ' + moc,
              mechanism: 'Corrosion or attack of the containment boundary leads to loss of containment.',
              review: 'Confirm the material selection against the supplier SDS and the service conditions.',
              sourceRefs: refsOf(incMocP),
              suggestParameters: [{ parameter: 'transfer', guideword: 'OTHER_THAN' }],
            })
          );
        }
      }
    }
  }

  // --- chemical-chemical incompatibility within the node --------------------
  for (let i = 0; i < chems.length; i += 1) {
    for (let j = i + 1; j < chems.length; j += 1) {
      const a = chems[i];
      const b = chems[j];
      const aP = prop(props, a.id, 'incompatibleMaterials');
      const bP = prop(props, b.id, 'incompatibleMaterials');
      const aList = usableList(aP) || [];
      const bList = usableList(bP) || [];
      const aName = a.canonicalName || a.name || a.id;
      const bName = b.canonicalName || b.name || b.id;
      const aHits = aList.filter((x) => matchesChem(x, b));
      const bHits = bList.filter((x) => matchesChem(x, a));
      if (aHits.length || bHits.length) {
        const src = aHits.length ? aP : bP;
        alerts.push(
          alert({
            rule: 'INCOMPATIBLE_COLOCATED',
            severity: 'HIGH',
            chemicalId: a.id,
            chemicalName: aName + ' + ' + bName,
            nodeId: node.id,
            nodeLabel,
            title: aName + ' and ' + bName + ' are incompatible and both present in this node',
            fact: (aHits.length ? aName + ' lists ' + aHits.join(', ') : bName + ' lists ' + bHits.join(', ')) + ' as incompatible',
            source: srcLabel(src),
            processContext: 'Both materials are charged to or present in ' + (eq.map((e) => e.tag || e.id).join(', ') || 'this node'),
            mechanism: 'Unintended contact — wrong charging order, cross-contamination or residue — can produce a hazardous reaction.',
            review: 'Confirm the charging sequence, the interlocks or procedural controls that enforce it, and the cleaning regime between batches.',
            sourceRefs: refsOf(src),
            suggestParameters: [{ parameter: 'charging', guideword: 'BEFORE' }, { parameter: 'composition', guideword: 'AS_WELL_AS' }],
          })
        );
      }
    }
  }

  // --- exotherm vs cooling --------------------------------------------------
  if (node.isReactionStep && node.exothermic) {
    const coolingSafeguard = (r.safeguards || []).some((s) => s.nodeId === node.id && /cool|chill|brine|quench|jacket/i.test(s.text || ''));
    const hasCoolingSystem = eq.some((e) => e.coolingSystem) || (node.utilities || []).some((u) => ['coolingWater', 'chilledWater', 'brine'].indexOf(u) !== -1);
    if (!hasCoolingSystem || !coolingSafeguard) {
      alerts.push(
        alert({
          rule: 'EXOTHERM_VS_COOLING',
          severity: 'HIGH',
          chemicalId: null,
          chemicalName: null,
          nodeId: node.id,
          nodeLabel,
          title: 'Exothermic step with no recorded cooling safeguard',
          fact: 'The node is declared an exothermic reaction step',
          source: 'Project node record',
          processContext: hasCoolingSystem ? 'A cooling system exists but no cooling safeguard is recorded on the node' : 'No cooling system is declared on the node',
          mechanism: 'Heat generation exceeding the removal capacity raises temperature, which raises the rate — a runaway.',
          review: 'Record the heat-of-reaction basis, the cooling capacity, the maximum attainable temperature on loss of cooling, and the safeguard that detects it.',
          suggestParameters: [{ parameter: 'cooling', guideword: 'NO' }, { parameter: 'reaction', guideword: 'MORE' }],
        })
      );
    }
  }

  return { alerts, gaps, engine: ALERTS_VERSION, nodeId: node.id };
}

function matchesChem(incompatibilityText, chem) {
  const t = String(incompatibilityText || '').toLowerCase().trim();
  if (!t) return false;
  const names = [chem.canonicalName, chem.name].concat(chem.synonyms || []).filter(Boolean).map((s) => String(s).toLowerCase());
  for (const n of names) {
    if (!n) continue;
    if (t.indexOf(n) !== -1 || n.indexOf(t) !== -1) return true;
  }
  // class-level matches
  const classes = [
    [/\bacids?\b/, /acid/],
    [/\bbases?\b|\balkal/, /hydroxide|amine|base/],
    [/\boxidi[sz]/, /peroxide|nitrate|chlorate|permanganate/],
    [/\bwater\b|\bmoisture\b/, /^water$/],
  ];
  for (const [inc, chemRe] of classes) {
    if (inc.test(t) && names.some((n) => chemRe.test(n))) return true;
  }
  return false;
}

/** Run alerts across every node and aggregate. */
function runProjectAlerts(req) {
  const r = req || {};
  const alerts = [];
  const gaps = [];
  for (const node of r.nodes || []) {
    const out = runNodeAlerts({
      node,
      equipment: r.equipment,
      chemicals: r.chemicals,
      chemProperties: r.chemProperties,
      safeguards: r.safeguards,
    });
    alerts.push.apply(alerts, out.alerts);
    gaps.push.apply(gaps, out.gaps);
  }
  const order = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, REVIEW: 3 };
  alerts.sort((a, b) => (order[a.severity] === undefined ? 9 : order[a.severity]) - (order[b.severity] === undefined ? 9 : order[b.severity]));
  return { alerts, gaps: dedupeGaps(gaps), engine: ALERTS_VERSION };
}

function dedupeGaps(gaps) {
  const seen = new Map();
  for (const g of gaps) {
    const k = (g.chemicalId || '') + '|' + g.property;
    if (!seen.has(k)) seen.set(k, Object.assign({}, g, { nodeIds: [g.nodeId] }));
    else {
      const e = seen.get(k);
      if (e.nodeIds.indexOf(g.nodeId) === -1) e.nodeIds.push(g.nodeId);
    }
  }
  return Array.from(seen.values());
}

/** A standard is an obligation only where a route to mandatory status is recorded. */
function standardIsMandatory(instrument) {
  if (!instrument || !instrument.isStandard) return { mandatory: false, reason: 'NOT_A_STANDARD' };
  const via = instrument.mandatoryVia || [];
  if (via.length === 0) {
    return {
      mandatory: false,
      reason: 'NO_ADOPTION_ROUTE_RECORDED',
      detail: 'This is a standard. It is mandatory only where adopted by law, licence, consent, contract or a company standard. Record that route before treating it as an obligation.',
    };
  }
  return { mandatory: true, reason: 'ADOPTED', via };
}
