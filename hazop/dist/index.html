<title>HAZOP Master</title>
<meta name="description" content="Industrial HAZOP, chemical-hazard and regulatory-compliance platform with deterministic risk and threshold engines.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>/* HAZOP MASTER AI — instrument-panel palette.
   Neutrals carry a slight cyan-teal bias so they read as chosen, not inherited.
   Every colour is a token on :root; the dark blocks only redefine tokens. */

:root {
  --bg: #F1F4F3;
  --surface: #FFFFFF;
  --surface-2: #E8EDEB;
  --surface-3: #DCE4E1;
  --ink: #101E1D;
  --ink-2: #3E5350;
  --muted: #69807C;
  --line: #CFD9D6;
  --line-strong: #B3C1BD;
  --accent: #0C6B60;
  --accent-soft: #D7E8E5;
  --accent-ink: #FFFFFF;
  --ochre: #A9661A;
  --ochre-soft: #F6E7D3;

  --risk-trivial: #3F6B4C;
  --risk-tolerable: #6E7F35;
  --risk-moderate: #B07C10;
  --risk-substantial: #B84C17;
  --risk-intolerable: #92162A;
  --risk-none: #8496932e;

  --ok: #2F6B4F;
  --warn: #9A6B08;
  --high: #B84C17;
  --critical: #92162A;
  --info: #0C6B60;
  --ai: #5C4F86;

  --shadow-1: 0 1px 2px rgba(16, 30, 29, .06), 0 1px 1px rgba(16, 30, 29, .04);
  --shadow-2: 0 8px 24px rgba(16, 30, 29, .12), 0 2px 6px rgba(16, 30, 29, .06);

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --rail-w: 224px;
  --chat-w: 372px;
  --bar-h: 54px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1211;
    --surface: #121D1C;
    --surface-2: #182625;
    --surface-3: #1F2F2D;
    --ink: #E4EDEB;
    --ink-2: #A6B8B5;
    --muted: #7A8D8A;
    --line: #223231;
    --line-strong: #314442;
    --accent: #43BCAB;
    --accent-soft: #10312D;
    --accent-ink: #04201C;
    --ochre: #D9974A;
    --ochre-soft: #32240F;

    --risk-trivial: #5E9B72;
    --risk-tolerable: #9BAE55;
    --risk-moderate: #DCA82B;
    --risk-substantial: #E27341;
    --risk-intolerable: #D9536A;
    --risk-none: #8496931f;

    --ok: #5E9B72;
    --warn: #DCA82B;
    --high: #E27341;
    --critical: #D9536A;
    --info: #43BCAB;
    --ai: #9B8BD0;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 10px 30px rgba(0, 0, 0, .5);
  }
}

:root[data-theme="dark"] {
  --bg: #0A1211;
  --surface: #121D1C;
  --surface-2: #182625;
  --surface-3: #1F2F2D;
  --ink: #E4EDEB;
  --ink-2: #A6B8B5;
  --muted: #7A8D8A;
  --line: #223231;
  --line-strong: #314442;
  --accent: #43BCAB;
  --accent-soft: #10312D;
  --accent-ink: #04201C;
  --ochre: #D9974A;
  --ochre-soft: #32240F;

  --risk-trivial: #5E9B72;
  --risk-tolerable: #9BAE55;
  --risk-moderate: #DCA82B;
  --risk-substantial: #E27341;
  --risk-intolerable: #D9536A;
  --risk-none: #8496931f;

  --ok: #5E9B72;
  --warn: #DCA82B;
  --high: #E27341;
  --critical: #D9536A;
  --info: #43BCAB;
  --ai: #9B8BD0;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 10px 30px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-radius: 3px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------------------------------------------------------------- layout */

#app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr) 0;
  grid-template-rows: auto 1fr;
  grid-template-areas: "bar bar bar" "rail main chat";
  height: 100%;
}

#app.with-chat { grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--chat-w); }

/* ------------------------------------------------------------- top bar */

#topbar {
  grid-area: bar;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  padding-top: env(safe-area-inset-top, 0px);
  min-height: var(--bar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 30;
}

.brand { display: flex; align-items: center; gap: 9px; flex: none; }

.brand-mark {
  width: 26px; height: 26px; flex: none;
  border-radius: 5px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid; place-items: center;
  font-family: var(--mono);
  font-size: 11px; font-weight: 700; letter-spacing: -.5px;
}

.brand-name {
  font-weight: 600; font-size: 13px; letter-spacing: -.1px; white-space: nowrap;
}
.brand-sub {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted); display: block; margin-top: -2px;
}

.bar-sep { width: 1px; align-self: stretch; background: var(--line); margin: 10px 0; flex: none; }

.bar-spacer { flex: 1 1 auto; min-width: 0; }

/* The chips are nowrap by design, so this row has to be allowed to wrap and
   the select has to be allowed to shrink — otherwise the row sets a floor
   wider than a phone and the whole page scrolls sideways. */
.project-pick {
  display: flex; align-items: center; gap: 8px;
  min-width: 0; max-width: 100%; flex: 0 1 auto; flex-wrap: wrap;
}
.project-pick select {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px;
  min-width: 0; max-width: 280px; flex: 1 1 150px;
  font-weight: 500;
}

.rev-chip {
  font-family: var(--mono); font-size: 10.5px; padding: 3px 7px; border-radius: 4px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
  white-space: nowrap;
}

/* ------------------------------------------------------------ meters */

.meters { display: flex; gap: 16px; flex: none; }
.meter { min-width: 104px; }
.meter-top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted);
}
.meter-val { font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.meter-track { height: 3px; background: var(--surface-3); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.meter-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
.meter-fill.warn { background: var(--warn); }
.meter-fill.low { background: var(--high); }

/* -------------------------------------------------------------- rail */

#rail {
  grid-area: rail;
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  padding: 10px 0 24px;
}

.rail-group { margin-bottom: 4px; }
.rail-group-label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); padding: 10px 14px 5px;
}

.rail-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; text-align: left;
  padding: 6px 14px; border: 0; background: none; cursor: pointer;
  color: var(--ink-2); font-size: 13px;
  border-left: 2px solid transparent;
}
.rail-item:hover { background: var(--surface-2); color: var(--ink); }
.rail-item[aria-current="page"] {
  background: var(--accent-soft); color: var(--ink); font-weight: 600;
  border-left-color: var(--accent);
}
.rail-item .ri-label { flex: 1; min-width: 0; }
.rail-item .ri-count {
  font-family: var(--mono); font-size: 10.5px; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.rail-item .ri-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--high); flex: none;
}

/* -------------------------------------------------------------- main */

#main { grid-area: main; overflow-y: auto; min-width: 0; }
.page { padding: 18px 20px 72px; max-width: 1500px; }
.page.wide { max-width: none; }

.page-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.page-title { font-size: 21px; font-weight: 600; letter-spacing: -.35px; margin: 0; text-wrap: balance; }
.page-sub { color: var(--muted); margin: 3px 0 18px; max-width: 74ch; font-size: 12.5px; }
.page-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-left: auto; }

.eyebrow {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 3px;
}

/* ------------------------------------------------------------ chat */

#chat {
  grid-area: chat;
  background: var(--surface);
  border-left: 1px solid var(--line);
  display: none;
  flex-direction: column;
  min-width: 0;
}
#app.with-chat #chat { display: flex; }

.chat-head {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-bottom: 1px solid var(--line);
}
.chat-head h2 { font-size: 13px; margin: 0; font-weight: 600; flex: 1; }
.chat-log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.chat-foot { border-top: 1px solid var(--line); padding: 9px; }
.chat-foot textarea {
  width: 100%; resize: vertical; min-height: 58px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
}

.msg { font-size: 12.5px; }
.msg-role {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 3px;
}
.msg-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .msg-body {
  background: var(--accent-soft); padding: 7px 9px; border-radius: 6px;
}
.msg.ai .msg-body { border-left: 2px solid var(--ai); padding-left: 9px; }
.msg.system .msg-body { color: var(--muted); font-style: italic; }

.chat-suggest { display: flex; flex-direction: column; gap: 5px; }
.chat-suggest button {
  text-align: left; font-size: 12px; padding: 6px 8px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  color: var(--ink-2);
}
.chat-suggest button:hover { border-color: var(--accent); color: var(--ink); }

/* ------------------------------------------------------------ cards */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  box-shadow: var(--shadow-1);
}
.card + .card { margin-top: 12px; }
.card-title { font-size: 13.5px; font-weight: 600; margin: 0 0 2px; }
.card-note { color: var(--muted); font-size: 12px; margin: 0 0 10px; }

.grid { display: grid; gap: 12px; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); }

/* Plain tiles: no card chrome, just a rule. Cards are reserved for
   objects you act on, so the hierarchy stays readable. */
.tile {
  padding: 10px 0 10px 12px;
  border-left: 2px solid var(--line-strong);
}
.tile-label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted);
}
.tile-value {
  font-size: 23px; font-weight: 600; letter-spacing: -.5px; font-variant-numeric: tabular-nums;
  line-height: 1.15;
}
.tile-note { font-size: 11.5px; color: var(--muted); }
.tile.alert { border-left-color: var(--high); }
.tile.alert .tile-value { color: var(--high); }
.tile.crit { border-left-color: var(--critical); }
.tile.crit .tile-value { color: var(--critical); }
.tile.ok { border-left-color: var(--ok); }
.tile.accent { border-left-color: var(--accent); }

.kv { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* ----------------------------------------------------------- buttons */

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink); cursor: pointer; font-size: 12.5px; font-weight: 500;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--critical); border-color: var(--critical); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.sm { padding: 3px 8px; font-size: 11.5px; }
.btn.icon { padding: 4px 7px; }

.btn-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }

/* ------------------------------------------------------------ forms */

.field { display: block; margin-bottom: 10px; }
.field > span {
  display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 3px;
}
.field input, .field select, .field textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px;
}
.field textarea { resize: vertical; min-height: 66px; }
.field-hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.field-err { font-size: 11.5px; color: var(--critical); margin-top: 3px; }
.field.inline { display: flex; align-items: center; gap: 8px; }
.field.inline > span { margin: 0; }
.field.inline input[type="checkbox"] { width: auto; }

.tri-group { display: flex; gap: 4px; }
.tri-group button {
  flex: 1; padding: 4px 6px; font-size: 11.5px; border: 1px solid var(--line);
  background: var(--surface-2); cursor: pointer; border-radius: 5px; color: var(--ink-2);
}
.tri-group button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tri-group button.unset[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); border-color: var(--line-strong); }

/* ------------------------------------------------------------ badges */

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
  padding: 2px 6px; border-radius: 4px; white-space: nowrap;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line);
}
.badge.verified { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 34%, transparent); }
.badge.confirmed { background: color-mix(in srgb, var(--info) 14%, transparent); color: var(--info); border-color: color-mix(in srgb, var(--info) 30%, transparent); }
.badge.extracted { background: var(--surface-2); color: var(--ink-2); }
.badge.sourced { background: var(--ochre-soft); color: var(--ochre); border-color: color-mix(in srgb, var(--ochre) 34%, transparent); }
.badge.inferred { background: color-mix(in srgb, var(--ai) 14%, transparent); color: var(--ai); border-color: color-mix(in srgb, var(--ai) 34%, transparent); }
.badge.conflict { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); border-color: color-mix(in srgb, var(--critical) 38%, transparent); font-weight: 600; }
.badge.missing { background: none; color: var(--muted); border-style: dashed; }
.badge.na { background: none; color: var(--muted); }

.risk-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  padding: 2px 7px; border-radius: 4px; white-space: nowrap;
  color: #fff;
}
.risk-badge .rb-score { font-variant-numeric: tabular-nums; opacity: .85; }
.risk-TRIVIAL, .risk-LOW { background: var(--risk-trivial); }
.risk-TOLERABLE { background: var(--risk-tolerable); }
.risk-MODERATE, .risk-MEDIUM { background: var(--risk-moderate); color: #1a1405; }
.risk-SUBSTANTIAL, .risk-HIGH { background: var(--risk-substantial); }
.risk-INTOLERABLE, .risk-EXTREME { background: var(--risk-intolerable); }
.risk-none { background: none; border: 1px dashed var(--line-strong); color: var(--muted); }

.sev-stripe { width: 3px; border-radius: 2px; align-self: stretch; flex: none; }
.sev-CRITICAL { background: var(--critical); }
.sev-HIGH { background: var(--high); }
.sev-MEDIUM { background: var(--warn); }
.sev-REVIEW { background: var(--info); }

.pill {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2);
}
.pill.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.tag {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 3px;
  background: var(--surface-3); color: var(--ink-2);
}

/* ------------------------------------------------------------ tables */

.table-wrap {
  overflow: auto; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); max-height: 74vh;
}
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
/* A dense register is a spreadsheet: let it keep its column widths and scroll
   inside its own container rather than compressing every column to nothing. */
table.wide-grid { min-width: 1480px; }
table.wide-register { min-width: 1180px; }
thead th {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface-2);
  text-align: left; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em;
  text-transform: uppercase; color: var(--muted); font-weight: 500;
  padding: 7px 9px; border-bottom: 1px solid var(--line-strong); white-space: nowrap;
}
tbody td { padding: 6px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--surface-2); }
tbody tr.expanded { background: var(--accent-soft); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
td.mono { font-family: var(--mono); font-size: 11.5px; }
td.nowrap { white-space: nowrap; }
.t-detail td { background: var(--surface-2); padding: 12px 14px; }
.row-head { display: flex; gap: 8px; align-items: flex-start; }

.cell-edit {
  width: 100%; background: none; border: 1px solid transparent; border-radius: 4px;
  padding: 2px 4px; margin: -2px -4px; min-height: 22px;
}
.cell-edit:hover { border-color: var(--line-strong); background: var(--surface); }
.cell-edit:focus { border-color: var(--accent); background: var(--surface); outline: none; }

.list-compact { margin: 0; padding-left: 15px; }
.list-compact li { margin-bottom: 1px; }
.list-none { list-style: none; padding: 0; margin: 0; }

/* ------------------------------------------------------------ misc */

.empty {
  border: 1px dashed var(--line-strong); border-radius: 8px;
  padding: 26px 18px; text-align: center; color: var(--muted);
}
.empty h3 { color: var(--ink); font-size: 14px; margin: 0 0 5px; }
.empty p { margin: 0 auto 12px; max-width: 54ch; font-size: 12.5px; }

.note {
  border-left: 2px solid var(--accent); background: var(--accent-soft);
  padding: 9px 11px; border-radius: 0 6px 6px 0; font-size: 12.5px;
}
.note.warn { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.note.crit { border-left-color: var(--critical); background: color-mix(in srgb, var(--critical) 9%, transparent); }
.note.plain { border-left-color: var(--line-strong); background: var(--surface-2); }
.note strong { font-weight: 600; }

.chain {
  display: grid; gap: 5px; font-size: 12.5px;
  grid-template-columns: 118px 1fr;
}
.chain dt {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); padding-top: 2px;
}
.chain dd { margin: 0; }

.filters {
  display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
  margin-bottom: 10px; padding: 8px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
}
.filters select, .filters input {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px;
  font-size: 12px;
}
.filters label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted);
}

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tab {
  padding: 6px 11px; border: 0; background: none; cursor: pointer; color: var(--muted);

const FIELD_STATUS = Object.freeze([
  'VERIFIED',
  'USER_CONFIRMED',
  'DOCUMENT_EXTRACTED',
  'WEB_SOURCED',
  'AI_INFERRED',
  'CONFLICT',
  'MISSING',
  'NOT_APPLICABLE',
]);

// Higher number = stronger. Used only when a project explicitly enables
// automatic resolution; equal ranks never resolve automatically.
const PRECEDENCE = Object.freeze({
  VERIFIED: 50,
  USER_CONFIRMED: 40,
  DOCUMENT_EXTRACTED: 30,
  WEB_SOURCED: 20,
  AI_INFERRED: 10,
  CONFLICT: 0,
  MISSING: 0,
  NOT_APPLICABLE: 0,
});

const USABLE_STATUS = Object.freeze([

  'USER_CONFIRMED',
  'DOCUMENT_EXTRACTED',

]);

  return USABLE_STATUS.indexOf(status) !== -1;

  return Object.prototype.hasOwnProperty.call(PRECEDENCE, status) ? PRECEDENCE[status] : -1;

/**
 * Decide what a set of candidate FieldValues for ONE target field resolves to.
 * Never averages, never picks arbitrarily.
 *
 * @param {Array} candidates  [{ value, normalizedValue, normalizedUnit, status, sourceRefs, sourceClass }]
 * @param {Object} opts       { allowPrecedence: boolean }
 * @returns {Object} { status, value, reason, conflicting, chosen }
 */
function sourcePrecedence(candidates, opts) {
  const options = opts || {};
  const list = (candidates || []).filter((c) => c && c.status !== 'MISSING');
  if (list.length === 0) return { status: 'MISSING', value: null, reason: 'NO_CANDIDATES', conflicting: [] };
  if (list.length === 1) {
    return { status: list[0].status, value: list[0], reason: 'SINGLE_SOURCE', conflicting: [], chosen: list[0] };
  }

  // Group by comparable value. Normalized value+unit when present, else raw value.
  const key = (c) =>
    c.normalizedValue !== undefined && c.normalizedValue !== null
      ? `${c.normalizedValue}|${c.normalizedUnit || ''}`
      : `raw:${String(c.value).trim().toLowerCase()}`;

  const groups = new Map();
  for (const c of list) {
    const k = key(c);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(c);
  }

  if (groups.size === 1) {
    // All agree. Report the strongest status present.
    const best = list.slice().sort((a, b) => statusRank(b.status) - statusRank(a.status))[0];
    return { status: best.status, value: best, reason: 'SOURCES_AGREE', conflicting: [], chosen: best };

  // Disagreement.
  const ranked = list.slice().sort((a, b) => statusRank(b.status) - statusRank(a.status));
  const topRank = statusRank(ranked[0].status);
  const atTop = ranked.filter((c) => statusRank(c.status) === topRank);

  if (options.allowPrecedence && atTop.length === 1) {

      status: atTop[0].status,
      value: atTop[0],
      reason: 'RESOLVED_BY_PRECEDENCE',
      conflicting: list.filter((c) => c !== atTop[0]),
      chosen: atTop[0],

    status: 'CONFLICT',
    value: null,
    reason: options.allowPrecedence ? 'EQUAL_RANK_DISAGREEMENT' : 'PRECEDENCE_DISABLED',
    conflicting: list,
  };
}

 * Guard every applicability status change.
 *
 * @param {Object} req { from, to, actorKind: 'human'|'ai', actorRole, factsAllVerified, thresholdVerified }
 * @returns {Object} { ok, status, reason }
 */
function legalStatusTransition(req) {
  const r = req || {};

    return { ok: false, status: r.from || 'NOT_ENOUGH_DATA', reason: 'UNKNOWN_STATUS' };

  if (r.actorKind === 'ai') {

    return { ok: true, status: to, reason: 'AI_MAY_PROPOSE_UNRESOLVED_STATUS' };

  if (HUMAN_ONLY_APPLICABILITY.indexOf(to) !== -1) {
    if (CONFIRM_ROLES.indexOf(r.actorRole) === -1) {
      return { ok: false, status: r.from || 'NOT_ENOUGH_DATA', reason: 'ROLE_NOT_AUTHORIZED' };
    }

/**
 * Compliance status is computed, never asserted by the AI layer.
 *
 * @param {Object} req { applicability, evidenceExpected[], evidence[], permit, today, actorKind }
 * @returns {Object} { status, gaps[], reason }
 */
function computeComplianceStatus(req) {
  const r = req || {};
  const expected = r.evidenceExpected || [];
  const evidence = r.evidence || [];

  if (r.applicability === 'NOT_APPLICABLE_CONFIRMED') {
    return { status: 'NOT_APPLICABLE', gaps: [], reason: 'NOT_APPLICABLE' };
  }
  if (r.applicability === 'NOT_ENOUGH_DATA' || r.applicability === 'REQUIRES_LEGAL_REVIEW') {
    return { status: 'UNDER_REVIEW', gaps: expected.slice(), reason: 'APPLICABILITY_UNRESOLVED' };

    return { status: 'EXPIRED', gaps: ['PERMIT_EXPIRED:' + (r.permit.number || r.permit.id || '')], reason: 'LINKED_PERMIT_EXPIRED' };

  const satisfied = [];
  const gaps = [];
  for (const item of expected) {
    const hit = evidence.filter((e) => e && e.expects === item);
    if (hit.length === 0) gaps.push(item);
    else if (hit.some((e) => e.status === 'VERIFIED')) satisfied.push(item);

  { key: 'AIR_RELEASE', label: 'Air release', dimension: 'environment' },
  { key: 'WATER_SOIL', label: 'Water / soil contamination', dimension: 'environment' },
  { key: 'WASTE', label: 'Hazardous-waste generation', dimension: 'environment' },
  // Business
  { key: 'EQUIPMENT_DAMAGE', label: 'Equipment damage', dimension: 'business' },
  { key: 'PRODUCTION_LOSS', label: 'Production loss', dimension: 'business' },
  { key: 'OFF_SPEC', label: 'Off-specification product', dimension: 'business' },
  { key: 'PROCESS_DELAY', label: 'Process delay', dimension: 'business' },
  { key: 'NO_CONSEQUENCE', label: 'No safety consequence', dimension: 'none' },
]);

const SAFEGUARD_CLASSES = Object.freeze([
  { key: 'PREVENTION', label: 'Prevention', note: 'Stops the cause from producing the deviation' },
  { key: 'DETECTION', label: 'Detection', note: 'Reveals the deviation in time to act' },
  { key: 'CONTROL', label: 'Control', note: 'Holds the deviation within safe limits' },
  { key: 'MITIGATION', label: 'Mitigation', note: 'Reduces the consequence once it occurs' },
  { key: 'EMERGENCY_RESPONSE', label: 'Emergency response', note: 'Limits harm after the event' },
  { key: 'ADMINISTRATIVE', label: 'Administrative', note: 'Procedure, training, permit, supervision' },
]);

// Cause families a node of a given character should not silently omit.
const EXPECTED_BY_FACT = Object.freeze({
  anyOperation: ['HUMAN_ERROR', 'MAINTENANCE_ERROR'],
  anyUtility: ['UTILITY_FAILURE'],
  agitator: ['AGITATION_FAILURE'],
  heatingSystem: ['OVERHEATING'],
  coolingSystem: ['COOLING_FAILURE'],
  transferPath: ['VALVE_FAILURE', 'BLOCKAGE'],
  charging: ['CHARGE_ERROR', 'WRONG_MATERIAL'],
  reactionStep: ['RUNAWAY', 'INCOMPATIBLE'],
  staticRisk: ['STATIC'],
  pressureRelevant: ['RELIEF_ISOLATION'],
  holdupVessel: ['VENT_BLOCKAGE'],
  hazardousInventory: ['LEAKAGE'],
});

/**
 * Which cause families the node's facts say should be considered, and which of
 * those no scenario on the node has touched yet.
 *
 * @param {Object} facts   from deriveNodeFacts()
 * @param {Array} scenarios  the node's scenarios
 */
function causeFamilyCoverage(facts, scenarios) {
  const expected = new Set();
  for (const factKey of Object.keys(EXPECTED_BY_FACT)) {
    if (facts && facts[factKey]) for (const f of EXPECTED_BY_FACT[factKey]) expected.add(f);
  }
  const used = new Set();
  for (const s of scenarios || []) {
    for (const c of s.causes || []) if (c && c.family) used.add(c.family);
  }
  const missing = Array.from(expected).filter((f) => !used.has(f));
  return {
    expected: Array.from(expected),
    used: Array.from(used),
    missing,
    percent: expected.size ? Math.round(((expected.size - missing.length) / expected.size) * 100) : 100,
    labels: missing.map((k) => (CAUSE_FAMILIES.filter((f) => f.key === k)[0] || {}).label || k),
  };
}

/** The severity dimension a scenario's consequences point at. */
function severityDimensions(consequences) {
  const dims = new Set();
  for (const c of consequences || []) {
    const fam = CONSEQUENCE_FAMILIES.filter((f) => f.key === c.family)[0];
    if (fam && fam.dimension !== 'none') dims.add(fam.dimension);
  }
  return Array.from(dims);
}

// A consequence phrased as a safeguard is a common worksheet error: it credits
// the safeguard before the consequence has been stated.
const SAFEGUARD_PHRASING = [
  /\bprevented by\b/i,
  /\bcontrolled by\b/i,
  /\bmitigated by\b/i,
  /\bno consequence (as|because|since)\b/i,
  /\bavoided (by|due to)\b/i,
  /\btaken care (of )?by\b/i,
];

function consequenceCreditsSafeguard(text) {
  const t = String(text || '');
  for (const p of SAFEGUARD_PHRASING) {
    if (p.test(t)) {
      return {
        flagged: true,
        reason: 'CONSEQUENCE_CREDITS_SAFEGUARD',
        detail: 'Consequences are assessed before safeguard credit. Record the unmitigated consequence here and list the safeguard in the safeguards column.',
      };
    }
  }
  return { flagged: false };
}

/** Free-text cause to a family, for extraction and AI-drafted rows. */
function classifyCause(text) {
  const t = String(text || '').toLowerCase();
  const rules = [
    [/human\s*error|operator\s*error|wrong\s*(valve|drum|material)|manual\s*mistake/, 'HUMAN_ERROR'],
    [/weigh(ing)?\s*(balance|scale)|excess\s*charge|less\s*charge|over\s*charg/, 'CHARGE_ERROR'],
    [/power\s*failure|instrument\s*air|utility|nitrogen\s*failure|steam\s*failure/, 'UTILITY_FAILURE'],
    [/valve\s*(malfunction|fail|pass|stuck)|line-?up/, 'VALVE_FAILURE'],
    [/pump\s*(fail|trip|seal)/, 'PUMP_FAILURE'],
    [/stirrer|agitat|gear\s*box|decoupl/, 'AGITATION_FAILURE'],
    [/chok|block|scal|foul|blind/, 'BLOCKAGE'],
    [/leak|ruptur|gasket|hose\s*fail|corros/, 'LEAKAGE'],
    [/cooling\s*(fail|loss)|chiller|brine/, 'COOLING_FAILURE'],
    [/over\s*heat|high\s*temp|tfh|thermic/, 'OVERHEATING'],
    [/static|earth|ground|bond/, 'STATIC'],
    [/incompat|contaminat|cross/, 'INCOMPATIBLE'],
    [/runaway|decompos|exotherm/, 'RUNAWAY'],
    [/reverse\s*flow|nrv|non\s*return/, 'REVERSE_FLOW'],
    [/instrument|transmitter|sensor|gauge|tg\b|pg\b|calibrat/, 'INSTRUMENT_FAILURE'],
    [/plc|dcs|logic|i\/o/, 'PLC_DCS'],
    [/bypass|override|interlock\s*defeat/, 'TRIP_BYPASS'],
    [/maintenance|permit|shutdown\s*work/, 'MAINTENANCE_ERROR'],
    [/vent\s*(block|plug)|flame\s*arrest/, 'VENT_BLOCKAGE'],
    [/psv|relief|rupture\s*disc/, 'RELIEF_ISOLATION'],
    [/clock|timer|time/, 'HUMAN_ERROR'],
  ];
  for (const [re, key] of rules) if (re.test(t)) return key;
  return null;
}

/** Free-text consequence to a family. */
function classifyConsequence(text) {
  const t = String(text || '').toLowerCase();
  const rules = [
    [/fatal|death/, 'FATALITY'],
    [/dust\s*explosion/, 'DUST_EXPLOSION'],
    [/dust(ing)?\b/, 'EXPOSURE'],
    [/flash\s*fire/, 'FLASH_FIRE'],
    [/pool\s*fire/, 'POOL_FIRE'],
    [/jet\s*fire/, 'JET_FIRE'],
    [/vapour\s*cloud|vce/, 'VCE'],
    [/fire\s*hazard|fire\b/, 'FLASH_FIRE'],
    [/overpressure|ruptur|burst/, 'OVERPRESSURE'],
    [/runaway|decompos/, 'RUNAWAY'],
    [/burn|scald/, 'BURN'],
    [/poison|asphyx|toxic\s*exposure/, 'POISONING'],
    [/exposure|inhalation|skin\s*contact|health\s*impact/, 'EXPOSURE'],
    [/injur/, 'INJURY'],
    [/air\s*(release|emission)/, 'AIR_RELEASE'],
    [/effluent|water\s*contam|soil\s*contam|spill/, 'WATER_SOIL'],
    [/waste/, 'WASTE'],
    [/equipment\s*damage|damage\s*to/, 'EQUIPMENT_DAMAGE'],
    [/production\s*loss|batch\s*loss|utility\/energy\s*loss|energy\s*loss/, 'PRODUCTION_LOSS'],
    [/off\s*spec|quality\s*(impact|affect)|no\s*reaction|improper\s*reaction/, 'OFF_SPEC'],
    [/delay/, 'PROCESS_DELAY'],
    [/no\s*safety\s*consequence/, 'NO_CONSEQUENCE'],
  ];
  for (const [re, key] of rules) if (re.test(t)) return key;
  return null;
}

/** Free-text safeguard to a class. */
function classifySafeguard(text) {
  const t = String(text || '').toLowerCase();
  if (/alarm|detector|detection|monitor|indicat|gauge|analys/.test(t)) return 'DETECTION';
  if (/interlock|trip|shutdown|esd|psv|relief|rupture\s*disc|arrestor|nrv/.test(t)) return 'PREVENTION';
  if (/controller|control\s*loop|thermostat|cascade|dosing\s*control/.test(t)) return 'CONTROL';
  if (/extinguisher|hydrant|sprinkler|deluge|scrubber|dyke|bund|spill\s*kit|dust\s*collector|ventilation|earth|ground|bond/.test(t)) return 'MITIGATION';
  if (/emergency|evacuat|first\s*aid|mutual\s*aid|on-?site\s*plan/.test(t)) return 'EMERGENCY_RESPONSE';
  if (/sop|bmr|training|trained|supervis|permit|checklist|doer|checker|calibrat|pm\b|preventive\s*maintenance|label/.test(t)) return 'ADMINISTRATIVE';
  return null;
}


/* ===== packages/domain/guidewords.js ===== */
// packages/domain/guidewords.js
// Guideword x parameter engine. Emits ONLY combinations that are meaningful for
// the node's own facts, each with the rationale that justified it.
//
// A blind cross-product of 11 guidewords x 22 parameters is 242 rows per node.
// That is how worksheets become unreviewable, so this module is a rule table.

const GUIDEWORD_VERSION = 'guidewords-1.0.0';

const GUIDEWORDS = Object.freeze([
  { key: 'NO', label: 'NO / NOT', meaning: 'The intent is not achieved at all' },
  { key: 'MORE', label: 'MORE', meaning: 'Quantitative increase' },
  { key: 'LESS', label: 'LESS', meaning: 'Quantitative decrease' },
  { key: 'REVERSE', label: 'REVERSE', meaning: 'Opposite of the intent' },
  { key: 'AS_WELL_AS', label: 'AS WELL AS', meaning: 'Intent achieved plus something else' },
  { key: 'PART_OF', label: 'PART OF', meaning: 'Only some of the intent achieved' },
  { key: 'OTHER_THAN', label: 'OTHER THAN', meaning: 'Something completely different' },
  { key: 'EARLY', label: 'EARLY', meaning: 'Before the intended time' },
  { key: 'LATE', label: 'LATE', meaning: 'After the intended time' },
  { key: 'BEFORE', label: 'BEFORE', meaning: 'Out of sequence, earlier' },
  { key: 'AFTER', label: 'AFTER', meaning: 'Out of sequence, later' },
]);

/**
 * Parameter table. `guidewords` lists the guidewords that have a defined
 * semantic for that parameter — this is the core of the rule table.
 * `requires` names the node facts that must be true for the parameter to exist
 * in the node at all.
 */
const PARAMETERS = Object.freeze([
  { key: 'flow', label: 'Flow', guidewords: ['NO', 'MORE', 'LESS', 'REVERSE', 'PART_OF', 'OTHER_THAN'], requires: ['transferPath'], group: 'Process' },
  { key: 'quantity', label: 'Quantity', guidewords: ['NO', 'MORE', 'LESS', 'PART_OF', 'OTHER_THAN'], requires: ['charging'], group: 'Process' },
  { key: 'pressure', label: 'Pressure', guidewords: ['MORE', 'LESS', 'NO'], requires: ['pressureRelevant'], group: 'Process' },
  { key: 'vacuum', label: 'Vacuum', guidewords: ['NO', 'MORE', 'LESS'], requires: ['vacuumService'], group: 'Process' },
  { key: 'temperature', label: 'Temperature', guidewords: ['MORE', 'LESS', 'NO'], requires: ['thermalDuty'], group: 'Process' },
  { key: 'level', label: 'Level', guidewords: ['MORE', 'LESS', 'NO'], requires: ['holdupVessel'], group: 'Process' },
  { key: 'time', label: 'Time', guidewords: ['MORE', 'LESS', 'EARLY', 'LATE'], requires: ['timedStep'], group: 'Process' },
  { key: 'agitation', label: 'Agitation', guidewords: ['NO', 'MORE', 'LESS', 'REVERSE'], requires: ['agitator'], group: 'Process' },
  { key: 'composition', label: 'Composition', guidewords: ['AS_WELL_AS', 'PART_OF', 'OTHER_THAN'], requires: ['multiComponent'], group: 'Quality' },
  { key: 'concentration', label: 'Concentration', guidewords: ['MORE', 'LESS', 'OTHER_THAN'], requires: ['solutionHandling'], group: 'Quality' },
  { key: 'ph', label: 'pH', guidewords: ['MORE', 'LESS', 'OTHER_THAN'], requires: ['phControlled'], group: 'Quality' },
  { key: 'reaction', label: 'Reaction', guidewords: ['NO', 'MORE', 'LESS', 'OTHER_THAN', 'EARLY', 'LATE'], requires: ['reactionStep'], group: 'Process' },
  { key: 'heating', label: 'Heating', guidewords: ['NO', 'MORE', 'LESS'], requires: ['heatingSystem'], group: 'Utility' },
  { key: 'cooling', label: 'Cooling', guidewords: ['NO', 'MORE', 'LESS'], requires: ['coolingSystem'], group: 'Utility' },
  { key: 'transfer', label: 'Transfer', guidewords: ['NO', 'MORE', 'LESS', 'REVERSE', 'EARLY', 'LATE', 'PART_OF'], requires: ['transferPath'], group: 'Process' },
  { key: 'charging', label: 'Charging', guidewords: ['NO', 'MORE', 'LESS', 'OTHER_THAN', 'EARLY', 'LATE', 'BEFORE', 'AFTER', 'PART_OF'], requires: ['charging'], group: 'Process' },
  { key: 'discharge', label: 'Discharge', guidewords: ['NO', 'MORE', 'LESS', 'EARLY', 'LATE', 'PART_OF'], requires: ['dischargeStep'], group: 'Process' },
  { key: 'inerting', label: 'Inerting', guidewords: ['NO', 'LESS', 'PART_OF'], requires: ['inertGas'], group: 'Utility' },
  { key: 'ventilation', label: 'Ventilation', guidewords: ['NO', 'LESS'], requires: ['ventilationRelevant'], group: 'Utility' },
  { key: 'sampling', label: 'Sampling', guidewords: ['NO', 'OTHER_THAN', 'EARLY', 'LATE'], requires: ['samplingStep'], group: 'Operations' },
  { key: 'staticCharge', label: 'Static charge', guidewords: ['AS_WELL_AS', 'MORE'], requires: ['staticRisk'], group: 'Hazard' },
  { key: 'utility', label: 'Utility', guidewords: ['NO', 'LESS', 'OTHER_THAN'], requires: ['anyUtility'], group: 'Utility' },
]);

/**
 * Operational deviations that the reference study treats as parameters but that
 * are not guideword-driven. Emitted with guideword OTHER_THAN and a plain
 * deviation phrase.
 */
const OPERATIONAL_DEVIATIONS = Object.freeze([
  { key: 'startUp', label: 'Start-up', deviation: 'Deviation during start-up', requires: ['anyOperation'] },
  { key: 'shutdown', label: 'Shutdown', deviation: 'Deviation during shutdown', requires: ['anyOperation'] },
  { key: 'emergencyShutdown', label: 'Emergency shutdown', deviation: 'Emergency shutdown not effective', requires: ['anyOperation'] },
  { key: 'maintenance', label: 'Maintenance', deviation: 'Deviation during maintenance / breakdown', requires: ['anyOperation'] },
  { key: 'leakage', label: 'Leakage', deviation: 'Loss of containment / leakage', requires: ['hazardousInventory'] },
  { key: 'exposure', label: 'Exposure', deviation: 'Personnel exposure during the operation', requires: ['manualOperation'] },
  { key: 'quality', label: 'Quality', deviation: 'Off-specification product', requires: ['anyOperation'] },
  { key: 'viscosity', label: 'Viscosity', deviation: 'Viscosity outside the workable range', requires: ['viscousService'] },
]);

const UTILITIES = Object.freeze([
  { key: 'power', label: 'Electrical power' },
  { key: 'steam', label: 'Steam' },
  { key: 'thermicFluid', label: 'Thermic fluid' },
  { key: 'coolingWater', label: 'Cooling water' },
  { key: 'chilledWater', label: 'Chilled water' },
  { key: 'brine', label: 'Brine' },
  { key: 'nitrogen', label: 'Nitrogen' },
  { key: 'instrumentAir', label: 'Instrument air' },
  { key: 'compressedAir', label: 'Compressed air' },
  { key: 'vacuum', label: 'Vacuum' },
]);

const INERT_UTILITIES = ['nitrogen'];
const HEATING_UTILITIES = ['steam', 'thermicFluid'];
const COOLING_UTILITIES = ['coolingWater', 'chilledWater', 'brine'];

/**
 * Derive the boolean facts that gate parameters, from the node and the
 * equipment / chemical records it references. Nothing is assumed: a fact is
 * true only because a record says so.
 *
 * @param {Object} node
 * @param {Object} ctx { equipment: [...], chemicals: [...], chemProperties: [...] }
 * @returns {Object} facts with a `why` map explaining each true fact
 */
function deriveNodeFacts(node, ctx) {
  const n = node || {};
  const c = ctx || {};
  const eqAll = c.equipment || [];
  const chAll = c.chemicals || [];
  const props = c.chemProperties || [];

  const eq = eqAll.filter((e) => (n.equipmentIds || []).indexOf(e.id) !== -1);
  const chems = chAll.filter((x) => (n.chemicalIds || []).indexOf(x.id) !== -1);
  const utils = n.utilities || [];
  const why = {};
  const set = (k, v, reason) => {
    if (v && reason) why[k] = reason;
    return v;
  };

  const eqTags = eq.map((e) => e.tag || e.id).join(', ');

  const hasAgitator = eq.some((e) => e.agitator);
  const hasHeating = eq.some((e) => e.heatingSystem) || utils.some((u) => HEATING_UTILITIES.indexOf(u) !== -1);
  const hasCooling = eq.some((e) => e.coolingSystem) || utils.some((u) => COOLING_UTILITIES.indexOf(u) !== -1);
  const isPressure = eq.some((e) => e.pressureEquipment) || utils.indexOf('compressedAir') !== -1;
  const isVacuum = eq.some((e) => e.vacuumService) || utils.indexOf('vacuum') !== -1;
  const holdup = eq.some((e) => e.holdup !== false && (e.capacity || e.type === 'vessel' || e.type === 'reactor' || e.type === 'tank' || e.type === 'mixer' || e.type === 'blender'));
  const powder = chems.some((x) => /solid|powder|granule|flake/i.test(x.physicalState || '')) || eq.some((e) => e.powderHandling);
  const lowConductivityLiquid = chems.some((x) => /liquid/i.test(x.physicalState || '') && propVal(props, x.id, 'conductivityLow') === true);

  const facts = {
    transferPath: set('transferPath', !!(n.hasTransfer || eq.some((e) => e.type === 'pump' || e.type === 'line' || e.transferPath) || (n.lineIds || []).length > 0), 'Node includes a transfer path or pump/line: ' + eqTags),
    charging: set('charging', !!n.hasCharging, 'Node design intent includes a charging step'),
    dischargeStep: set('dischargeStep', !!n.hasDischarge, 'Node design intent includes a discharge / transfer-out step'),
    pressureRelevant: set('pressureRelevant', isPressure, 'Pressure equipment or compressed-air service in node: ' + eqTags),
    vacuumService: set('vacuumService', isVacuum, 'Vacuum service declared in node'),
    thermalDuty: set('thermalDuty', hasHeating || hasCooling, 'Node has a heating or cooling duty'),
    heatingSystem: set('heatingSystem', hasHeating, 'Heating system or heating utility present'),
    coolingSystem: set('coolingSystem', hasCooling, 'Cooling system or cooling utility present'),
    holdupVessel: set('holdupVessel', holdup, 'Node contains a vessel/tank/mixer with hold-up: ' + eqTags),
    timedStep: set('timedStep', !!n.hasTimedStep, 'Node has a time-controlled step (hold, reaction time, mixing time)'),
    agitator: set('agitator', hasAgitator, 'Agitated equipment in node: ' + eqTags),
    multiComponent: set('multiComponent', chems.length > 1, chems.length + ' chemicals present in the node'),
    solutionHandling: set('solutionHandling', chems.some((x) => x.concentration !== undefined && x.concentration !== null && x.concentration !== ''), 'A chemical in the node is handled as a solution with a stated concentration'),
    phControlled: set('phControlled', !!n.phControlled, 'Node declares pH control'),
    reactionStep: set('reactionStep', !!n.isReactionStep, 'Node is a reaction step'),
    inertGas: set('inertGas', utils.some((u) => INERT_UTILITIES.indexOf(u) !== -1), 'Inert gas utility declared on the node'),
    ventilationRelevant: set('ventilationRelevant', !!n.manualOperation || powder || chems.some((x) => propUsable(props, x.id, 'acuteToxicity')), 'Manual operation, powder handling or a toxic material in the node'),
    samplingStep: set('samplingStep', !!n.hasSampling, 'Node includes a sampling step'),
    staticRisk: set('staticRisk', powder || lowConductivityLiquid, powder ? 'Powder / granular handling in the node' : 'Low-conductivity liquid transfer in the node'),
    anyUtility: set('anyUtility', utils.length > 0, 'Utilities declared on the node: ' + utils.join(', ')),
    anyOperation: set('anyOperation', true, 'Every node has an operating sequence'),
    hazardousInventory: set('hazardousInventory', chems.some((x) => x.hazardousClassification || propUsable(props, x.id, 'flashPoint') || propUsable(props, x.id, 'acuteToxicity')), 'A classified or hazardous material is present in the node'),
    manualOperation: set('manualOperation', !!n.manualOperation, 'Node involves a manual operation'),
    viscousService: set('viscousService', !!n.viscousService, 'Node declares a viscous service'),
    powderHandling: set('powderHandling', powder, 'Powder / granular handling in the node'),
  };

  return { facts, why, equipment: eq, chemicals: chems, utilities: utils };
}

function propVal(props, chemId, key) {
  const p = (props || []).filter((x) => x.chemicalId === chemId && x.key === key)[0];
  return p ? p.value : undefined;
}

function propUsable(props, chemId, key) {
  const p = (props || []).filter((x) => x.chemicalId === chemId && x.key === key)[0];
  if (!p) return false;
  return ['VERIFIED', 'USER_CONFIRMED', 'DOCUMENT_EXTRACTED', 'WEB_SOURCED'].indexOf(p.status) !== -1;
}

function deviationPhrase(guidewordKey, parameterLabel) {
  const gw = GUIDEWORDS.filter((g) => g.key === guidewordKey)[0];
  const label = gw ? gw.label : guidewordKey;
  return label + ' ' + parameterLabel.toLowerCase();
}

/**
 * Generate the meaningful deviation set for a node.
 *
 * @param {Object} node
 * @param {Object} ctx { equipment, chemicals, chemProperties }
 * @param {Object} opts { includeOperational: boolean (default true) }
 * @returns {Object} { combinations: [...], suppressed: [...], facts, engine }
 */
function generateDeviations(node, ctx, opts) {
  const o = opts || {};
  const derived = deriveNodeFacts(node, ctx);
  const facts = derived.facts;
  const why = derived.why;
  const combinations = [];
  const suppressed = [];

  for (const param of PARAMETERS) {
    const unmet = (param.requires || []).filter((f) => !facts[f]);
    if (unmet.length > 0) {
      suppressed.push({
        parameter: param.key,
        parameterLabel: param.label,
        reason: 'PARAMETER_NOT_PRESENT_IN_NODE',
        unmetFacts: unmet,
      });
      continue;
    }
    for (const gwKey of param.guidewords) {
      combinations.push({
        parameter: param.key,
        parameterLabel: param.label,
        group: param.group,
        guideword: gwKey,
        guidewordLabel: (GUIDEWORDS.filter((g) => g.key === gwKey)[0] || {}).label || gwKey,
        deviation: deviationPhrase(gwKey, param.label),
        rationale: (param.requires || []).map((f) => why[f]).filter(Boolean),
        kind: 'GUIDEWORD',
      });
    }
  }

  if (o.includeOperational !== false) {
    for (const od of OPERATIONAL_DEVIATIONS) {
      const unmet = (od.requires || []).filter((f) => !facts[f]);
      if (unmet.length > 0) {
        suppressed.push({ parameter: od.key, parameterLabel: od.label, reason: 'OPERATION_NOT_PRESENT_IN_NODE', unmetFacts: unmet });
        continue;
      }
      combinations.push({
        parameter: od.key,
        parameterLabel: od.label,
        group: 'Operations',
        guideword: 'OTHER_THAN',
        guidewordLabel: 'OTHER THAN',
        deviation: od.deviation,
        rationale: (od.requires || []).map((f) => why[f]).filter(Boolean),
        kind: 'OPERATIONAL',
      });
    }
  }

  // Utility failure rows: one per declared utility, because "utility failure"
  // as a single row hides which utility and therefore which consequence.
  for (const u of derived.utilities) {
    const util = UTILITIES.filter((x) => x.key === u)[0];
    if (!util) continue;
    combinations.push({
      parameter: 'utility:' + u,
      parameterLabel: util.label,
      group: 'Utility',
      guideword: 'NO',
      guidewordLabel: 'NO / NOT',
      deviation: 'Failure of ' + util.label.toLowerCase(),
      rationale: [why.anyUtility].filter(Boolean),
      kind: 'UTILITY',
    });
  }

  return {
    combinations,
    suppressed,
    facts,
    why,
    engine: GUIDEWORD_VERSION,
    counts: { emitted: combinations.length, suppressed: suppressed.length, crossProduct: PARAMETERS.length * GUIDEWORDS.length },
  };
}

/** Which of a node's meaningful deviations have no scenario yet. */
function deviationCoverage(node, ctx, scenarios) {
  const gen = generateDeviations(node, ctx);
  const existing = new Set((scenarios || []).map((s) => (s.parameter || '') + '|' + (s.guideword || '')));
  const covered = [];
  const uncovered = [];
  for (const c of gen.combinations) {
    if (existing.has(c.parameter + '|' + c.guideword)) covered.push(c);
    else uncovered.push(c);
  }
  return {
    covered,
    uncovered,
    percent: gen.combinations.length ? Math.round((covered.length / gen.combinations.length) * 100) : 0,
    total: gen.combinations.length,
  };
}

// packages/calculations/units.js
// Deterministic unit normalization with a recorded conversion trail.
// Every conversion returns the steps it took, so a threshold comparison can
// print its own arithmetic. No LLM touches this file.

const UNITS_VERSION = 'units-1.0.0';

// --- mass: canonical kg -----------------------------------------------------
const MASS = {
  mg: 1e-6,
  g: 1e-3,
  kg: 1,
  q: 100, // quintal
  t: 1000,
  mt: 1000, // metric tonne
  tonne: 1000,
  tonnes: 1000,
  ton: 1000, // metric ton assumed; flagged below
  lb: 0.45359237,
  lbs: 0.45359237,
};

// --- volume: canonical L ----------------------------------------------------
const VOLUME = {
  ml: 1e-3,
  l: 1,
  lit: 1,
  litre: 1,
  litres: 1,
  liter: 1,
  kl: 1000,
  m3: 1000,
  cum: 1000,
  gal: 3.785411784, // US liquid gallon
  usgal: 3.785411784,
  impgal: 4.54609,
};

// --- temperature: canonical degC -------------------------------------------
const TEMP_UNITS = ['c', 'degc', '°c', 'celsius', 'k', 'kelvin', 'f', 'degf', '°f', 'fahrenheit'];

// --- pressure: canonical bar(g|a) ------------------------------------------
// Pressure needs a gauge/absolute basis; we keep the basis rather than guess.
const PRESSURE = {
  bar: 1,
  barg: 1,
  bara: 1,
  kpa: 0.01,
  mpa: 10,
  pa: 1e-5,
  psi: 0.0689475729,
  psig: 0.0689475729,
  psia: 0.0689475729,
  atm: 1.01325,
  kgcm2: 0.980665,
  'kg/cm2': 0.980665,
  mmhg: 0.001333224,
  torr: 0.001333224,
};

function normalizeUnitToken(unit) {
  if (unit === null || unit === undefined) return '';
  return String(unit)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/³/g, '3')
    .replace(/^m\^3$/, 'm3')
    .replace(/^cubicmet(er|re)s?$/, 'm3')
    .replace(/^kg\/cm²$/, 'kg/cm2')
    .replace(/^kgf?\/cm2$/, 'kg/cm2')
    .replace(/[.]$/, '');
}

function unitDimension(unit) {
  const u = normalizeUnitToken(unit);
  if (Object.prototype.hasOwnProperty.call(MASS, u)) return 'mass';
  if (Object.prototype.hasOwnProperty.call(VOLUME, u)) return 'volume';
  if (TEMP_UNITS.indexOf(u) !== -1) return 'temperature';
  if (Object.prototype.hasOwnProperty.call(PRESSURE, u)) return 'pressure';
  return null;
}

function fail(reason, detail) {
  return { ok: false, reason, detail: detail || null, value: null, unit: null, steps: [] };
}

/**
 * Convert a mass quantity to kg.
 * @returns {Object} { ok, value, unit:'kg', steps[], notes[] }
 */
function toKg(qty, unit) {
  const u = normalizeUnitToken(unit);
  if (!Object.prototype.hasOwnProperty.call(MASS, u)) return fail('UNKNOWN_MASS_UNIT', u);
  const n = Number(qty);
  if (!Number.isFinite(n)) return fail('NON_NUMERIC_QUANTITY', qty);
  const factor = MASS[u];
  const notes = [];
  if (u === 'ton') notes.push('"ton" read as metric tonne (1000 kg); confirm against the source document.');
  return {
    ok: true,
    value: n * factor,
    unit: 'kg',
    steps: [{ from: n + ' ' + u, factor, to: n * factor + ' kg', rule: '1 ' + u + ' = ' + factor + ' kg' }],
    notes,
  };
}

/** Convert a volume quantity to litres. */
function toLitres(qty, unit) {
  const u = normalizeUnitToken(unit);
  if (!Object.prototype.hasOwnProperty.call(VOLUME, u)) return fail('UNKNOWN_VOLUME_UNIT', u);
  const n = Number(qty);
  if (!Number.isFinite(n)) return fail('NON_NUMERIC_QUANTITY', qty);
  const factor = VOLUME[u];
  const notes = [];
  if (u === 'gal' || u === 'usgal') notes.push('US liquid gallon assumed.');
  return {
    ok: true,
    value: n * factor,
    unit: 'L',
    steps: [{ from: n + ' ' + u, factor, to: n * factor + ' L', rule: '1 ' + u + ' = ' + factor + ' L' }],
    notes,
  };
}

/**
 * Convert any mass or volume quantity to kg. A volume needs a density with a
 * usable status — there is no default density.
 *
 * @param {Object} req { qty, unit, density, densityUnit, densityStatus }
 * @returns {Object} { ok, value, unit:'kg', steps[], notes[], reason? }
 */
function toMassKg(req) {
  const r = req || {};
  const dim = unitDimension(r.unit);
  if (dim === 'mass') return toKg(r.qty, r.unit);
  if (dim !== 'volume') return fail('NOT_A_QUANTITY_UNIT', normalizeUnitToken(r.unit));

  const vol = toLitres(r.qty, r.unit);
  if (!vol.ok) return vol;

  if (r.density === null || r.density === undefined || !Number.isFinite(Number(r.density))) {
    return {
      ok: false,
      reason: 'DENSITY_REQUIRED_FOR_VOLUME_TO_MASS',
      detail: 'Inventory is a volume; a density with a usable status is required. No default density is applied.',
      value: null,
      unit: null,
      steps: vol.steps,
    };
  }
  if (r.densityStatus && ['VERIFIED', 'USER_CONFIRMED', 'DOCUMENT_EXTRACTED', 'WEB_SOURCED'].indexOf(r.densityStatus) === -1) {
    return {
      ok: false,
      reason: 'DENSITY_STATUS_NOT_USABLE',
      detail: 'Density status is ' + r.densityStatus + '; an inferred density cannot support a threshold conclusion.',
      value: null,
      unit: null,
      steps: vol.steps,
    };
  }

  // Density canonical unit: kg/L. Accept kg/m3 and g/cm3.
  const du = normalizeUnitToken(r.densityUnit || 'kg/l');
  let dKgPerL;
  let dRule;
  if (du === 'kg/l' || du === 'kgl' || du === 'g/ml' || du === 'g/cm3' || du === 'sg' || du === '') {
    dKgPerL = Number(r.density);
    dRule = '1 kg/L';
  } else if (du === 'kg/m3' || du === 'kgm3' || du === 'g/l') {
    dKgPerL = Number(r.density) / 1000;
    dRule = '1 kg/m3 = 0.001 kg/L';
  } else {
    return fail('UNKNOWN_DENSITY_UNIT', du);
  }
  if (!(dKgPerL > 0)) return fail('NON_POSITIVE_DENSITY', r.density);

  const kg = vol.value * dKgPerL;
  return {
    ok: true,
    value: kg,
    unit: 'kg',
    steps: vol.steps.concat([
      { from: vol.value + ' L', factor: dKgPerL, to: kg + ' kg', rule: 'density ' + r.density + ' ' + (r.densityUnit || 'kg/L') + ' (' + dRule + ')' },
    ]),
    notes: (vol.notes || []).concat(['Volume converted to mass using a declared density; the density source is cited with the result.']),
  };
}

/** Temperature to degrees Celsius. */
function toCelsius(value, unit) {
  const u = normalizeUnitToken(unit);
  const n = Number(value);
  if (!Number.isFinite(n)) return fail('NON_NUMERIC_QUANTITY', value);
  if (u === 'c' || u === 'degc' || u === '°c' || u === 'celsius' || u === '') {
    return { ok: true, value: n, unit: 'degC', steps: [{ from: n + ' °C', to: n + ' °C', rule: 'identity' }], notes: [] };
  }
  if (u === 'k' || u === 'kelvin') {
    return { ok: true, value: n - 273.15, unit: 'degC', steps: [{ from: n + ' K', to: n - 273.15 + ' °C', rule: '°C = K - 273.15' }], notes: [] };
  }
  if (u === 'f' || u === 'degf' || u === '°f' || u === 'fahrenheit') {
    const c = ((n - 32) * 5) / 9;
    return { ok: true, value: c, unit: 'degC', steps: [{ from: n + ' °F', to: c + ' °C', rule: '°C = (°F - 32) x 5/9' }], notes: [] };
  }
  return fail('UNKNOWN_TEMPERATURE_UNIT', u);
}

/**
 * Pressure to bar, preserving the gauge/absolute basis. A value whose basis is
 * unknown is returned with basis 'UNKNOWN' and must not be compared with a
 * value of a different basis.
 */
function toBar(value, unit) {
  const u = normalizeUnitToken(unit);
  if (!Object.prototype.hasOwnProperty.call(PRESSURE, u)) return fail('UNKNOWN_PRESSURE_UNIT', u);
  const n = Number(value);
  if (!Number.isFinite(n)) return fail('NON_NUMERIC_QUANTITY', value);
  const basis = /g$/.test(u) ? 'GAUGE' : /a$/.test(u) || u === 'atm' ? 'ABSOLUTE' : 'UNKNOWN';
  const factor = PRESSURE[u];
  return {
    ok: true,
    value: n * factor,
    unit: 'bar',
    basis,
    steps: [{ from: n + ' ' + u, factor, to: n * factor + ' bar', rule: '1 ' + u + ' = ' + factor + ' bar' }],
    notes: basis === 'UNKNOWN' ? ['Gauge/absolute basis not stated in the source; comparison across bases is blocked.'] : [],
  };
}

/**
 * Compare two pressures safely. Returns null when the bases are not
 * comparable — the caller must then report a data gap, not a conclusion.
 */
function comparePressure(a, b) {
  if (!a || !b || !a.ok || !b.ok) return null;
  if (a.basis !== b.basis && a.basis !== 'UNKNOWN' && b.basis !== 'UNKNOWN') {
    // gauge vs absolute differ by 1.01325 bar; refuse rather than assume site elevation
    return { comparable: false, reason: 'PRESSURE_BASIS_MISMATCH', a, b };
  }
  if (a.basis === 'UNKNOWN' || b.basis === 'UNKNOWN') {
    return { comparable: false, reason: 'PRESSURE_BASIS_UNKNOWN', a, b };
  }
  return { comparable: true, delta: a.value - b.value, a, b };
}

/** Round for display without losing the stored precision. */
function fmt(n, dp) {
  if (n === null || n === undefined || !Number.isFinite(Number(n))) return '—';
  const d = dp === undefined ? 3 : dp;
  const v = Number(n);
  const r = Number(v.toFixed(d));
  return String(r);
}

// packages/calculations/risk.js
// The risk engine. Deterministic. Matrices are data; the engine is arithmetic.

const RISK_ENGINE_VERSION = 'risk-1.0.0';

/**
 * Default 5x5 matrix. Bands follow MASTER_STRUCTURE §13.
 * The reachable products of 1..5 x 1..5 are
 * {1,2,3,4,5,6,8,9,10,12,15,16,20,25}; the bands below cover every integer
 * 1..25 so a custom scale cannot fall through a gap.
 */
const DEFAULT_MATRIX = Object.freeze({
  id: 'IEC-5x5-v1',
  version: 1,
  name: '5 x 5 likelihood x severity',
  combine: 'product',
  likelihoodScale: Object.freeze([
    { value: 1, label: 'Improbable', descriptor: 'Not known to have occurred in the industry' },
    { value: 2, label: 'Remote', descriptor: 'Has occurred in the industry, not at this site' },
    { value: 3, label: 'Occasional', descriptor: 'Credible once in the life of the plant' },
    { value: 4, label: 'Probable', descriptor: 'Has occurred at this site' },
    { value: 5, label: 'Frequent', descriptor: 'Occurs or may occur more than once a year' },
  ]),
  severityScale: Object.freeze([
    { value: 1, label: 'Negligible', people: 'No injury', env: 'No release', asset: 'Negligible loss' },
    { value: 2, label: 'Minor', people: 'First aid', env: 'Contained release', asset: 'Minor damage' },
    { value: 3, label: 'Moderate', people: 'Lost-time injury', env: 'Reportable release', asset: 'Equipment damage' },
    { value: 4, label: 'Major', people: 'Serious / multiple injuries', env: 'Off-site impact', asset: 'Major damage, production loss' },
    { value: 5, label: 'Catastrophic', people: 'Fatality or multiple fatalities', env: 'Major off-site impact', asset: 'Loss of plant' },
  ]),
  bands: Object.freeze([
    { min: 1, max: 2, key: 'TRIVIAL', label: 'Trivial', action: 'ACCEPT', tone: 'ok' },
    { min: 3, max: 4, key: 'TOLERABLE', label: 'Tolerable', action: 'MONITOR', tone: 'ok' },
    { min: 5, max: 9, key: 'MODERATE', label: 'Moderate', action: 'ALARP_REVIEW', tone: 'warn' },
    { min: 10, max: 16, key: 'SUBSTANTIAL', label: 'Substantial', action: 'ACTION_REQUIRED', tone: 'high' },
    { min: 17, max: 25, key: 'INTOLERABLE', label: 'Intolerable', action: 'ACTION_MANDATORY', tone: 'critical' },
  ]),
  alarpEnabled: true,
});

/** A 4x4 example of a non-multiplicative (lookup) matrix, used in tests. */
const LOOKUP_4x4_EXAMPLE = Object.freeze({
  id: 'CLIENT-4x4-lookup-v2',
  version: 2,
  name: 'Client 4 x 4 lookup matrix',
  combine: 'lookup',
  likelihoodScale: Object.freeze([
    { value: 1, label: 'L1' }, { value: 2, label: 'L2' }, { value: 3, label: 'L3' }, { value: 4, label: 'L4' },
  ]),
  severityScale: Object.freeze([
    { value: 1, label: 'S1' }, { value: 2, label: 'S2' }, { value: 3, label: 'S3' }, { value: 4, label: 'S4' },
  ]),
  // cells[likelihood][severity] -> band key. Severity dominates in this matrix:
  // any S4 is at least HIGH regardless of likelihood.
  cells: Object.freeze({
    1: { 1: 'LOW', 2: 'LOW', 3: 'MEDIUM', 4: 'HIGH' },
    2: { 1: 'LOW', 2: 'MEDIUM', 3: 'MEDIUM', 4: 'HIGH' },
    3: { 1: 'MEDIUM', 2: 'MEDIUM', 3: 'HIGH', 4: 'EXTREME' },
    4: { 1: 'MEDIUM', 2: 'HIGH', 3: 'EXTREME', 4: 'EXTREME' },
  }),
  bands: Object.freeze([
    { key: 'LOW', label: 'Low', action: 'ACCEPT', rank: 1, tone: 'ok' },
    { key: 'MEDIUM', label: 'Medium', action: 'ALARP_REVIEW', rank: 2, tone: 'warn' },
    { key: 'HIGH', label: 'High', action: 'ACTION_REQUIRED', rank: 3, tone: 'high' },
    { key: 'EXTREME', label: 'Extreme', action: 'ACTION_MANDATORY', rank: 4, tone: 'critical' },
  ]),
  alarpEnabled: false,
});

function scaleValues(scale) {
  return (scale || []).map((s) => s.value);
}

function bandRank(matrix, key) {
  const bands = matrix.bands || [];
  for (let i = 0; i < bands.length; i += 1) {
    if (bands[i].key === key) return bands[i].rank !== undefined ? bands[i].rank : i + 1;
  }
  return null;
}

/**
 * The core calculation.
 *
 * @param {Object} matrix
 * @param {number|null} likelihood
 * @param {number|null} severity
 * @returns {Object} { ok, score, band, bandKey, bandLabel, action, tone,
 *                     matrixId, matrixVersion, engine, reason? }
 */
function riskFromLS(matrix, likelihood, severity) {
  const m = matrix || DEFAULT_MATRIX;
  const base = { matrixId: m.id, matrixVersion: m.version, engine: RISK_ENGINE_VERSION };

  const hasL = likelihood !== null && likelihood !== undefined && likelihood !== '';
  const hasS = severity !== null && severity !== undefined && severity !== '';
  if (!hasL || !hasS) {
    // Never default a missing rating to 1.
    return Object.assign({}, base, {
      ok: false,
      score: null,
      bandKey: null,
      bandLabel: null,
      action: null,
      tone: null,
      reason: 'MISSING_INPUT',
      missing: [!hasL ? 'likelihood' : null, !hasS ? 'severity' : null].filter(Boolean),
    });
  }

  const l = Number(likelihood);
  const s = Number(severity);
  const ls = scaleValues(m.likelihoodScale);
  const ss = scaleValues(m.severityScale);
  if (ls.indexOf(l) === -1) throw new RangeError('likelihood ' + likelihood + ' is not on scale ' + JSON.stringify(ls));
  if (ss.indexOf(s) === -1) throw new RangeError('severity ' + severity + ' is not on scale ' + JSON.stringify(ss));

  if (m.combine === 'lookup') {
    const row = m.cells && m.cells[l];
    const key = row ? row[s] : null;
    if (!key) throw new RangeError('lookup matrix ' + m.id + ' has no cell for L' + l + '/S' + s);
    const band = (m.bands || []).filter((b) => b.key === key)[0];
    if (!band) throw new RangeError('lookup matrix ' + m.id + ' cell L' + l + '/S' + s + ' names unknown band ' + key);
    return Object.assign({}, base, {
      ok: true,
      score: null,
      likelihood: l,
      severity: s,
      bandKey: band.key,
      bandLabel: band.label,
      action: band.action,
      tone: band.tone || null,
      rank: bandRank(m, band.key),
      basis: 'lookup cell L' + l + ' / S' + s,
    });
  }

  const score = l * s;
  const band = (m.bands || []).filter((b) => score >= b.min && score <= b.max)[0];
  if (!band) throw new RangeError('matrix ' + m.id + ' has no band covering score ' + score);
  return Object.assign({}, base, {
    ok: true,
    score,
    likelihood: l,
    severity: s,
    bandKey: band.key,
    bandLabel: band.label,
    action: band.action,
    tone: band.tone || null,
    rank: bandRank(m, band.key),
    basis: 'L' + l + ' x S' + s + ' = ' + score,
  });
}

/**
 * riskFromLS() throws for an off-scale rating, which is right for a save path:
 * a bad value must not be stored. A render path wants to draw the row anyway,
 * so it uses this wrapper instead of a local try/catch in every view.
 */
function tryRiskFromLS(matrix, likelihood, severity) {
  try {
    return riskFromLS(matrix, likelihood, severity);
  } catch (e) {
    return { ok: false, score: null, bandKey: null, bandLabel: null, reason: 'OFF_SCALE', detail: (e && e.message) || 'rating is not on the matrix scale' };
  }
}

/** Comparable magnitude for a risk result, across product and lookup matrices. */
function riskMagnitude(result) {
  if (!result || !result.ok) return null;
  if (result.score !== null && result.score !== undefined) return result.score;
  return result.rank;
}

const RESIDUAL_BASIS_KINDS = Object.freeze([
  'ELIMINATION',
  'SUBSTITUTION',
  'ENGINEERING_CONTROL',
  'INSTRUMENTED_FUNCTION',
  'ADMINISTRATIVE',
]);

// Basis kinds that may reduce likelihood but never severity: the consequence of
// a release does not change because a procedure was written.
const LIKELIHOOD_ONLY_BASIS = Object.freeze(['ADMINISTRATIVE']);

/**
 * Guard a residual risk entry.
 *
 * @param {Object} req { matrix, initial:{likelihood,severity}, residual:{likelihood,severity},
 *                       basis:{kind,text}, recommendationIds[] }
 * @returns {Object} { ok, reason, detail? }
 */
function validateResidual(req) {
  const r = req || {};
  const matrix = r.matrix || DEFAULT_MATRIX;
  const init = r.initial || {};
  const res = r.residual || {};

  const initial = riskFromLS(matrix, init.likelihood, init.severity);
  if (!initial.ok) return { ok: false, reason: 'INITIAL_RISK_INCOMPLETE' };

  const hasResidual =
    res.likelihood !== null && res.likelihood !== undefined && res.likelihood !== '' &&
    res.severity !== null && res.severity !== undefined && res.severity !== '';
  if (!hasResidual) return { ok: true, reason: 'NO_RESIDUAL_ENTERED' };

  const residual = riskFromLS(matrix, res.likelihood, res.severity);
  if (!residual.ok) return { ok: false, reason: 'RESIDUAL_RISK_INCOMPLETE' };

  const im = riskMagnitude(initial);
  const rm = riskMagnitude(residual);

  if (rm > im) {
    return { ok: false, reason: 'RESIDUAL_ABOVE_INITIAL', detail: 'A recommendation cannot increase risk; re-rate the initial risk instead.' };
  }
  if (rm === im) return { ok: true, reason: 'NO_REDUCTION_CLAIMED', initial, residual };

  const basis = r.basis || {};
  if (!basis.kind || RESIDUAL_BASIS_KINDS.indexOf(basis.kind) === -1) {
    return { ok: false, reason: 'RESIDUAL_BASIS_KIND_REQUIRED', detail: 'One of: ' + RESIDUAL_BASIS_KINDS.join(', ') };
  }
  if (!basis.text || String(basis.text).trim().length < 12) {
    return { ok: false, reason: 'RESIDUAL_BASIS_TEXT_REQUIRED', detail: 'State the technical basis for the reduction. The existence of a recommendation is not a basis.' };
  }
  if (LIKELIHOOD_ONLY_BASIS.indexOf(basis.kind) !== -1 && Number(res.severity) < Number(init.severity)) {
    return {
      ok: false,
      reason: 'ADMINISTRATIVE_BASIS_CANNOT_REDUCE_SEVERITY',
      detail: 'An administrative or PPE measure may reduce likelihood or exposure, not the consequence severity of the scenario.',
    };
  }
  return { ok: true, reason: 'REDUCTION_JUSTIFIED', initial, residual };
}

/** The project's action requirement for a band. */
function tolerability(matrix, bandKey) {
  const m = matrix || DEFAULT_MATRIX;
  const band = (m.bands || []).filter((b) => b.key === bandKey)[0];
  if (!band) return { action: null, reason: 'UNKNOWN_BAND' };
  if (band.action === 'ALARP_REVIEW' && !m.alarpEnabled) {
    return { action: 'ACTION_REQUIRED', reason: 'ALARP_NARRATIVE_DISABLED_FOR_PROJECT' };
  }
  return { action: band.action, reason: 'MATRIX_BAND_ACTION' };
}

/** Bands ranked at or above the given band key — used by the quality gate. */
function bandsAtOrAbove(matrix, bandKey) {
  const m = matrix || DEFAULT_MATRIX;
  const target = bandRank(m, bandKey);
  if (target === null) return [];
  return (m.bands || []).filter((b, i) => (b.rank !== undefined ? b.rank : i + 1) >= target).map((b) => b.key);
}

/** Every cell of a matrix, for the matrix preview grid. */
function matrixGrid(matrix) {
  const m = matrix || DEFAULT_MATRIX;
  const rows = [];
  for (const sev of (m.severityScale || []).slice().reverse()) {
    const row = { severity: sev, cells: [] };
    for (const lik of m.likelihoodScale || []) {
      let cell;
      try {
        cell = riskFromLS(m, lik.value, sev.value);
      } catch (e) {
        cell = { ok: false, reason: 'MATRIX_ERROR', bandLabel: '—' };
      }
      row.cells.push({ likelihood: lik, result: cell });
    }
    rows.push(row);
  }
  return rows;
}

/** Validate a user-authored matrix before it can be saved to a project. */
function validateMatrix(m) {
  const errors = [];
  if (!m || typeof m !== 'object') return { ok: false, errors: ['Matrix must be an object.'] };
  if (!m.id) errors.push('Matrix needs an id.');
  if (!Number.isFinite(Number(m.version))) errors.push('Matrix needs a numeric version.');
  if (!(m.likelihoodScale || []).length) errors.push('Matrix needs a likelihood scale.');
  if (!(m.severityScale || []).length) errors.push('Matrix needs a severity scale.');
  if (!(m.bands || []).length) errors.push('Matrix needs bands.');
  if (m.combine !== 'product' && m.combine !== 'lookup') errors.push('combine must be "product" or "lookup".');

  if (m.combine === 'product' && (m.bands || []).length) {
    const maxScore = Math.max.apply(null, scaleValues(m.likelihoodScale)) * Math.max.apply(null, scaleValues(m.severityScale));
    for (let score = 1; score <= maxScore; score += 1) {
      const hits = (m.bands || []).filter((b) => score >= b.min && score <= b.max);
      if (hits.length === 0) errors.push('No band covers score ' + score + '.');
      if (hits.length > 1) errors.push('Score ' + score + ' falls in ' + hits.length + ' bands.');
    }
  }
  if (m.combine === 'lookup') {
    for (const l of scaleValues(m.likelihoodScale)) {
      for (const s of scaleValues(m.severityScale)) {
        const key = m.cells && m.cells[l] && m.cells[l][s];
        if (!key) errors.push('Lookup cell L' + l + '/S' + s + ' is empty.');
        else if (!(m.bands || []).some((b) => b.key === key)) errors.push('Cell L' + l + '/S' + s + ' names unknown band "' + key + '".');
      }
    }
  }
  return { ok: errors.length === 0, errors };
}

// packages/calculations/dates.js
// Permit expiry / renewal / recurring-obligation arithmetic. Deterministic,
// UTC-day based, no timezone drift, no LLM.

const DATES_VERSION = 'dates-1.0.0';

const MS_DAY = 86400000;

/** Parse an ISO date (yyyy-mm-dd or full ISO) to a UTC midnight timestamp. */
function toUtcDay(input) {
  if (!input) return null;
  if (input instanceof Date) {
    if (Number.isNaN(input.getTime())) return null;
    return Date.UTC(input.getUTCFullYear(), input.getUTCMonth(), input.getUTCDate());
  }
  const s = String(input).trim();
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (m) return Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const d = new Date(s);
  if (Number.isNaN(d.getTime())) return null;
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
}

function isoDay(ts) {
  if (ts === null || ts === undefined) return null;
  const d = new Date(ts);
  if (Number.isNaN(d.getTime())) return null;
  return d.toISOString().slice(0, 10);
}

function daysBetween(fromInput, toInput) {
  const a = toUtcDay(fromInput);
  const b = toUtcDay(toInput);
  if (a === null || b === null) return null;
  return Math.round((b - a) / MS_DAY);
}

function addDays(input, n) {
  const a = toUtcDay(input);
  if (a === null) return null;
  return isoDay(a + Math.round(n) * MS_DAY);
}

/** Calendar-correct month addition, clamping to the end of a short month. */
function addMonths(input, n) {
  const a = toUtcDay(input);
  if (a === null) return null;
  const d = new Date(a);
  const y = d.getUTCFullYear();
  const mo = d.getUTCMonth();
  const day = d.getUTCDate();
  const target = new Date(Date.UTC(y, mo + Math.round(n), 1));
  const lastDay = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
  return isoDay(Date.UTC(target.getUTCFullYear(), target.getUTCMonth(), Math.min(day, lastDay)));
}

const DEFAULT_NOTICE_DAYS = 90;
const DEFAULT_RENEWAL_DAYS = 30;

/**
 * Status of a dated permit / licence / consent / approval.
 *
 * @param {Object} req { expiryDate, renewalDate, today, noticeDays, renewalWindowDays, revoked }
 * @returns {Object} { status, daysRemaining, reason, effectiveDate }
 */
function expiryStatus(req) {
  const r = req || {};
  const today = toUtcDay(r.today || new Date());
  const noticeDays = Number.isFinite(Number(r.noticeDays)) ? Number(r.noticeDays) : DEFAULT_NOTICE_DAYS;
  const renewalWindow = Number.isFinite(Number(r.renewalWindowDays)) ? Number(r.renewalWindowDays) : DEFAULT_RENEWAL_DAYS;

  if (r.revoked) return { status: 'EXPIRED', daysRemaining: null, reason: 'REVOKED', effectiveDate: null };

  // A renewal date earlier than expiry is the date action is due.
  const expiry = toUtcDay(r.expiryDate);
  const renewal = toUtcDay(r.renewalDate);

  if (expiry === null && renewal === null) {
    return { status: 'UNKNOWN', daysRemaining: null, reason: 'NO_DATES_RECORDED', effectiveDate: null };
  }
  if (expiry === null && renewal !== null) {
    const dr = Math.round((renewal - today) / MS_DAY);
    if (dr < 0) return { status: 'RENEWAL_DUE', daysRemaining: dr, reason: 'RENEWAL_DATE_PASSED', effectiveDate: isoDay(renewal) };
    if (dr <= renewalWindow) return { status: 'RENEWAL_DUE', daysRemaining: dr, reason: 'INSIDE_RENEWAL_WINDOW', effectiveDate: isoDay(renewal) };
    return { status: 'VALID', daysRemaining: dr, reason: 'RENEWAL_AHEAD', effectiveDate: isoDay(renewal) };
  }

  const dr = Math.round((expiry - today) / MS_DAY);
  if (dr < 0) return { status: 'EXPIRED', daysRemaining: dr, reason: 'EXPIRY_PASSED', effectiveDate: isoDay(expiry) };
  if (renewal !== null) {
    const rdr = Math.round((renewal - today) / MS_DAY);
    if (rdr <= renewalWindow) {
      return { status: 'RENEWAL_DUE', daysRemaining: dr, reason: 'RENEWAL_ACTION_DUE', effectiveDate: isoDay(renewal) };
    }
  }
  if (dr <= noticeDays) return { status: 'EXPIRING_SOON', daysRemaining: dr, reason: 'INSIDE_NOTICE_WINDOW', effectiveDate: isoDay(expiry) };
  return { status: 'VALID', daysRemaining: dr, reason: 'OUTSIDE_NOTICE_WINDOW', effectiveDate: isoDay(expiry) };
}

const FREQUENCIES = Object.freeze({
  DAILY: { days: 1, label: 'Daily' },
  WEEKLY: { days: 7, label: 'Weekly' },
  FORTNIGHTLY: { days: 14, label: 'Fortnightly' },
  MONTHLY: { months: 1, label: 'Monthly' },
  QUARTERLY: { months: 3, label: 'Quarterly' },
  HALF_YEARLY: { months: 6, label: 'Half-yearly' },
  ANNUAL: { months: 12, label: 'Annual' },
  BIENNIAL: { months: 24, label: 'Every 2 years' },
  FIVE_YEARLY: { months: 60, label: 'Every 5 years' },
  ON_EVENT: { label: 'On event', eventDriven: true },
  ONE_TIME: { label: 'One time', oneTime: true },
});

/**
 * Next due date for a recurring statutory obligation (returns, monitoring,
 * inspection, testing).
 */
function nextDue(req) {
  const r = req || {};
  const freq = FREQUENCIES[r.frequency];
  const today = r.today || isoDay(toUtcDay(new Date()));
  if (!freq) return { dueDate: null, status: 'UNKNOWN_FREQUENCY', reason: 'FREQUENCY_NOT_RECOGNIZED' };
  if (freq.eventDriven) return { dueDate: null, status: 'EVENT_DRIVEN', reason: 'DUE_ON_EVENT' };
  if (freq.oneTime) {
    if (r.lastCompleted) return { dueDate: null, status: 'COMPLETE', reason: 'ONE_TIME_DONE' };
    return { dueDate: r.startFrom || null, status: r.startFrom ? 'DUE' : 'UNKNOWN', reason: 'ONE_TIME_PENDING' };
  }
  const anchor = r.lastCompleted || r.startFrom;
  if (!anchor) return { dueDate: null, status: 'UNKNOWN', reason: 'NO_ANCHOR_DATE' };

  const due = freq.months ? addMonths(anchor, freq.months) : addDays(anchor, freq.days);
  const dr = daysBetween(today, due);
  let status = 'SCHEDULED';
  if (dr === null) status = 'UNKNOWN';
  else if (dr < 0) status = 'OVERDUE';
  else if (dr <= (Number.isFinite(Number(r.noticeDays)) ? Number(r.noticeDays) : 30)) status = 'DUE_SOON';
  return { dueDate: due, daysRemaining: dr, status, reason: 'ANCHOR_PLUS_FREQUENCY', anchor, frequency: r.frequency };
}

/** Sort key for the "expiring items" panel: most urgent first. */
function urgencyKey(status, daysRemaining) {
  const order = { EXPIRED: 0, RENEWAL_DUE: 1, EXPIRING_SOON: 2, OVERDUE: 0, DUE_SOON: 2, VALID: 3, SCHEDULED: 3, UNKNOWN: 4, NO_EXPIRY: 5 };
  const base = Object.prototype.hasOwnProperty.call(order, status) ? order[status] : 4;
  const d = Number.isFinite(Number(daysRemaining)) ? Number(daysRemaining) : 99999;
  return base * 100000 + Math.min(d + 50000, 99999);
}
