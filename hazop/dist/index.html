// packages/legal/thresholds.js
// Deterministic chemical threshold matching. No LLM arithmetic reaches this
// file, and it imports nothing from the AI layer — the test suite asserts that.





const THRESHOLD_ENGINE_VERSION = 'threshold-1.0.0';

const APPROACHING_FRACTION = 0.8; // >= 80 % of the figure is "approaching"

/**
 * Evaluate ONE chemical against ONE threshold entry.
 *
 * @param {Object} req {
 *   chemical: { id, canonicalName, cas, quantity, quantityUnit, density, densityUnit,
 *               densityStatus, quantityStatus, identityResolution },
 *   thresholdEntry: { chemicalName, cas, value, unit, basis, locator, status, sourceRefs },
 *   aggregationNote
 * }
 * @returns {Object} full evaluation with the arithmetic shown
 */
function evaluateThreshold(req) {
  const r = req || {};
  const chem = r.chemical || {};
  const t = r.thresholdEntry || {};
  const out = {
    engine: THRESHOLD_ENGINE_VERSION,
    chemicalId: chem.id || null,
    chemicalName: chem.canonicalName || chem.name || null,
    thresholdLocator: t.locator || null,
    thresholdSourceRefs: t.sourceRefs || [],
    conversion: [],
    notes: [],
  };

  // 1. The threshold figure itself must be verified and cited.
  if (t.value === null || t.value === undefined || t.value === '' || !Number.isFinite(Number(t.value))) {
    return Object.assign(out, {
      status: 'THRESHOLD_NOT_VERIFIED',
      comparison: null,
      detail:
        'No threshold figure has been entered for this entry. Read the quantity from the official schedule, enter it and cite the schedule entry. The engine will not assume a figure.',
      blocks: 'APPLICABILITY_CONCLUSION',
    });
  }
  if (t.status && t.status !== 'VERIFIED' && t.status !== 'USER_CONFIRMED') {
    return Object.assign(out, {
      status: 'THRESHOLD_NOT_VERIFIED',
      comparison: null,
      detail: 'The threshold figure is present but its status is ' + t.status + '. A threshold must be VERIFIED or USER_CONFIRMED with a citation before it can support a conclusion.',
      blocks: 'APPLICABILITY_CONCLUSION',
    });
  }
  if (!(t.sourceRefs && t.sourceRefs.length) && !t.locator) {
    return Object.assign(out, {
      status: 'THRESHOLD_NOT_CITED',
      comparison: null,
      detail: 'The threshold figure has no citation. Record the schedule and entry it comes from.',
      blocks: 'APPLICABILITY_CONCLUSION',
    });
  }

  // 2. Identity must be resolved.
  if (identityBlocksThreshold(chem.identityResolution)) {
    return Object.assign(out, {
      status: 'REQUIRES_HUMAN_CONFIRMATION',
      comparison: null,
      detail:
        'Chemical identity is not resolved (' +
        ((chem.identityResolution && chem.identityResolution.matchKind) || 'UNRESOLVED') +
        '). Confirm the identity against the SDS before comparing quantities.',
      blocks: 'APPLICABILITY_CONCLUSION',
    });
  }
  if (chem.cas && t.cas) {
    const a = validateCas(chem.cas);
    const b = validateCas(t.cas);
    if (a.valid && b.valid && a.normalized !== b.normalized) {
      return Object.assign(out, {
        status: 'IDENTITY_MISMATCH',
        comparison: null,
        detail: 'Inventory CAS ' + a.normalized + ' does not match the schedule entry CAS ' + b.normalized + '.',
        blocks: 'APPLICABILITY_CONCLUSION',
      });
    }
  }

  // 3. Quantity must exist with a usable status.
  if (chem.quantity === null || chem.quantity === undefined || chem.quantity === '' || !Number.isFinite(Number(chem.quantity))) {
    return Object.assign(out, {
      status: 'NOT_ENOUGH_DATA',
      comparison: null,
      detail: 'No inventory quantity recorded for ' + (out.chemicalName || 'this chemical') + '. A threshold crossing cannot be concluded without it.',
      blocks: 'APPLICABILITY_CONCLUSION',
      missingFacts: ['chemical.quantity'],
    });
  }
  if (chem.quantityStatus && !isUsable(chem.quantityStatus)) {
    return Object.assign(out, {
      status: 'NOT_ENOUGH_DATA',
      comparison: null,
      detail: 'Inventory quantity status is ' + chem.quantityStatus + '. An inferred quantity cannot support a threshold conclusion.',
      blocks: 'APPLICABILITY_CONCLUSION',
      missingFacts: ['chemical.quantity(status)'],
    });
  }

  // 4. Normalize both sides to kg.
  const inv = toMassKg({
    qty: chem.quantity,
    unit: chem.quantityUnit,
    density: chem.density,
    densityUnit: chem.densityUnit,
    densityStatus: chem.densityStatus,
  });
  if (!inv.ok) {
    return Object.assign(out, {
      status: inv.reason === 'DENSITY_REQUIRED_FOR_VOLUME_TO_MASS' || inv.reason === 'DENSITY_STATUS_NOT_USABLE' ? 'NOT_ENOUGH_DATA' : 'UNIT_ERROR',
      comparison: null,
      detail: inv.detail || 'Could not normalize the inventory quantity: ' + inv.reason,
      conversion: inv.steps || [],
      blocks: 'APPLICABILITY_CONCLUSION',
      missingFacts: inv.reason && inv.reason.indexOf('DENSITY') !== -1 ? ['chemical.density'] : [],
    });
  }

  const thr = toKg(t.value, t.unit);
  if (!thr.ok) {
    return Object.assign(out, {
      status: 'UNIT_ERROR',
      comparison: null,
      detail: 'Could not normalize the threshold figure: ' + thr.reason + ' (' + t.unit + ').',
      conversion: inv.steps,
      blocks: 'APPLICABILITY_CONCLUSION',
    });
  }

  const conversion = (inv.steps || []).concat(thr.steps || []);
  const notes = (inv.notes || []).concat(thr.notes || []);
  const invKg = inv.value;
  const thrKg = thr.value;
  const ratio = thrKg > 0 ? invKg / thrKg : null;

  let comparison;
  if (invKg > thrKg) comparison = 'EXCEEDS';
  else if (invKg === thrKg) comparison = 'AT_OR_ABOVE';
  else if (ratio !== null && ratio >= APPROACHING_FRACTION) comparison = 'APPROACHING';
  else comparison = 'BELOW';

  const arithmetic =
    fmt(invKg) + ' kg (site) ' + (comparison === 'BELOW' || comparison === 'APPROACHING' ? '<' : comparison === 'AT_OR_ABOVE' ? '=' : '>') + ' ' + fmt(thrKg) + ' kg (schedule)';

  return Object.assign(out, {
    status: 'EVALUATED',
    comparison,
    crossed: comparison === 'EXCEEDS' || comparison === 'AT_OR_ABOVE',
    normalized: { inventoryKg: invKg, thresholdKg: thrKg, ratio },
    ratioPercent: ratio === null ? null : Math.round(ratio * 1000) / 10,
    arithmetic,
    conversion,
    notes: notes.concat(
      comparison === 'APPROACHING'
        ? ['Inventory is at ' + Math.round(ratio * 100) + ' % of the scheduled figure. Confirm the maximum quantity liable to be present, not only the normal holding.']
        : []
    ),
    factsUsed: [
      { field: 'chemical.quantity', value: chem.quantity, unit: chem.quantityUnit, status: chem.quantityStatus || null, chemicalId: chem.id },
      chem.density ? { field: 'chemical.density', value: chem.density, unit: chem.densityUnit || 'kg/L', status: chem.densityStatus || null, chemicalId: chem.id } : null,
      { field: 'threshold.value', value: t.value, unit: t.unit, locator: t.locator, status: t.status || 'VERIFIED' },
    ].filter(Boolean),
  });
}

/**
 * Evaluate a whole inventory against a threshold set.
 * Aggregation across chemicals is NOT performed automatically: whether
 * quantities of different substances aggregate, and by what rule, is a
 * question for the official text, so the engine reports per-chemical results
 * and flags the aggregation question instead of inventing a summation rule.
 */
function evaluateInventory(req) {
  const r = req || {};
  const set = r.thresholdSet || {};
  const entries = set.entries || [];
  const results = [];
  const unmatched = [];

  for (const chem of r.chemicals || []) {
    const matches = entries.filter((e) => entryMatchesChemical(e, chem));
    if (matches.length === 0) {
      unmatched.push({
        chemicalId: chem.id,
        chemicalName: chem.canonicalName || chem.name,
        status: 'NO_SCHEDULE_ENTRY',
        detail:
          'No entry in "' + (set.label || set.id) + '" has been recorded for this chemical. Absence of an entry is not a finding that the chemical is unscheduled — check the official schedule and add the entry, or mark it not applicable with a reason.',
      });
      continue;
    }
    for (const e of matches) {
      results.push(Object.assign(evaluateThreshold({ chemical: chem, thresholdEntry: e }), { thresholdSetId: set.id, entryId: e.id || null }));
    }
  }

  const crossed = results.filter((x) => x.crossed);
  const approaching = results.filter((x) => x.comparison === 'APPROACHING');
  const blocked = results.filter((x) => x.blocks === 'APPLICABILITY_CONCLUSION');

  return {
    engine: THRESHOLD_ENGINE_VERSION,
    thresholdSetId: set.id,
    results,
    unmatched,
    summary: {
      evaluated: results.filter((x) => x.status === 'EVALUATED').length,
      crossed: crossed.length,
      approaching: approaching.length,
      blocked: blocked.length,
      unmatched: unmatched.length,
    },
    aggregationQuestion:
      entries.length > 1 && (r.chemicals || []).length > 1
        ? 'Whether quantities of different scheduled substances aggregate, and under what rule, must be read from the official text. The engine has not summed across substances.'
        : null,
    conclusion: crossed.length
      ? 'THRESHOLD_CROSSED'
      : blocked.length
      ? 'CANNOT_CONCLUDE'
      : approaching.length
      ? 'APPROACHING_THRESHOLD'
      : results.length
      ? 'BELOW_ALL_VERIFIED_THRESHOLDS'
      : 'NO_VERIFIED_THRESHOLDS',
  };
}

function entryMatchesChemical(entry, chem) {
  if (!entry || !chem) return false;
  if (entry.cas && chem.cas) {
    const a = validateCas(entry.cas);
    const b = validateCas(chem.cas);
    if (a.valid && b.valid) return a.normalized === b.normalized;
  }
  const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
  const en = norm(entry.chemicalName);
  if (!en) return false;
  const names = [chem.canonicalName, chem.name].concat(chem.synonyms || []).map(norm).filter(Boolean);
  if (names.indexOf(en) !== -1) return true;
  // A class-level entry matches when the chemical declares that class.
  if (entry.isClass && (chem.hazardClasses || []).map(norm).indexOf(en) !== -1) return true;
  return false;
}

/**
 * Validate a threshold entry a user is about to save. A figure without a
 * citation is rejected at the boundary, not silently stored.
 */
function validateThresholdEntry(entry) {
  const e = entry || {};
  const errors = [];
  if (!e.chemicalName && !e.cas) errors.push('Name the chemical or chemical class exactly as the schedule names it.');
  if (!Number.isFinite(Number(e.value)) || Number(e.value) <= 0) errors.push('Enter the quantity from the schedule as a positive number.');
  if (!e.unit) errors.push('Enter the unit as the schedule states it.');
  else {
    const k = toKg(1, e.unit);
    if (!k.ok) errors.push('Unit "' + e.unit + '" is not a recognized mass unit. Use kg, t/MT, g or lb.');
  }
  if (!e.locator || String(e.locator).trim().length < 4) errors.push('Cite the schedule and entry this figure comes from.');
  if (!e.status || (e.status !== 'VERIFIED' && e.status !== 'USER_CONFIRMED')) {
    errors.push('Mark the figure VERIFIED (read from the official text) or USER_CONFIRMED (asserted by you, recorded as an assumption).');
  }
  return { ok: errors.length === 0, errors };
}


/* ===== packages/legal/applicability.js ===== */
// packages/legal/applicability.js
// Jurisdiction resolver + deterministic applicability engine.
// Facts are tri-state: true / false / null. A null fact yields NOT_ENOUGH_DATA,
// never a guess. No LLM arithmetic and no LLM decision reaches this file.





const APPLICABILITY_ENGINE_VERSION = 'applicability-1.0.0';

/**
 * Derive the trigger facts the library refers to, from the project's
 * jurisdiction profile, chemical inventory and equipment list.
 *
 * Every fact is accompanied by the project field(s) that produced it, so the
 * register can show exactly which facts a conclusion rests on.
 *
 * @param {Object} ctx { project, chemicals[], chemProperties[], equipment[] }
 * @returns {Object} { facts, provenance }
 */
function resolveJurisdiction(ctx) {
  const c = ctx || {};
  const p = c.project || {};
  const j = p.jurisdiction || {};
  const chems = c.chemicals || [];
  const equip = c.equipment || [];
  const facts = {};
  const provenance = {};

  const put = (key, value, from, note) => {
    facts[key] = value;
    provenance[key] = { from: from, value: value, note: note || null };
  };

  put('always', true, ['—'], 'Always a candidate; applicability still depends on the obligation.');
  put('isEstablishment', j.establishmentCategory ? true : null, ['jurisdiction.establishmentCategory']);
  put('stateGujarat', j.state ? /gujarat/i.test(String(j.state)) : null, ['jurisdiction.state']);
  put('inIndustrialEstate', p.industrialEstate ? true : j.industrialEstate === false ? false : null, ['project.industrialEstate']);

  const ag = String(j.appropriateGovernment || '').toLowerCase();
  put('appropriateGovernmentCentral', ag ? ag.indexOf('central') !== -1 : null, ['jurisdiction.appropriateGovernment']);
  put('appropriateGovernmentState', ag ? ag.indexOf('state') !== -1 : null, ['jurisdiction.appropriateGovernment']);

  put('hazardousProcess', tri(j.hazardousProcess), ['jurisdiction.hazardousProcess']);
  put('workerCount', Number.isFinite(Number(j.workerCount)) ? Number(j.workerCount) : null, ['jurisdiction.workerCount']);

  // Chemicals present at all?
  if (chems.length === 0) {
    put('hazardousChemicalsPresent', null, ['chemicals'], 'No chemical inventory recorded.');
  } else {
    const anyClassified = chems.some((x) => x.hazardousClassification === true || (typeof x.hazardousClassification === 'string' && x.hazardousClassification.trim() !== ''));
    const anyUnknown = chems.some((x) => x.hazardousClassification === null || x.hazardousClassification === undefined || x.hazardousClassification === '');
    put(
      'hazardousChemicalsPresent',
      anyClassified ? true : anyUnknown ? null : false,
      ['chemicals[].hazardousClassification'],
      anyUnknown && !anyClassified ? 'Some chemicals have no hazardous classification recorded.' : null
    );
  }

  put('emitsToAir', tri(j.emitsToAir !== undefined ? j.emitsToAir : p.emitsToAir), ['jurisdiction.emitsToAir']);
  put('dischargesToWaterOrLand', tri(j.dischargesToWaterOrLand !== undefined ? j.dischargesToWaterOrLand : p.dischargesToWaterOrLand), ['jurisdiction.dischargesToWaterOrLand']);
  put('hazardousWasteGenerated', tri(j.hazardousWasteGenerated), ['jurisdiction.hazardousWasteGenerated']);
  put('groundwaterAbstraction', tri(j.groundwaterAbstraction), ['jurisdiction.groundwaterAbstraction']);
  put('dispatchesHazardousGoods', tri(j.dispatchesHazardousGoods), ['jurisdiction.dispatchesHazardousGoods']);
  put('scheduledActivityQuestion', tri(j.scheduledActivity), ['jurisdiction.scheduledActivity'], 'Whether the activity appears in the EIA Notification schedule must be established from the official text.');

  put('petroleumClassPresent', tri(j.petroleumClassPresent), ['jurisdiction.petroleumClassPresent']);
  put('compressedGasCylindersPresent', tri(j.compressedGasPresent), ['jurisdiction.compressedGasPresent']);
  put('explosivesRelevant', tri(j.explosivesRelevant), ['jurisdiction.explosivesRelevant']);
  put('ammoniumNitrateRelevant', tri(j.ammoniumNitrateRelevant), ['jurisdiction.ammoniumNitrateRelevant']);
  put('calciumCarbideRelevant', tri(j.calciumCarbideRelevant), ['jurisdiction.calciumCarbideRelevant']);

  // Equipment-derived facts
  const pv = equip.filter((e) => e.pressureEquipment);
  const pvGas = pv.filter((e) => e.compressedGasService);
  put(
    'pressureVesselCompressedGas',
    pvGas.length > 0 ? true : j.pressureVesselPresent === false ? false : pv.length > 0 ? null : tri(j.pressureVesselPresent),
    ['equipment[].pressureEquipment', 'equipment[].compressedGasService', 'jurisdiction.pressureVesselPresent'],
    pv.length > 0 && pvGas.length === 0 ? 'Pressure equipment exists but no compressed-gas service is declared on it; SMPV(U) scope is unresolved.' : null
  );
  const boilers = equip.filter((e) => /boiler|steam\s*generator/i.test(String(e.type || '') + ' ' + String(e.service || '')));
  put('boilerInScope', boilers.length > 0 ? true : tri(j.boilerInScope), ['equipment[].type', 'jurisdiction.boilerInScope']);

  return { facts, provenance, engine: APPLICABILITY_ENGINE_VERSION };
}

// Plain-language questions for the facts that gate instrument candidacy.
// Shown on the legal page so the unresolved set is answerable, not just listed.
const FACT_QUESTIONS = Object.freeze({
  isEstablishment: 'What is the establishment / factory category for this site?',
  stateGujarat: 'Which state or union territory is the site in?',
  inIndustrialEstate: 'Is the site inside a notified industrial estate?',
  appropriateGovernmentCentral: 'Is the appropriate government for this establishment the Central Government or the State Government?',
  appropriateGovernmentState: 'Is the appropriate government for this establishment the Central Government or the State Government?',
  hazardousProcess: 'Does the establishment carry on a hazardous process as defined in the applicable law?',
  hazardousChemicalsPresent: 'Are any of the chemicals handled classified as hazardous chemicals?',
  emitsToAir: 'Does the site have any emission to air within the scope of the Air Act?',
  dischargesToWaterOrLand: 'Does the site discharge effluent to water or land?',
  hazardousWasteGenerated: 'Does the site generate hazardous waste?',
  groundwaterAbstraction: 'Does the site abstract groundwater?',
  dispatchesHazardousGoods: 'Does the site dispatch hazardous goods by road?',
  scheduledActivityQuestion: 'Does this project or activity appear in the schedule to the EIA Notification, and in which category?',
  petroleumClassPresent: 'Is petroleum, as defined by the Petroleum Act, stored or handled on site?',
  compressedGasCylindersPresent: 'Are compressed-gas cylinders stored or used on site?',
  pressureVesselCompressedGas: 'Is any unfired pressure vessel used for compressed-gas service?',
  explosivesRelevant: 'Are explosives, as defined by the Explosives Act, present on site?',
  ammoniumNitrateRelevant: 'Is ammonium nitrate handled or stored on site?',
  calciumCarbideRelevant: 'Is calcium carbide handled or stored on site?',
  boilerInScope: 'Is any equipment on site a boiler or an IBR-scope component?',
});

function tri(v) {
  if (v === true || v === 'true' || v === 'yes') return true;
  if (v === false || v === 'false' || v === 'no') return false;
  return null;
}

/**
 * Evaluate a declarative predicate against the resolved facts.
 * Returns { value: true|false|null, used: [...], unresolved: [...] }
 */
function evaluatePredicate(logic, facts) {
  const used = [];
  const unresolved = [];
  if (!logic || (!logic.all && !logic.any)) {
    return { value: true, used, unresolved, reason: 'NO_CONDITIONS' };
  }

  let allValue = true;
  for (const cond of logic.all || []) {
    const r = evalCond(cond, facts);
    used.push({ fact: cond.fact, value: r.raw });
    if (r.value === null) {
      unresolved.push(cond.fact);
      allValue = allValue === false ? false : null;
    } else if (r.value === false) {
      allValue = false;
    }
  }

  if (logic.any && logic.any.length) {
    let anyValue = false;
    let anyUnresolved = false;
    for (const cond of logic.any) {
      const r = evalCond(cond, facts);
      used.push({ fact: cond.fact, value: r.raw });
      if (r.value === true) anyValue = true;
      else if (r.value === null) {
        anyUnresolved = true;
        unresolved.push(cond.fact);
      }
    }
    const anyResult = anyValue ? true : anyUnresolved ? null : false;
    if (allValue === false || anyResult === false) return { value: false, used, unresolved };
    if (allValue === null || anyResult === null) return { value: null, used, unresolved };
    return { value: true, used, unresolved };
  }

  return { value: allValue, used, unresolved };
}

function evalCond(cond, facts) {
  const raw = facts ? facts[cond.fact] : undefined;
  if (raw === undefined || raw === null) return { value: null, raw: null };
  if (Object.prototype.hasOwnProperty.call(cond, 'eq')) return { value: raw === cond.eq, raw };
  if (Object.prototype.hasOwnProperty.call(cond, 'gte')) {
    const target = typeof cond.gte === 'string' ? facts[cond.gte] : cond.gte;
    if (target === null || target === undefined) return { value: null, raw };
    return { value: Number(raw) >= Number(target), raw };
  }
  if (Object.prototype.hasOwnProperty.call(cond, 'truthy')) return { value: !!raw === !!cond.truthy, raw };
  return { value: raw === true, raw };
}

/**
 * Evaluate ONE obligation for a project.
 *
 * @param {Object} req { obligation, facts, provenance, thresholdSets, chemicals,
 *                       existingRecord, criticalFactsVerified }
 * @returns {Object} ProjectComplianceRecord shape (applicability part)
 */
function evaluateObligation(req) {
  const r = req || {};
  const ob = r.obligation || {};
  const facts = r.facts || {};
  const prov = r.provenance || {};
  const instrument = instrumentById(ob.instrumentId);

  const out = {
    engine: APPLICABILITY_ENGINE_VERSION,
    obligationId: ob.id,
    instrumentId: ob.instrumentId,
    instrumentTitle: instrument ? instrument.title : ob.instrumentId,
    domain: instrument ? instrument.domain : null,
    topic: ob.topic,
    sectionRuleSchedule: ob.sectionRuleSchedule,
    authority: ob.responsibleAuthority,
    evidenceExpected: ob.evidenceExpected || [],
    sourceRefs: instrument ? [{ kind: instrument.sourceRootKey || 'OFFICIAL', url: instrument.officialSourceUrl, locator: ob.sourceQuoteLocator, sourceStatus: instrument.sourceStatus }] : [],
    legalSourceVersion: instrument ? instrument.amendmentStatus : null,
    factsUsed: [],
    missingFacts: [],
    thresholdEvaluation: null,
  };

  // A standard is not an obligation until an adoption route is recorded.
  if (instrument && instrument.isStandard) {
    const m = standardIsMandatory(instrument);
    if (!m.mandatory) {
      return Object.assign(out, {
        applicabilityStatus: 'NOT_APPLICABLE_CONFIRMED',
        applicabilityReason:
          'This is a standard, not a law. ' + (m.detail || '') + ' It is listed as guidance in the report and is not treated as a statutory obligation.',
        isStandardGuidance: true,
        setBy: 'ENGINE_RULE_STANDARD_NOT_LAW',
      });
    }
  }

  // 1. Predicate over project facts.
  const pred = evaluatePredicate(ob.applicabilityLogic, facts);
  out.factsUsed = pred.used.map((u) => Object.assign({}, u, { provenance: prov[u.fact] || null }));
  out.missingFacts = pred.unresolved.slice();

  if (pred.value === false) {
    return Object.assign(out, {
      applicabilityStatus: 'NOT_APPLICABLE_CONFIRMED',
      applicabilityReason: 'A trigger condition is false on verified project facts: ' + describeFalse(pred, facts) + '.',
      setBy: 'ENGINE_DETERMINISTIC_EXCLUSION',
      requiresHumanReview: true,
    });
  }
  if (pred.value === null) {
    return Object.assign(out, {
      applicabilityStatus: 'NOT_ENOUGH_DATA',
      applicabilityReason:
        'Trigger fact' + (pred.unresolved.length > 1 ? 's' : '') + ' not resolved: ' + pred.unresolved.join(', ') + '. Resolve them on the jurisdiction profile or the chemical inventory.',
      setBy: 'ENGINE_MISSING_FACT',
      requiresHumanReview: true,
    });
  }

  // 2. Threshold-gated obligations.
  const thresholdRef = (ob.applicabilityLogic && ob.applicabilityLogic.requiresThreshold) || ob.thresholdRef;
  if (thresholdRef) {
    const set = (r.thresholdSets || []).filter((s) => s.id === thresholdRef)[0] || thresholdSetById(thresholdRef);
    const evaluation = evaluateInventory({ thresholdSet: set || { id: thresholdRef, entries: [] }, chemicals: r.chemicals || [] });
    out.thresholdEvaluation = evaluation;

    if (evaluation.conclusion === 'NO_VERIFIED_THRESHOLDS') {
      return Object.assign(out, {
        applicabilityStatus: 'POTENTIALLY_APPLICABLE',
        applicabilityReason:
          'The trigger conditions are met, but no verified threshold figure has been entered for "' +
          ((set && set.label) || thresholdRef) +
          '". Enter the scheduled quantities from the official text and cite them; the engine will then compute the crossing.',
        setBy: 'ENGINE_THRESHOLD_UNVERIFIED',
        requiresHumanReview: true,
        actionNeeded: 'ENTER_VERIFIED_THRESHOLD',
      });
    }
    if (evaluation.conclusion === 'CANNOT_CONCLUDE') {
      const blockedFacts = evaluation.results.filter((x) => x.blocks).reduce((acc, x) => acc.concat(x.missingFacts || []), []);
      out.missingFacts = out.missingFacts.concat(blockedFacts);
      return Object.assign(out, {
        applicabilityStatus: 'NOT_ENOUGH_DATA',
        applicabilityReason: 'Threshold comparison is blocked: ' + evaluation.results.filter((x) => x.blocks).map((x) => x.detail).slice(0, 2).join(' '),
        setBy: 'ENGINE_THRESHOLD_BLOCKED',
        requiresHumanReview: true,
      });
    }
    if (evaluation.conclusion === 'THRESHOLD_CROSSED') {
      const crossed = evaluation.results.filter((x) => x.crossed);
      const allVerified = r.criticalFactsVerified === true && crossed.every((x) => (x.factsUsed || []).every((f) => !f.status || f.status === 'VERIFIED'));
      return Object.assign(out, {
        applicabilityStatus: allVerified ? 'APPLICABLE_CONFIRMED' : 'POTENTIALLY_APPLICABLE',
        applicabilityReason:
          'Site inventory crosses a verified scheduled quantity: ' +
          crossed.map((x) => x.chemicalName + ' — ' + x.arithmetic).join('; ') +
          (allVerified ? '. All facts used are VERIFIED.' : '. Confirm the facts used, then a reviewer can confirm applicability.'),
        setBy: allVerified ? 'ENGINE_VERIFIED_THRESHOLD_CROSSING' : 'ENGINE_THRESHOLD_CROSSING_UNVERIFIED_FACTS',
        requiresHumanReview: !allVerified,
        crossings: crossed.map((x) => ({ chemicalId: x.chemicalId, chemicalName: x.chemicalName, arithmetic: x.arithmetic, locator: x.thresholdLocator })),
      });
    }
    if (evaluation.conclusion === 'APPROACHING_THRESHOLD') {
      return Object.assign(out, {
        applicabilityStatus: 'POTENTIALLY_APPLICABLE',
        applicabilityReason:
          'Inventory is close to a scheduled quantity: ' + evaluation.results.filter((x) => x.comparison === 'APPROACHING').map((x) => x.chemicalName + ' at ' + x.ratioPercent + ' % of the figure').join('; ') +
          '. Confirm the maximum quantity liable to be present, not only the normal holding.',
        setBy: 'ENGINE_APPROACHING_THRESHOLD',
        requiresHumanReview: true,
      });
    }
    // BELOW_ALL_VERIFIED_THRESHOLDS
    const unmatched = evaluation.unmatched || [];
    if (unmatched.length) {
      return Object.assign(out, {
        applicabilityStatus: 'NOT_ENOUGH_DATA',
        applicabilityReason:
          unmatched.length + ' chemical(s) have no recorded schedule entry, so "below threshold" cannot be concluded for the site: ' + unmatched.map((u) => u.chemicalName).join(', ') + '.',
        setBy: 'ENGINE_UNMATCHED_CHEMICALS',
        requiresHumanReview: true,
      });
    }
    return Object.assign(out, {
      applicabilityStatus: r.criticalFactsVerified === true ? 'NOT_APPLICABLE_CONFIRMED' : 'POTENTIALLY_APPLICABLE',
      applicabilityReason:
        'Every chemical with a verified schedule entry is below its scheduled quantity: ' + evaluation.results.map((x) => x.chemicalName + ' — ' + x.arithmetic).join('; ') + '.',
      setBy: 'ENGINE_BELOW_VERIFIED_THRESHOLDS',
      requiresHumanReview: r.criticalFactsVerified !== true,
    });
  }

  // 3. No threshold gate: the obligation depends on facts alone.
  if (ob.legalReviewRequired) {
    return Object.assign(out, {
      applicabilityStatus: 'POTENTIALLY_APPLICABLE',
      applicabilityReason:
        'Trigger conditions are met on project facts (' +
        pred.used.filter((u) => u.value === true).map((u) => u.fact).join(', ') +
        '). The precise duty set is in the official text, so a competent person must confirm which duties apply and to what extent.',
      setBy: 'ENGINE_TRIGGERS_MET_REVIEW_REQUIRED',
      requiresHumanReview: true,
    });
  }
  return Object.assign(out, {
    applicabilityStatus: 'POTENTIALLY_APPLICABLE',
    applicabilityReason: 'Trigger conditions are met on project facts.',
    setBy: 'ENGINE_TRIGGERS_MET',
    requiresHumanReview: true,
  });
}

function describeFalse(pred, facts) {
  const falses = pred.used.filter((u) => facts[u.fact] === false);
  if (!falses.length) return 'a trigger condition is not satisfied';
  return falses.map((u) => u.fact + ' = false').join(', ');
}

/**
 * Select candidate instruments and evaluate every obligation.
 *
 * @param {Object} ctx { project, chemicals, chemProperties, equipment, thresholdSets, existingRecords }
 */
function runApplicability(ctx) {
  const c = ctx || {};
  const resolved = resolveJurisdiction(c);
  const facts = resolved.facts;

  // Candidate instruments: any instrument whose triggers are true or unresolved.
  const candidates = [];
  const excluded = [];
  for (const inst of LEGAL_INSTRUMENTS) {
    const trig = inst.triggers || [];
    if (trig.length === 0) {
      candidates.push({ instrument: inst, reason: 'NO_TRIGGERS' });
      continue;
    }
    const values = trig.map((t) => facts[t]);
    if (values.some((v) => v === true)) candidates.push({ instrument: inst, reason: 'TRIGGER_TRUE', triggers: trig });
    else if (values.some((v) => v === null || v === undefined)) candidates.push({ instrument: inst, reason: 'TRIGGER_UNRESOLVED', triggers: trig });
    else excluded.push({ instrument: inst, reason: 'ALL_TRIGGERS_FALSE', triggers: trig });
  }

  const criticalFactsVerified = c.criticalFactsVerified === true;
  const records = [];
  for (const cand of candidates) {
    for (const ob of LEGAL_OBLIGATIONS.filter((o) => o.instrumentId === cand.instrument.id)) {
      records.push(
        Object.assign(
          evaluateObligation({
            obligation: ob,
            facts,
            provenance: resolved.provenance,
            thresholdSets: c.thresholdSets,
            chemicals: c.chemicals,
            criticalFactsVerified,
          }),
          { candidateReason: cand.reason }
        )
      );
    }
  }

  const counts = { APPLICABLE_CONFIRMED: 0, POTENTIALLY_APPLICABLE: 0, NOT_APPLICABLE_CONFIRMED: 0, NOT_ENOUGH_DATA: 0, REQUIRES_LEGAL_REVIEW: 0 };
  for (const rec of records) if (Object.prototype.hasOwnProperty.call(counts, rec.applicabilityStatus)) counts[rec.applicabilityStatus] += 1;

  // Unresolved trigger facts, grouped so the UI can say "answer these N
  // questions to resolve M obligations" instead of burying them in the register.
  const pending = new Map();
  for (const cand of candidates) {
    if (cand.reason !== 'TRIGGER_UNRESOLVED') continue;
    for (const t of cand.triggers || []) {
      if (facts[t] !== null && facts[t] !== undefined) continue;
      if (!pending.has(t)) pending.set(t, { fact: t, question: FACT_QUESTIONS[t] || 'Resolve the project fact "' + t + '".', instruments: [], obligationCount: 0 });
      const e = pending.get(t);
      e.instruments.push({ id: cand.instrument.id, title: cand.instrument.title });
      e.obligationCount += LEGAL_OBLIGATIONS.filter((o) => o.instrumentId === cand.instrument.id).length;
    }
  }

  return {
    pendingQuestions: Array.from(pending.values()).sort((a, b) => b.obligationCount - a.obligationCount),
    engine: APPLICABILITY_ENGINE_VERSION,
    resolvedFacts: facts,
    provenance: resolved.provenance,
    candidates: candidates.map((x) => ({ instrumentId: x.instrument.id, title: x.instrument.title, reason: x.reason })),
    excluded: excluded.map((x) => ({ instrumentId: x.instrument.id, title: x.instrument.title, reason: x.reason, triggers: x.triggers })),
    records,
    counts,
    unresolvedFacts: Array.from(new Set(records.reduce((a, r) => a.concat(r.missingFacts || []), []))),
  };
}

/**
 * Link an obligation to the nodes it genuinely touches. The system does not
 * force a citation onto every worksheet row.
 *
 * @param {Object} req { record, nodes[], chemicals[], equipment[], permitConditions[] }
 * @returns {Array} links [{ nodeId, reason, detail }]
 */
function linkObligationToNodes(req) {
  const r = req || {};
  const rec = r.record || {};
  const links = [];

  // 1. A threshold crossing on a chemical present in the node.
  const crossedChemIds = (rec.crossings || []).map((x) => x.chemicalId);
  for (const n of r.nodes || []) {
    const hit = (n.chemicalIds || []).filter((id) => crossedChemIds.indexOf(id) !== -1);
    if (hit.length) {
      links.push({
        nodeId: n.id,
        reason: 'THRESHOLD_CROSSING_CHEMICAL_IN_NODE',
        detail: 'A chemical in this node crosses a scheduled quantity for ' + rec.instrumentTitle + '.',
        chemicalIds: hit,
      });
    }
  }

  // 2. Equipment class triggers.
  const affected = (rec.affectedEquipmentTypes || []).concat(((LEGAL_OBLIGATIONS.filter((o) => o.id === rec.obligationId)[0] || {}).affectedEquipmentTypes) || []);
  if (affected.length) {
    for (const n of r.nodes || []) {
      const eq = (r.equipment || []).filter((e) => (n.equipmentIds || []).indexOf(e.id) !== -1);
      const match = eq.filter((e) => affected.some((t) => String(e.type || '').toLowerCase().indexOf(String(t).toLowerCase()) !== -1 || String(e.service || '').toLowerCase().indexOf(String(t).toLowerCase()) !== -1));
      if (match.length && !links.some((l) => l.nodeId === n.id)) {
        links.push({
          nodeId: n.id,
          reason: 'EQUIPMENT_CLASS_IN_SCOPE',
          detail: 'Equipment in this node (' + match.map((e) => e.tag || e.id).join(', ') + ') falls within the equipment classes this obligation addresses.',
          equipmentIds: match.map((e) => e.id),
        });
      }
    }
  }

  // 3. A permit condition naming the node's equipment tag or chemical.
  for (const cond of r.permitConditions || []) {
    if (cond.obligationId && cond.obligationId !== rec.obligationId) continue;
    for (const n of r.nodes || []) {
      const eqTags = (r.equipment || []).filter((e) => (n.equipmentIds || []).indexOf(e.id) !== -1).map((e) => e.tag).filter(Boolean);
      const chemNames = (r.chemicals || []).filter((x) => (n.chemicalIds || []).indexOf(x.id) !== -1).map((x) => x.canonicalName || x.name).filter(Boolean);
      const text = String(cond.text || '').toLowerCase();
      const named = eqTags.concat(chemNames).filter((t) => text.indexOf(String(t).toLowerCase()) !== -1);
      if (named.length) {
        links.push({
          nodeId: n.id,
          reason: 'PERMIT_CONDITION_NAMES_NODE_ITEM',
          detail: 'A condition of ' + (cond.permitLabel || 'an uploaded permit') + ' names ' + named.join(', ') + '.',
          conditionId: cond.id,
        });
      }
    }
  }

  // 4. Obligations the library marks as HAZOP-linked apply to every node.
  const ob = LEGAL_OBLIGATIONS.filter((o) => o.id === rec.obligationId)[0];
  if (ob && ob.linksToHazop && rec.applicabilityStatus !== 'NOT_APPLICABLE_CONFIRMED') {
    for (const n of r.nodes || []) {
      if (!links.some((l) => l.nodeId === n.id)) {
        links.push({ nodeId: n.id, reason: 'STUDY_LEVEL_OBLIGATION', detail: 'This obligation concerns the study and its findings, so it is relevant to every node.' });
      }
    }
  }

  return links;
}

/** Are the facts a record rests on all VERIFIED? Used to gate CONFIRMED statuses. */
function factsAllVerified(record, extractedFields) {
  const used = (record && record.factsUsed) || [];
  if (!used.length) return false;
  for (const u of used) {
    const f = (extractedFields || []).filter((x) => x.field === u.fact)[0];
    if (!f) return false;
    if (f.status !== 'VERIFIED') return false;
    if (!isUsable(f.status)) return false;
  }
  return true;
}

// packages/reports/quality-gate.js
// The report quality gate. It never approves anything; it reports what blocks
// a REVIEWED / APPROVED status. A DRAFT export is always permitted.









const QUALITY_GATE_VERSION = 'quality-gate-1.0.0';

const CAUTION_TEXT =
  'This report records the findings of a HAZOP team workshop supported by automated analysis. ' +
  'It is not a statutory certification, a design approval or a legal opinion. Applicability statuses marked ' +
  'POTENTIALLY_APPLICABLE, NOT_ENOUGH_DATA or REQUIRES_LEGAL_REVIEW are unresolved questions, not findings of ' +
  'compliance or non-compliance. Values labelled AI_INFERRED are model inferences that a competent person must ' +
  'verify. Residual risk ratings assume the recommendations are implemented as described.';

function check(id, label, severity, pass, detail, fixHint, route) {
  return { id, label, severity, pass: !!pass, detail: detail || null, fixHint: fixHint || null, route: route || null };
}

/**
 * @param {Object} ctx {
 *   project, matrix, documents[], chemicals[], chemProperties[], equipment[],
 *   nodes[], scenarios[], recommendations[], team[], compliance[], permits[],
 *   sources[], assumptions[], dataGaps[], conflicts[], today
 * }
 * @returns {Object} { status, checks[], blocking, advisory, summary }
 */
function runQualityGate(ctx) {
  const c = ctx || {};
  const p = c.project || {};
  const matrix = c.matrix || DEFAULT_MATRIX;
  const nodes = c.nodes || [];
  const scenarios = c.scenarios || [];
  const recs = c.recommendations || [];
  const checks = [];

  // --- identity and methodology ---------------------------------------------
  checks.push(
    check(
      'identity',
      'Project identity recorded',
      'BLOCKING',
      !!(p.projectName && p.clientName && p.siteName && p.product),
      'Project, client, site and product must all be present on the cover.',
      'Complete the project profile.',
      'projects'
    )
  );

  const j = p.jurisdiction || {};
  const unresolvedJ = REQUIRED_JURISDICTION.filter((f) => j[f.path] === null || j[f.path] === undefined || j[f.path] === '');
  checks.push(
    check(
      'jurisdiction',
      'Jurisdiction resolved',
      'BLOCKING',
      unresolvedJ.length === 0,
      unresolvedJ.length ? 'Unresolved: ' + unresolvedJ.map((f) => f.label).join(', ') + '.' : 'All required jurisdiction fields are set.',
      'Set them on the jurisdiction profile. Unresolved fields force NOT_ENOUGH_DATA in the legal register.',
      'projects'
    )
  );

  checks.push(check('matrix', 'Risk matrix selected and versioned', 'BLOCKING', !!(matrix && matrix.id && matrix.version), 'Matrix: ' + (matrix.id || 'none'), 'Choose a matrix on the Risk page.', 'risk'));

  checks.push(
    check(
      'documents',
      'Document register populated',
      'BLOCKING',
      (c.documents || []).length > 0,
      (c.documents || []).length + ' document(s) registered.',
      'Register at least the PFD/BMR and the documents the study relied on, even if the files are held elsewhere.',
      'documents'
    )
  );

  checks.push(
    check(
      'processBasis',
      'Process basis available',
      'BLOCKING',
      !!(p.processDescription && String(p.processDescription).trim().length > 40),
      'A process description is the basis for every design intent.',
      'Write the process description on the project overview.',
      'process'
    )
  );

  // --- chemicals -------------------------------------------------------------
  const chems = c.chemicals || [];
  checks.push(check('chemicalsReviewed', 'Chemical inventory reviewed', 'BLOCKING', chems.length > 0, chems.length + ' chemical(s) in the inventory.', 'Add the chemicals handled in the study scope.', 'chemicals'));

  const noQty = chems.filter((x) => x.quantity === null || x.quantity === undefined || x.quantity === '');
  checks.push(
    check(
      'chemicalQuantities',
      'Every chemical has a quantity',
      'BLOCKING',
      noQty.length === 0,
      noQty.length ? 'Missing quantity: ' + noQty.map((x) => x.canonicalName || x.name).join(', ') + '.' : 'All quantities present.',
      'A missing quantity blocks every legal threshold conclusion.',
      'chemicals'
    )
  );

  const sdsStatus = chems.map((x) => ({ chem: x, s: sdsCompleteness(x.id, c.chemProperties || []) }));
  const sdsIncomplete = sdsStatus.filter((x) => x.s.status !== 'COMPLETE');
  checks.push(
    check(
      'sdsStatus',
      'SDS data status visible for every chemical',
      'ADVISORY',
      sdsIncomplete.length === 0,
      sdsIncomplete.length ? sdsIncomplete.map((x) => (x.chem.canonicalName || x.chem.name) + ' (' + x.s.status + ', missing ' + x.s.missingLabels.join('/') + ')').join('; ') : 'Critical properties present for all chemicals.',
      'Attach SDSs or mark properties not applicable with a reason. Missing properties are printed in the missing-data register.',
      'chemicals'
    )
  );

  const propConflicts = (c.chemProperties || []).filter((x) => x.status === 'CONFLICT');
  checks.push(
    check(
      'chemicalConflicts',
      'No unresolved conflict on a critical chemical property',
      'BLOCKING',
      propConflicts.length === 0,
      propConflicts.length ? propConflicts.length + ' property conflict(s) unresolved.' : 'No property conflicts.',
      'Resolve each conflict card, or record the conflict as an assumption with the more conservative value used.',
      'chemicals'
    )
  );

  // --- legal thresholds -----------------------------------------------------
  const compliance = c.compliance || [];
  const thresholdPending = compliance.filter((x) => x.actionNeeded === 'ENTER_VERIFIED_THRESHOLD');
  checks.push(
    check(
      'thresholdsChecked',
      'Threshold figures entered where an instrument turns on quantity',
      'ADVISORY',
      thresholdPending.length === 0,
      thresholdPending.length ? thresholdPending.length + ' obligation(s) are POTENTIALLY_APPLICABLE only because no verified threshold figure has been entered.' : 'No pending threshold entries.',
      'Read the scheduled quantities from the official text, enter them with a citation, and the engine will compute the crossing.',
      'legal'
    )
  );

  // --- nodes and worksheets -------------------------------------------------
  const unapproved = nodes.filter((n) => n.reviewStatus === 'PROPOSED');
  checks.push(
    check(
      'nodesApproved',
      'Every node approved by the team',
      'BLOCKING',
      nodes.length > 0 && unapproved.length === 0,
      nodes.length === 0 ? 'No nodes defined.' : unapproved.length ? unapproved.length + ' node(s) still PROPOSED.' : nodes.length + ' node(s) approved.',
      'Review each proposed node and approve, edit or delete it.',
      'nodes'
    )
  );

  const emptyNodes = nodes.filter((n) => n.reviewStatus !== 'PROPOSED' && scenarios.filter((s) => s.nodeId === n.id).length === 0);
  checks.push(
    check(
      'nodesWorksheeted',
      'Every approved node has at least one worksheet row',
      'BLOCKING',
      emptyNodes.length === 0,
      emptyNodes.length ? 'No rows on node(s): ' + emptyNodes.map((n) => n.nodeNumber || n.id).join(', ') + '.' : 'All approved nodes worksheeted.',
      'Generate the meaningful deviations for the node and record the team\'s findings.',
      'hazop'
    )
  );

  const noIntent = nodes.filter((n) => !n.designIntent || String(n.designIntent).trim().length < 10);
  checks.push(
    check(
      'designIntent',
      'Every node has a design intent',
      'BLOCKING',
      noIntent.length === 0,
      noIntent.length ? 'Missing design intent on node(s): ' + noIntent.map((n) => n.nodeNumber || n.id).join(', ') + '.' : 'Design intent recorded on every node.',
      'Without a design intent a deviation has nothing to deviate from.',
      'nodes'
    )
  );

  // Guideword coverage
  const coverageGaps = [];
  for (const n of nodes) {
    if (n.reviewStatus === 'PROPOSED') continue;
    const cov = deviationCoverage(n, { equipment: c.equipment, chemicals: chems, chemProperties: c.chemProperties }, scenarios.filter((s) => s.nodeId === n.id));
    if (cov.total > 0 && cov.percent < 100) coverageGaps.push({ node: n, cov });
  }
  checks.push(
    check(
      'guidewordCoverage',
      'Meaningful guideword / parameter combinations addressed',
      'ADVISORY',
      coverageGaps.length === 0,
      coverageGaps.length ? coverageGaps.map((g) => 'Node ' + (g.node.nodeNumber || g.node.id) + ': ' + g.cov.percent + '% (' + g.cov.uncovered.length + ' not addressed)').join('; ') : 'All meaningful combinations addressed.',
      'Open the node and either record a row or mark the deviation "no meaningful deviation" with a reason.',
      'hazop'
    )
  );

  // Cause family coverage
  const familyGaps = [];
  for (const n of nodes) {
    if (n.reviewStatus === 'PROPOSED') continue;
    const derived = deriveNodeFacts(n, { equipment: c.equipment, chemicals: chems, chemProperties: c.chemProperties });
    const fam = causeFamilyCoverage(derived.facts, scenarios.filter((s) => s.nodeId === n.id));
    if (fam.missing.length) familyGaps.push({ node: n, fam });
  }
  checks.push(
    check(
      'causeFamilies',
      'Every expected cause family considered per node',
      'ADVISORY',
      familyGaps.length === 0,
      familyGaps.length ? familyGaps.map((g) => 'Node ' + (g.node.nodeNumber || g.node.id) + ': ' + g.fam.labels.join(', ')).join('; ') : 'All expected cause families considered.',
      'Consider the listed families, or record why they are not credible for the node.',
      'hazop'
    )
  );

  // --- scenario content -----------------------------------------------------
  const noCause = scenarios.filter((s) => !(s.causes || []).length && !s.noMeaningfulDeviation);
  const noCons = scenarios.filter((s) => !(s.consequences || []).length && !s.noMeaningfulDeviation);
  checks.push(
    check('scenarioCauses', 'Every row has at least one cause', 'BLOCKING', noCause.length === 0, noCause.length ? noCause.length + ' row(s) without a cause.' : 'All rows have causes.', 'Add the cause, or mark the row as no meaningful deviation.', 'hazop')
  );
  checks.push(
    check('scenarioConsequences', 'Every row has at least one consequence', 'BLOCKING', noCons.length === 0, noCons.length ? noCons.length + ' row(s) without a consequence.' : 'All rows have consequences.', 'Record the unmitigated consequence before crediting safeguards.', 'hazop')
  );

  const noRisk = scenarios.filter((s) => {
    if (s.noMeaningfulDeviation) return false;
    const r = riskFromLS(matrix, s.initialLikelihood, s.initialSeverity);
    return !r.ok;
  });
  checks.push(
    check('initialRisk', 'Initial risk calculated on every row', 'BLOCKING', noRisk.length === 0, noRisk.length ? noRisk.length + ' row(s) without a complete initial rating.' : 'Initial risk rated on all rows.', 'Rate both likelihood and severity. The engine does not default a missing rating.', 'hazop')
  );

  const staleRisk = scenarios.filter((s) => s.initialRisk && s.initialRisk.matrixVersion !== undefined && (s.initialRisk.matrixId !== matrix.id || s.initialRisk.matrixVersion !== matrix.version));
  checks.push(
    check(
      'riskMatrixCurrent',
      'Stored risk scores match the current matrix version',
      'BLOCKING',
      staleRisk.length === 0,
      staleRisk.length ? staleRisk.length + ' row(s) were rated against a different matrix version.' : 'All ratings are on the current matrix.',
      'Recompute the ratings against the current matrix; a score is never reinterpreted silently.',
      'risk'
    )
  );

  // High-risk rows need an action or a recorded acceptance
  const highBands = bandsAtOrAbove(matrix, 'SUBSTANTIAL').length ? bandsAtOrAbove(matrix, 'SUBSTANTIAL') : [];
  const unactioned = scenarios.filter((s) => {
    if (s.noMeaningfulDeviation) return false;
    const r = riskFromLS(matrix, s.initialLikelihood, s.initialSeverity);
    if (!r.ok) return false;
    if (highBands.indexOf(r.bandKey) === -1) return false;
    const hasRec = recs.some((x) => x.scenarioId === s.id) || (s.recommendationIds || []).length > 0;
    return !hasRec && !(s.acceptanceRationale && String(s.acceptanceRationale).trim().length > 20);
  });
  checks.push(
    check(
      'highRiskActioned',
      'Every high-risk row has an action or a recorded acceptance rationale',
      'BLOCKING',
      unactioned.length === 0,
      unactioned.length ? unactioned.length + ' high-risk row(s) with neither a recommendation nor an acceptance rationale.' : 'All high-risk rows actioned.',
      'Add a recommendation, or record why the team accepts the risk as rated.',
      'hazop'
    )
  );

  // Residual basis
  const badResidual = [];
  for (const s of scenarios) {
    const v = validateResidual({
      matrix,
      initial: { likelihood: s.initialLikelihood, severity: s.initialSeverity },
      residual: { likelihood: s.residualLikelihood, severity: s.residualSeverity },
      basis: s.residualRiskBasis,
    });
    if (!v.ok) badResidual.push({ s, v });
  }
  checks.push(
    check(
      'residualBasis',
      'Every residual risk reduction has a valid technical basis',
      'BLOCKING',
      badResidual.length === 0,
      badResidual.length ? badResidual.slice(0, 3).map((x) => 'Row ' + (x.s.rowNumber || x.s.id) + ': ' + x.v.reason).join('; ') + (badResidual.length > 3 ? ' (+' + (badResidual.length - 3) + ' more)' : '') : 'All residual ratings justified.',
      'A recommendation existing is not a basis. State the control and why it changes the rating.',
      'hazop'
    )
  );

  const creditedConsequence = scenarios.filter((s) => (s.consequences || []).some((x) => x.safeguardCreditFlag));
  checks.push(
    check(
      'consequenceOrder',
      'Consequences recorded before safeguard credit',
      'ADVISORY',
      creditedConsequence.length === 0,
      creditedConsequence.length ? creditedConsequence.length + ' row(s) have a consequence phrased as already prevented.' : 'Consequences are stated unmitigated.',
      'Move the safeguard to the safeguards column and state the unmitigated consequence.',
      'hazop'
    )
  );

  // --- recommendations ------------------------------------------------------
  const unnumbered = recs.filter((x) => !x.recId);
  checks.push(check('recsNumbered', 'Recommendations numbered', 'BLOCKING', unnumbered.length === 0, unnumbered.length ? unnumbered.length + ' recommendation(s) without an ID.' : recs.length + ' recommendation(s) numbered.', 'Numbering is assigned on save; re-save the affected rows.', 'recommendations'));

  const noOwner = recs.filter((x) => !x.responsibleDepartment);
  checks.push(check('recsOwned', 'Recommendations have an owner', 'BLOCKING', noOwner.length === 0, noOwner.length ? noOwner.length + ' recommendation(s) without a responsible department.' : 'All recommendations owned.', 'Assign a responsible department and, where known, a person.', 'recommendations'));

  const noDate = recs.filter((x) => !x.targetDate);
  checks.push(check('recsDated', 'Recommendations have a target date', 'ADVISORY', noDate.length === 0, noDate.length ? noDate.length + ' recommendation(s) without a target date.' : 'All recommendations dated.', 'Set a target date so the action register can be tracked.', 'recommendations'));

  const vague = recs.map((x) => ({ x, q: assessRecommendationQuality(x) })).filter((r) => r.q.issues.some((i) => i.code === 'VAGUE_ACTION' || i.code === 'PPE_AS_PRIMARY'));
  checks.push(
    check(
      'recsSpecific',
      'Recommendations are specific actions',
      'ADVISORY',
      vague.length === 0,
      vague.length ? vague.slice(0, 3).map((r) => (r.x.recId || r.x.id) + ': ' + r.q.issues[0].detail).join('; ') : 'No vague recommendations.',
      'Replace "take care" / "use PPE" style actions with a specific measure, engineering control first.',
      'recommendations'
    )
  );

  // --- team -----------------------------------------------------------------
  const team = c.team || [];
  checks.push(check('teamRecorded', 'HAZOP team members recorded with roles', 'BLOCKING', team.length >= 3 && team.every((m) => m.role), team.length + ' member(s) recorded.', 'A HAZOP is a multidisciplinary team process; record who took part and in what role.', 'team'));
  const hasFacilitator = team.some((m) => m.role === 'facilitator' || m.role === 'chairman');
  checks.push(check('teamFacilitator', 'A chairman or facilitator is recorded', 'BLOCKING', hasFacilitator, hasFacilitator ? 'Facilitator recorded.' : 'No chairman or facilitator in the team list.', 'Record who facilitated the sessions.', 'team'));

  // --- compliance -----------------------------------------------------------
  const overdueReview = compliance.filter((x) => x.complianceStatus === 'UNDER_REVIEW' && x.dueDate && expiryStatus({ expiryDate: x.dueDate, today: c.today }).status === 'EXPIRED');
  checks.push(
    check('complianceReview', 'No compliance record left under review past its due date', 'BLOCKING', overdueReview.length === 0, overdueReview.length ? overdueReview.length + ' record(s) under review past due.' : 'No overdue compliance reviews.', 'Resolve the applicability question or extend the due date with a reason.', 'legal')
  );

  const expiredPermits = (c.permits || []).map((x) => ({ x, e: expiryStatus({ expiryDate: x.expiryDate, renewalDate: x.renewalDate, today: c.today, revoked: x.revoked }) })).filter((r) => r.e.status === 'EXPIRED');
  checks.push(
    check(
      'permitsCurrent',
      'No expired permit, licence or consent',
      'BLOCKING',
      expiredPermits.length === 0,
      expiredPermits.length ? 'Expired: ' + expiredPermits.map((r) => (r.x.type || 'permit') + ' ' + (r.x.number || '')).join(', ') + '.' : 'All recorded permits current.',
      'Upload the renewal, or record the status so the report states it accurately. An expired permit forces its compliance record to EXPIRED.',
      'legal'
    )
  );

  const noticePermits = (c.permits || []).map((x) => ({ x, e: expiryStatus({ expiryDate: x.expiryDate, renewalDate: x.renewalDate, today: c.today }) })).filter((r) => r.e.status === 'EXPIRING_SOON' || r.e.status === 'RENEWAL_DUE');
  checks.push(
    check('permitsNotice', 'Permits inside the notice window acknowledged', 'ADVISORY', noticePermits.every((r) => r.x.renewalAcknowledged), noticePermits.length ? noticePermits.length + ' permit(s) inside the notice window.' : 'No permits in the notice window.', 'Acknowledge the renewal so it appears in the action register.', 'legal')
  );

  // --- registers ------------------------------------------------------------
  checks.push(check('sourceRegister', 'Source register non-empty', 'BLOCKING', (c.sources || []).length > 0, (c.sources || []).length + ' source(s) registered.', 'Every value the study relies on needs a citation.', 'sources'));
  checks.push(check('assumptions', 'Assumptions register populated', 'ADVISORY', (c.assumptions || []).length > 0, (c.assumptions || []).length + ' assumption(s) recorded.', 'Record the study exclusions and assumptions; they are printed in the report.', 'reports'));
  checks.push(
    check(
      'missingDataRegister',
      'Missing-data register generated',
      'ADVISORY',
      true,
      (c.dataGaps || []).length + ' data gap(s) will be printed in the missing-data register.',
      null,
      'reports'
    )
  );

  const criticalConflicts = (c.conflicts || []).filter((x) => x.critical && x.status !== 'RESOLVED');
  checks.push(
    check(
      'noCriticalConflicts',
      'No unresolved conflict on a critical field',
      'BLOCKING',
      criticalConflicts.length === 0,
      criticalConflicts.length ? criticalConflicts.length + ' critical conflict(s) unresolved: ' + criticalConflicts.slice(0, 3).map((x) => x.field).join(', ') + '.' : 'No critical conflicts outstanding.',
      'Resolve each conflict, or record the conflict and the value the study used as an assumption.',
      'data-review'
    )
  );

  const blocking = checks.filter((k) => k.severity === 'BLOCKING');
  const advisory = checks.filter((k) => k.severity === 'ADVISORY');
  const blockingFailed = blocking.filter((k) => !k.pass);
  const advisoryFailed = advisory.filter((k) => !k.pass);

  return {
    engine: QUALITY_GATE_VERSION,
    status: blockingFailed.length === 0 ? (advisoryFailed.length === 0 ? 'READY' : 'READY_WITH_ADVISORIES') : 'BLOCKED',
    checks,
    blocking,
    advisory,
    summary: {
      blockingTotal: blocking.length,
      blockingPassed: blocking.length - blockingFailed.length,
      advisoryTotal: advisory.length,
      advisoryPassed: advisory.length - advisoryFailed.length,
      blockingFailedIds: blockingFailed.map((k) => k.id),
    },
    caution: CAUTION_TEXT,
    note: 'A DRAFT export is always permitted. REVIEWED and APPROVED require every blocking check to pass and an authorized human action — this gate does not approve anything.',
  };
}

function canSetReportStatus(req) {
  const r = req || {};
  if (r.to === 'DRAFT') return { ok: true, reason: 'DRAFT_ALWAYS_ALLOWED' };
  if (r.actorKind === 'ai') return { ok: false, reason: 'AI_CANNOT_APPROVE_REPORT' };
  if (['admin', 'facilitator', 'reviewer'].indexOf(r.actorRole) === -1) return { ok: false, reason: 'ROLE_NOT_AUTHORIZED' };

}

// app/util.js — DOM helpers, formatting, ids.
// Every value that comes from the store or from the model is rendered with
// textContent. There is no innerHTML path for data anywhere in the app.

function h(tag, attrs) {
  const el = document.createElement(tag);
  const a = attrs || {};
  for (const k of Object.keys(a)) {
    const v = a[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = String(v);
    else if (k === 'dataset') for (const dk of Object.keys(v)) el.dataset[dk] = v[dk];
    else if (k === 'style') for (const sk of Object.keys(v)) el.style.setProperty(sk, v[sk]);
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'hidden' || k === 'multiple' || k === 'readOnly') el[k] = !!v;
    else el.setAttribute(k, String(v));
  }
  const kids = Array.prototype.slice.call(arguments, 2);
  add(el, kids);
  return el;
}

function add(el, kids) {
  for (const k of kids) {
    if (k === null || k === undefined || k === false || k === '') continue;
    if (Array.isArray(k)) add(el, k);
    else if (typeof k === 'string' || typeof k === 'number') el.appendChild(document.createTextNode(String(k)));
    else el.appendChild(k);
  }
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

function frag() {
  const f = document.createDocumentFragment();
  add(f, Array.prototype.slice.call(arguments));
  return f;
}

function qs(sel, root) {
  return (root || document).querySelector(sel);
}

let counter = 0;
function uid(prefix) {
  counter += 1;
  const rnd = Math.random().toString(36).slice(2, 8);
  // Path-segment safe: letters, digits and dashes only.
  return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + counter.toString(36) + rnd;
}

function nowIso() {
  return new Date().toISOString();
}

function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

// -------------------------------------------------------------- format

function num(v, dp) {
  if (v === null || v === undefined || v === '' || !Number.isFinite(Number(v))) return '—';
  const d = dp === undefined ? 2 : dp;
  return Number(Number(v).toFixed(d)).toLocaleString('en-IN');
}

function pct(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return '—';
  return Math.round(Number(v)) + '%';
}

function dateFmt(v) {
  if (!v) return '—';
  const s = String(v).slice(0, 10);
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return s;
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return m[3] + ' ' + months[Number(m[2]) - 1] + ' ' + m[1];
}

function dtFmt(v) {
  if (!v) return '—';
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return String(v);
  return dateFmt(d.toISOString()) + ' ' + d.toISOString().slice(11, 16) + ' UTC';
}

function titleCase(s) {
  return String(s || '')
    .replace(/_/g, ' ')
    .toLowerCase()
    .replace(/\b[a-z]/g, (c) => c.toUpperCase());
}

function sentenceCase(s) {
  const t = String(s || '').replace(/_/g, ' ').toLowerCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function truncate(s, n) {
  const t = String(s || '');
  return t.length > n ? t.slice(0, n - 1) + '…' : t;
}

function listText(arr, key) {
  return (arr || []).map((x) => (key ? x[key] : x)).filter(Boolean).join(', ');
}

let openDrawer = null;

function drawer(title, bodyNode, footNodes) {
  closeDrawer();
  const scrim = h('div', { class: 'drawer-scrim', onclick: closeDrawer });
  const panel = h(
    'aside',
    { class: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'drawer-head' }, h('h2', { text: title }), h('button', { class: 'btn ghost icon', onclick: closeDrawer, 'aria-label': 'Close', text: '✕' })),
    h('div', { class: 'drawer-body' }, bodyNode),
    footNodes ? h('div', { class: 'drawer-foot' }, footNodes) : null
  );
  document.body.appendChild(scrim);
  document.body.appendChild(panel);
  openDrawer = [scrim, panel];
  const onKey = (e) => {
    if (e.key === 'Escape') closeDrawer();
  };
  document.addEventListener('keydown', onKey);
  openDrawer.onKey = onKey;
  const focusable = panel.querySelector('input, select, textarea, button.primary, button');
  if (focusable) focusable.focus();
  return panel;
}

function closeDrawer() {
  if (!openDrawer) return;
  document.removeEventListener('keydown', openDrawer.onKey);
  for (const n of openDrawer) n.remove();
  openDrawer = null;
}

}

/** Download without relying on a page-initiated download (sandbox blocks those). */
const DOWNLOAD_ERRORS = {
  declined: null, // the viewer said no; that is not an error
  rate_limited: 'A save prompt is already open. Finish that one, then try again.',
  too_large: 'That file is too large for the destination you chose. Export a single node or a single register instead of the whole project.',
  rejected_extension: 'This view will not accept that file type.',
  extension_not_enabled: 'That format is not available in this view. Use Print on the report preview for a PDF.',
  unavailable: 'Saving files is not available in this view. Use Print on the report preview for a PDF.',
  not_granted: 'Saving files is not allowed for this page. Use Print on the report preview for a PDF.',
};

async function offerDownload(filename, data, mime) {
  const caps = window.__HAZOP_CAPS || {};
  if (!caps.downloads) {
    toast('Saving files is not available in this view. Use Print on the report preview for a PDF, or open the page in the Claude desktop app.', 'err');
    return false;
  }
  try {
    const out = await caps.downloads.save({ filename, data });
    if (out && out.status === 'delivered') toast(filename + ' delivered', 'ok');
    else toast('Saved ' + filename, 'ok');
    return true;
  } catch (e) {
    const code = (e && e.code) || '';
    if (code === 'declined' || code === 'cancelled') return false;
    const copy = Object.prototype.hasOwnProperty.call(DOWNLOAD_ERRORS, code) ? DOWNLOAD_ERRORS[code] : 'Could not save ' + filename + ': ' + ((e && e.message) || 'unknown error');
    if (copy) toast(copy, 'err');
    return false;
  }
}

function debounce(fn, ms) {
  let t = null;
  return function () {
    const args = arguments;
    if (t) clearTimeout(t);
    t = setTimeout(() => fn.apply(null, args), ms || 300);
  };
}

function groupBy(arr, keyFn) {
  const m = new Map();
  for (const x of arr || []) {
    const k = keyFn(x);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(x);
  }
  return m;
}

function sortBy(arr, keyFn, desc) {
  return (arr || []).slice().sort((a, b) => {
    const ka = keyFn(a);
    const kb = keyFn(b);
    if (ka === kb) return 0;
    const r = ka > kb ? 1 : -1;
    return desc ? -r : r;
  });
}

class MemoryBackend {
  constructor() {
    this.kind = 'memory';
    this.data = new Map();
    this.listeners = new Map();
  }

  _col(name) {
    if (!this.data.has(name)) this.data.set(name, new Map());
    return this.data.get(name);
  }

  async list(name) {
    return Array.from(this._col(name).values());
  }

  async get(name, id) {
    return this._col(name).get(id) || null;
  }

  async put(name, id, rec) {
    this._col(name).set(id, rec);
    this._emit(name);
  }

  async patch(name, id, partial) {
    const cur = this._col(name).get(id) || {};
    this._col(name).set(id, Object.assign({}, cur, partial));
    this._emit(name);
  }

  async remove(name, id) {
    this._col(name).delete(id);
    this._emit(name);
  }

  subscribe(name, handler) {
    if (!this.listeners.has(name)) this.listeners.set(name, new Set());
    this.listeners.get(name).add(handler);
    this.list(name).then(handler);
    return () => this.listeners.get(name).delete(handler);
  }

  _emit(name) {
    const set = this.listeners.get(name);
    if (!set) return;
    const rows = Array.from(this._col(name).values());
    for (const fn of set) fn(rows);
  }
}

class ArtifactDbBackend {
  constructor(db) {
    this.kind = 'db';
    this.db = db;
    this.cache = new Map();
    this.unsubs = new Map();
  }

  async list(name) {
    if (this.cache.has(name)) return Array.from(this.cache.get(name).values());
    const snap = await this.db.collection(name).get();
    const m = new Map();
    for (const d of snap.docs) m.set(d.id, Object.assign({ id: d.id }, d.data()));
    this.cache.set(name, m);
    return Array.from(m.values());
  }

  async get(name, id) {
    const snap = await this.db.doc(name + '/' + id).get();
    if (!snap.exists) return null;
    return Object.assign({ id }, snap.data());
  }

  async put(name, id, rec) {
    const body = Object.assign({}, rec);
    delete body.id;
    await this.db.doc(name + '/' + id).set(body);
    if (this.cache.has(name)) this.cache.get(name).set(id, Object.assign({ id }, body));
  }

  async patch(name, id, partial) {
    const body = Object.assign({}, partial);
    delete body.id;
    try {
      await this.db.doc(name + '/' + id).update(body);
    } catch (e) {
      // update() requires the document to exist; fall back to a full write.
      if (e && e.code === 'invalid_argument') {
        const cur = (await this.get(name, id)) || {};
        await this.put(name, id, Object.assign({}, cur, body));
        return;
      }
      throw e;
    }
    if (this.cache.has(name)) {
      const cur = this.cache.get(name).get(id) || { id };
      this.cache.get(name).set(id, Object.assign({}, cur, body));
    }
  }

  async remove(name, id) {
    await this.db.doc(name + '/' + id).delete();
    if (this.cache.has(name)) this.cache.get(name).delete(id);
  }

  // One subscription per collection, kept for the life of the page.
  subscribe(name, handler) {
    if (!this.unsubs.has(name)) {
      const handlers = new Set();
      const unsub = this.db.collection(name).onSnapshot(
        (snap) => {
          const m = new Map();
          for (const d of snap.docs) m.set(d.id, Object.assign({ id: d.id }, d.data()));
          this.cache.set(name, m);
          const rows = Array.from(m.values());
          for (const fn of handlers) fn(rows);
        },
        (err) => {
          // A terminal subscription error leaves the cache in place; the app
          // keeps working read-only from what it already has.
          if (window.__HAZOP_ON_DB_ERROR) window.__HAZOP_ON_DB_ERROR(name, err);
        }
      );
      this.unsubs.set(name, { unsub, handlers });
    }
    const entry = this.unsubs.get(name);
    entry.handlers.add(handler);
    if (this.cache.has(name)) handler(Array.from(this.cache.get(name).values()));
    return () => entry.handlers.delete(handler);
  }
}

/**
 * The store: a thin record-lifecycle layer over a backend.
 * Handles ids, timestamps, revisions and the audit trail so no view has to.
 */
class Store {
  constructor(backend, opts) {
    this.backend = backend;
    this.actor = (opts && opts.actor) || { id: 'local', name: 'Local user', role: 'admin' };
    this.readOnly = !!(opts && opts.readOnly);
    this.onAudit = (opts && opts.onAudit) || null;
  }

  get kind() {
    return this.backend.kind;
  }

  setActor(actor) {
    this.actor = actor;
  }

  list(name) {
    return this.backend.list(name);
  }

  get(name, id) {
    return this.backend.get(name, id);
  }

  subscribe(name, handler) {
    return this.backend.subscribe(name, handler);
  }

  async create(name, rec, meta) {
    this._assertWritable();
    const id = rec.id || uid(name.slice(0, 4));
    const full = Object.assign({}, rec, {
      id,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      rev: 1,
      createdBy: this.actor.id,
    });
    await this.backend.put(name, id, full);
    await this._audit('CREATE', name, id, null, full, meta);
    return full;
  }

  async update(name, id, partial, meta) {
    this._assertWritable();
    const before = await this.backend.get(name, id);
    const patch = Object.assign({}, partial, {
      updatedAt: nowIso(),
      rev: ((before && before.rev) || 1) + 1,
      updatedBy: this.actor.id,
    });
    await this.backend.patch(name, id, patch);
    await this._audit('UPDATE', name, id, before, Object.assign({}, before, patch), meta);
    return Object.assign({}, before, patch);
  }

  async replace(name, id, rec, meta) {
    this._assertWritable();
    const before = await this.backend.get(name, id);
    const full = Object.assign({}, rec, {
      id,
      createdAt: (before && before.createdAt) || nowIso(),
      updatedAt: nowIso(),
      rev: ((before && before.rev) || 1) + 1,
      updatedBy: this.actor.id,
    });
    await this.backend.put(name, id, full);
    await this._audit('REPLACE', name, id, before, full, meta);
    return full;
  }

  async remove(name, id, meta) {
    this._assertWritable();
    const before = await this.backend.get(name, id);
    await this.backend.remove(name, id);
    await this._audit('DELETE', name, id, before, null, meta);
  }

  _assertWritable() {
    if (this.readOnly) {
      const e = new Error('This view is read-only.');
      e.code = 'read_only';
      throw e;
    }
  }

  // Audit entries are bucketed one document per project per day so the store's
  // document budget is not consumed by the log.
  async _audit(action, entityKind, entityId, before, after, meta) {
    const m = meta || {};
    const projectId = m.projectId || (after && after.projectId) || (before && before.projectId) || 'global';
    if (entityKind === 'audit' || entityKind === 'ai_runs') return;
    const day = new Date().toISOString().slice(0, 10);
    const bucketId = projectId + '_' + day;
    const entry = {
      at: nowIso(),
      actor: this.actor.name || this.actor.id,
      actorId: this.actor.id,
      actorKind: m.actorKind || 'human',
      action,
      entity: entityKind,
      entityId,
      field: m.field || null,
      before: slim(before, m.field),
      after: slim(after, m.field),
      aiRunId: m.aiRunId || null,
      note: m.note || null,
      sourceRefs: m.sourceRefs || [],
    };
    try {
      const cur = await this.backend.get('audit', bucketId);
      if (cur) {
        const entries = (cur.entries || []).concat([entry]);
        // One bucket stays well inside the 256 KiB document cap.
        const trimmed = entries.length > 400 ? entries.slice(entries.length - 400) : entries;
        await this.backend.patch('audit', bucketId, { entries: trimmed, count: (cur.count || 0) + 1, updatedAt: nowIso() });
      } else {
        await this.backend.put('audit', bucketId, { id: bucketId, projectId, day, entries: [entry], count: 1, createdAt: nowIso(), updatedAt: nowIso() });
      }
    } catch (e) {
      // The audit write must never break the user's edit; surface it instead.
      if (window.__HAZOP_ON_DB_ERROR) window.__HAZOP_ON_DB_ERROR('audit', e);
    }
    if (this.onAudit) this.onAudit(entry);
  }
}

// Keep audit payloads small and readable: for a field edit, record just that
// field; otherwise record a short summary of the record.
function slim(rec, field) {
  if (!rec) return null;
  if (field) {
    const out = {};
    out[field] = rec[field];
    return out;
  }
  const keep = ['id', 'name', 'title', 'tag', 'nodeNumber', 'recId', 'canonicalName', 'projectName', 'status', 'reviewStatus', 'applicabilityStatus', 'complianceStatus', 'deviation', 'text', 'value', 'field'];
  const out = {};
  for (const k of keep) if (rec[k] !== undefined) out[k] = typeof rec[k] === 'string' ? rec[k].slice(0, 200) : rec[k];
  return out;
}

/** Resolve the best available backend for this view. */
async function openStore(onStatus) {
  const caps = window.__HAZOP_CAPS || {};
  if (caps.db) {
    onStatus && onStatus({ kind: 'db', message: 'Connected to the shared project store.' });
    return new Store(new ArtifactDbBackend(caps.db), { readOnly: caps.readOnly });
  }
  onStatus &&
    onStatus({
      kind: 'memory',
      message: 'Working in this browser tab only — nothing is saved. Open the published page while signed in to use the shared project store.',
    });
  return new Store(new MemoryBackend(), {});
}

// app/state.js — application state, selectors and derived values.
// Derived values are pure functions of stored data, recomputed on render, so
// they cannot drift from what the store holds.













const S = {
  store: null,
  ready: false,
  storeKind: 'memory',
  storeMessage: '',
  readOnly: false,
  actor: { id: 'local', name: 'You', role: 'admin', level: 'owner' },
  view: 'dashboard',
  projectId: null,
  chatOpen: false,
  chat: [],
  chatBusy: false,
  nodeTab: 'worksheet',

};

for (const c of COLLECTIONS) S.data[c] = [];

let renderFn = null;
function setRenderer(fn) {
  renderFn = fn;
}

let renderQueued = false;
let renderSuspended = 0;
let renderMissed = false;

/**
 * Suspend painting during a bulk write. A seed or an import performs hundreds
 * of writes; repainting between each one is pure waste and, on the shared
 * store, makes the operation feel broken. Nested calls are counted, and one
 * paint runs when the last one releases.
 */
function suspendRender(on) {
  if (on) {
    renderSuspended += 1;
    return;
  }
  renderSuspended = Math.max(0, renderSuspended - 1);
  if (renderSuspended === 0 && renderMissed) {
    renderMissed = false;
    render();
  }
}

function render() {
  if (renderSuspended > 0) {
    renderMissed = true;
    return;
  }
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    S.derivedCache = {};
    if (renderFn) renderFn();
  });
}

async function attachStore(store, info) {
  S.store = store;
  S.storeKind = info.kind;
  S.storeMessage = info.message;
  S.readOnly = !!store.readOnly;
  for (const c of COLLECTIONS) {
    store.subscribe(c, (rows) => {
      S.data[c] = rows;
      render();
    });
  }
  S.ready = true;
}

function rows(collection) {

}

function scoped(collection) {
  const pid = S.projectId;

function thresholdSets() {

function memo(key, fn) {
  if (!Object.prototype.hasOwnProperty.call(S.derivedCache, key)) S.derivedCache[key] = fn();
  return S.derivedCache[key];
}

/** Chemicals with identity resolution and property lookups attached. */
function chemicalsResolved() {
  return memo('chemicalsResolved', () => {
    const list = scoped('chemicals');
    return list.map((c) => {
      const res = resolveChemical({ name: c.canonicalName, cas: c.cas, synonyms: c.synonyms }, list.filter((x) => x.id !== c.id));
      const density = propsFor(c.id).filter((p) => p.key === 'density')[0];
      return Object.assign({}, c, {
        identityResolution: c.cas || c.canonicalName ? { matchKind: c.identityStatus === 'USER_CONFIRMED' ? 'EXACT_NAME' : res.matchKind, casValid: c.casValid !== undefined ? c.casValid : res.casValid } : { matchKind: 'UNRESOLVED' },
        density: density ? Number(density.value) : undefined,
        densityUnit: density ? density.unit || 'kg/L' : undefined,
        densityStatus: density ? density.status : undefined,
      });
    });
  });
}

function completeness() {
  return memo('completeness', () => {
    const p = project();
    if (!p) return { data: { percent: 0, missing: [] }, critical: { percent: 0, missing: [], checks: [], byGroup: [] } };
    return {
      data: dataCompleteness(p),
      critical: criticalCompleteness({
        project: p,
        chemicals: chemicalsResolved(),
        chemProperties: scoped('chem_properties'),
        equipment: scoped('equipment'),
        nodes: scoped('nodes'),
        matrix: matrix(),
      }),
    };
  });
}

function applicability() {
  return memo('applicability', () => {

      project: p,

    });
  });
}

/**
 * Merge the engine's live evaluation with any stored human decision.
 * A human decision wins on the status; the engine's reasoning is kept
 * alongside it so the register can show both.
 */
function complianceRegister() {
  return memo('complianceRegister', () => {
    const run = applicability();
    if (!run) return [];
    const stored = scoped('compliance');
    const byObligation = new Map();
    for (const s of stored) byObligation.set(s.obligationId, s);

    const out = run.records.map((rec) => {
      const s = byObligation.get(rec.obligationId);
      const permit = s && s.permitId ? scoped('permits').filter((x) => x.id === s.permitId)[0] : null;
      const evidence = scoped('compliance_evidence').filter((e) => e.obligationId === rec.obligationId);
      const merged = Object.assign({}, rec, {
        storedId: s ? s.id : null,
        humanStatus: s ? s.applicabilityStatus : null,
        humanReason: s ? s.humanReason : null,
        reviewedBy: s ? s.reviewedBy : null,
        reviewedAt: s ? s.reviewedAt : null,
        owner: s ? s.owner : null,
        dueDate: s ? s.dueDate : null,
        permitId: s ? s.permitId : null,
        permit,
        evidence,
        complianceStatus: s ? s.complianceStatus : null,
        gapDescription: s ? s.gapDescription : null,
      });
      merged.effectiveStatus = merged.humanStatus || merged.applicabilityStatus;
      return merged;
    });
    return out;
  });
}

function complianceCounts() {
  return memo('complianceCounts', () => {
    const reg = complianceRegister();
    const c = { APPLICABLE_CONFIRMED: 0, POTENTIALLY_APPLICABLE: 0, NOT_APPLICABLE_CONFIRMED: 0, NOT_ENOUGH_DATA: 0, REQUIRES_LEGAL_REVIEW: 0 };
    for (const r of reg) if (Object.prototype.hasOwnProperty.call(c, r.effectiveStatus)) c[r.effectiveStatus] += 1;
    const evidenceGaps = reg.filter((r) => (r.effectiveStatus === 'APPLICABLE_CONFIRMED' || r.effectiveStatus === 'POTENTIALLY_APPLICABLE') && (!r.evidence || r.evidence.length === 0)).length;
    return Object.assign(c, { evidenceGaps, total: reg.length });
  });
}

function alerts() {

function permitStatuses() {
