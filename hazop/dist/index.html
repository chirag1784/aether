/** The node-wise recommendation register, deduplicated with backlinks kept. */
function recommendationRegister() {
  return memo('recommendationRegister', () => {
    const recs = scoped('recommendations');
    const withContext = recs.map((r) => {
      const sc = r.scenarioId ? scoped('scenarios').filter((s) => s.id === r.scenarioId)[0] : null;
      const node = r.nodeId ? nodeById(r.nodeId) : sc ? nodeById(sc.nodeId) : null;
      return Object.assign({}, r, {
        scenario: sc,
        node,
        nodeNumber: node ? node.nodeNumber : null,
        equipmentTags: r.equipmentTags && r.equipmentTags.length ? r.equipmentTags : node ? (node.equipmentIds || []).map((id) => (equipById(id) || {}).tag).filter(Boolean) : [],
      });
    });
    const out = deduplicateRecommendations(withContext);
    const byNode = new Map();
    for (const r of out.kept) {
      const key = r.nodeNumber || 'Unassigned';
      if (!byNode.has(key)) byNode.set(key, []);
      byNode.get(key).push(r);
    }
    return { kept: out.kept, merges: out.merges, byNode, all: withContext };
  });
}

/** Scenarios with their risk results computed against the current matrix. */
function scenariosWithRisk() {

    const m = matrix();
    return scoped('scenarios').map((s) => {
      let initial = null;
      let residual = null;
      try {
        initial = riskFromLS(m, s.initialLikelihood, s.initialSeverity);
      } catch (e) {
        initial = { ok: false, reason: 'OFF_SCALE', bandKey: null };

      } catch (e) {

function dataGapsAll() {

/** Per-node legal links: stored links plus links the engine derives now. */
function legalLinksForNode(nodeId) {
  const reg = complianceRegister();
  const nodes = scoped('nodes');
  const stored = scoped('legal_node_links').filter((l) => l.nodeId === nodeId);
  const out = [];
  for (const rec of reg) {
    if (rec.effectiveStatus === 'NOT_APPLICABLE_CONFIRMED') continue;
    const links = linkObligationToNodes({
      record: rec,
      nodes,
      chemicals: chemicalsResolved(),
      equipment: scoped('equipment'),
      permitConditions: scoped('permit_conditions').map((c) => Object.assign({}, c, { permitLabel: (scoped('permits').filter((p) => p.id === c.permitId)[0] || {}).label })),
    });
    for (const l of links) {
      if (l.nodeId !== nodeId) continue;
      out.push({ record: rec, link: l, manual: false });
    }
  }
  for (const s of stored) {
    const rec = reg.filter((r) => r.obligationId === s.obligationId)[0];
    if (!rec) continue;
    if (out.some((o) => o.record.obligationId === s.obligationId)) continue;
    out.push({ record: rec, link: { nodeId, reason: 'MANUAL_LINK', detail: s.note || 'Linked manually.' }, manual: true, storedId: s.id });
  }
  return out;
}

function go(view, params) {
  S.view = view;

  try {
    const q = new URLSearchParams();
    q.set('v', view);
    if (S.projectId) q.set('p', S.projectId);
    if (S.selection.nodeId && (view === 'hazop' || view === 'nodes')) q.set('n', S.selection.nodeId);
    history.replaceState(null, '', '?' + q.toString());
  } catch (e) {
    /* history is unavailable in some embeddings; navigation still works */
  }
  const main = document.getElementById('main');
  if (main) main.scrollTop = 0;
  render();
}

function setProject(id) {
  S.projectId = id;
  S.selection = {};
  try {
    localStorage.setItem('hazop.project', id || '');
  } catch (e) {
    /* storage may be blocked; the selection simply is not remembered */
  }
  render();
}

function restoreRoute() {
  let view = null;
  let pid = null;
  try {
    const q = new URLSearchParams(location.search);
    view = q.get('v');
    pid = q.get('p');
    if (q.get('n')) S.selection.nodeId = q.get('n');
  } catch (e) {
    /* ignore */
  }
  if (!pid) {
    try {
      pid = localStorage.getItem('hazop.project');
    } catch (e) {
      /* ignore */
    }
  }
  return { view, projectId: pid };
}

// app/ai.js — the AI layer.
//
// One provider interface. The adapter that runs in the published deployment
// asks Claude on the viewer's own account; the HTTP adapter is the seam for the
// Docker deployment where the server-side Anthropic / OpenAI / Google /
// OpenRouter / local adapters live and where keys never reach the browser.
//
// Nothing in this file computes a risk score, a threshold crossing, a unit
// conversion or an applicability status. Those are the deterministic packages,
// and the AI output is validated against them before it can touch project data.







const AI_LAYER_VERSION = 'ai-1.0.0';
const PROMPT_VERSION = 'p1';
const SCHEMA_VERSION = 's1';

const TIER = { light: 'quick', medium: 'default', strong: 'complex' };

// The output contract every structured task must satisfy (MASTER_STRUCTURE §31).
const CONTRACT_NOTE =
  'Reply with ONLY one JSON object of the shape ' +
  '{"facts_used":[string],"assumptions":[string],"missing_data":[string],"result":<as specified>,"sources":[string],"confidence":0.0,"human_review_required":true}. ' +
  'Rules you must follow: never state a process condition, capacity, design pressure or temperature, ' +
  'interlock, chemical property, SDS value, legal threshold or statutory obligation that is not present in the ' +
  'PROJECT FACTS below — if it is not there, name it in missing_data instead. Never output a risk score, a ' +
  'likelihood or severity rating, a threshold comparison or a compliance conclusion. Never claim a value is verified.';

class SampleAdapter {
  constructor(sample) {
    this.name = 'viewer-claude';
    this.sample = sample;
  }

  get available() {
    return !!this.sample;
  }

  async generateStructured(task) {
    const tier = TIER[task.taskClass] || 'default';
    const started = Date.now();
    const prompt = buildPrompt(task);
    const out = { provider: this.name, modelTierRequested: tier };
    const data = await this.sample.json(prompt, { modelTier: tier, signal: task.signal, cache: false });
    out.runtimeMs = Date.now() - started;
    out.raw = data;
    return out;
  }

  async chat(turns, opts) {
    return this.sample(turns, opts);
  }
}

class HttpAdapter {
  constructor(endpoint) {
    this.name = 'server';
    this.endpoint = endpoint || '/api/ai';
  }

  get available() {
    return false; // enabled in the Docker deployment, where the endpoint exists
  }

  async generateStructured(task) {
    const res = await fetch(this.endpoint, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ task: task.name, taskClass: task.taskClass, promptVersion: PROMPT_VERSION, schemaVersion: SCHEMA_VERSION, context: task.context, instruction: task.instruction, shape: task.shape }),
    });
    if (!res.ok) throw Object.assign(new Error('AI endpoint returned ' + res.status), { code: 'upstream_error' });
    return { provider: this.name, raw: await res.json() };
  }
}

let adapter = null;
function setAdapter(a) {
  adapter = a;
}
function getAdapter() {
  return adapter;
}
function aiAvailable() {
  return !!(adapter && adapter.available);
}

function buildPrompt(task) {
  return [
    'You are assisting a HAZOP facilitator. ' + CONTRACT_NOTE,
    '',
    'TASK: ' + task.instruction,
    '',
    'REQUIRED SHAPE OF "result": ' + task.shape,
    '',
    'PROJECT FACTS (the only facts you may rely on):',
    JSON.stringify(task.context, null, 1).slice(0, 44000),
  ].join('\n');
}

// --------------------------------------------------------------- validation

function validateContract(raw) {
  const errors = [];
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return { ok: false, errors: ['Output is not a JSON object.'] };
  for (const k of ['facts_used', 'assumptions', 'missing_data', 'sources']) {
    if (raw[k] !== undefined && !Array.isArray(raw[k])) errors.push(k + ' must be an array.');
  }
  if (raw.result === undefined) errors.push('result is missing.');
  if (raw.confidence !== undefined && !(Number(raw.confidence) >= 0 && Number(raw.confidence) <= 1)) errors.push('confidence must be between 0 and 1.');
  return { ok: errors.length === 0, errors };
}

/** Run a structured task, log the ai_run, and return the validated result. */
async function runTask(task) {
  if (!aiAvailable()) {
    const e = new Error('AI assistance is not available in this view.');
    e.code = 'not_granted';
    throw e;
  }
  const runId = uid('airun');
  const started = Date.now();
  let record = {
    id: runId,
    projectId: S.projectId,
    task: task.name,
    taskClass: task.taskClass,
    provider: adapter.name,
    modelTierRequested: TIER[task.taskClass] || 'default',
    promptVersion: PROMPT_VERSION,
    schemaVersion: SCHEMA_VERSION,
    sourceIds: task.sourceIds || [],
    requestedBy: S.actor.id,
    createdAt: nowIso(),
    humanReviewRequired: true,
  };

  try {
    const out = await adapter.generateStructured(task);
    const raw = out.raw || {};
    const check = validateContract(raw);
    record = Object.assign(record, {
      runtimeMs: out.runtimeMs || Date.now() - started,
      factsUsed: Array.isArray(raw.facts_used) ? raw.facts_used.slice(0, 40) : [],
      assumptions: Array.isArray(raw.assumptions) ? raw.assumptions.slice(0, 40) : [],
      missingData: Array.isArray(raw.missing_data) ? raw.missing_data.slice(0, 40) : [],
      confidence: Number(raw.confidence) >= 0 ? Number(raw.confidence) : null,
      outputValid: check.ok,
      validationErrors: check.ok ? null : check.errors,
      // Always true by policy, whatever the model claims about its own output.
      humanReviewRequired: true,
      // sample.json() resolves the parsed value only, so the tier that actually
      // answered is not reported on this path. Recorded as unknown rather than
      // silently assumed to equal the tier requested.
      modelTierApplied: out.modelTierApplied || null,
    });
    await logRun(record);
    if (!check.ok) {
      const e = new Error('The model returned output that does not match the contract: ' + check.errors.join(' '));
      e.code = 'invalid_output';
      e.aiRunId = runId;
      throw e;
    }
    return { runId, result: raw.result, envelope: raw, record };
  } catch (err) {
    if (!record.outputValid) {
      record.outputValid = false;
      record.validationErrors = [String((err && err.message) || err)];
      record.runtimeMs = Date.now() - started;
      await logRun(record).catch(() => {});
    }
    throw err;
  }
}

async function logRun(record) {
  if (!S.store) return;
  try {
    await S.store.create('ai_runs', record, { projectId: S.projectId, actorKind: 'ai' });
  } catch (e) {
    /* a failed log must not break the user's action */
  }
}

// ------------------------------------------------------------ context builder

/**
 * The RAG context builder. Retrieval order follows MASTER_STRUCTURE §22:
 * project facts first, then verified project conditions, then authoritative
 * chemical data, then methodology. Every fact carries its status so the model
 * can see what is unverified.
 */
function buildContext(opts) {
  const o = opts || {};
  const p = project();
  if (!p) return {};
  const ctx = {
    project: {
      name: p.projectName,
      client: p.clientName,
      site: p.siteName,
      product: p.product,
      process: p.process,
      processStage: p.processStage,
      processDescription: trim(p.processDescription, 2200),
      chemistry: trim(p.chemistry, 900),
      batchSize: p.batchSize,
      productionRate: p.productionRate,
      utilities: p.utilities,
      revision: p.revision,
    },
    jurisdiction: p.jurisdiction || {},
    methodology: {
      guidewordEngine: 'Deterministic rule table; the app decides which guideword/parameter pairs are meaningful for a node. Do not invent parameters the node does not have.',
      riskEngine: 'The app computes every risk score. Do not output ratings.',
      consequenceOrder: 'Consequences are recorded BEFORE credit for safeguards.',
    },
  };

  ctx.chemicals = scoped('chemicals').map((c) => ({
    id: c.id,
    name: c.canonicalName,
    cas: c.cas,
    state: c.physicalState,
    quantity: c.quantity === null || c.quantity === undefined ? null : String(c.quantity) + ' ' + (c.quantityUnit || ''),
    quantityStatus: c.quantityStatus,
    classification: c.hazardousClassification,
    properties: scoped('chem_properties')
      .filter((x) => x.chemicalId === c.id)
      .map((x) => ({ key: x.key, value: x.value, unit: x.unit, status: x.status })),
  }));

  ctx.equipment = scoped('equipment').map((e) => ({
    id: e.id,
    tag: e.tag,
    type: e.type,
    service: e.service,
    capacity: e.capacity,
    moc: e.materialOfConstruction,
    operatingTemperature: e.operatingTemperature,
    designTemperature: e.designTemperature,
    designPressure: e.designPressure,
    agitator: e.agitator,
    heating: e.heatingSystem,
    cooling: e.coolingSystem,
    relief: e.reliefArrangement,
    instruments: e.instruments,
    trips: e.trips,
  }));

  if (o.nodeId) {
    const n = nodeById(o.nodeId);
    if (n) {
      ctx.node = {
        id: n.id,
        number: n.nodeNumber,
        name: n.worksheetName,
        description: trim(n.description, 1200),
        designIntent: trim(n.designIntent, 1200),
        boundaries: n.boundaries,
        equipmentTags: (n.equipmentIds || []).map((id) => (scoped('equipment').filter((e) => e.id === id)[0] || {}).tag).filter(Boolean),
        chemicals: (n.chemicalIds || []).map((id) => (scoped('chemicals').filter((c) => c.id === id)[0] || {}).canonicalName).filter(Boolean),
        utilities: n.utilities,
        operatingTemperature: n.operatingTemperature,
        operatingPressure: n.operatingPressure,
        instruments: n.instruments,
        alarms: n.alarms,
        trips: n.trips,
        reliefs: n.reliefs,
      };
      ctx.existingSafeguardsOnNode = scoped('safeguards')
        .filter((s) => s.nodeId === n.id)
        .map((s) => ({ text: s.text, class: s.class }));
      ctx.existingRowsOnNode = scoped('scenarios')
        .filter((s) => s.nodeId === n.id)
        .map((s) => ({ parameter: s.parameter, guideword: s.guideword, deviation: s.deviation }));
    }
  }

  if (o.includeProcessSteps) {
    ctx.processSteps = scoped('process_steps').map((s) => ({ step: s.stepNumber, title: s.title, description: trim(s.description, 500), temperature: s.temperature, pressure: s.pressure, duration: s.duration }));
  }

  if (o.includeDocuments) {
    ctx.documents = scoped('documents').map((d) => ({ id: d.id, title: d.title, class: d.docClass, number: d.docNumber, revision: d.docRevision, pages: d.pageCount, parsed: d.parseStatus }));
  }

  if (o.extraText) ctx.documentExcerpt = trim(o.extraText, 30000);

  if (o.includeVocabulary) {
    ctx.vocabulary = {
      causeFamilies: CAUSE_FAMILIES.map((f) => f.key),
      consequenceFamilies: CONSEQUENCE_FAMILIES.map((f) => f.key),
      safeguardClasses: SAFEGUARD_CLASSES.map((f) => f.key),
      controlLevels: CONTROL_LEVELS.map((f) => f.key),
    };
  }

  return ctx;
}

function trim(s, n) {
  if (s === null || s === undefined) return null;
  const t = String(s);
  return t.length > n ? t.slice(0, n) + ' …[truncated]' : t;
}

// ------------------------------------------------------------- the tasks

/** Propose nodes from the process model. Output arrives as PROPOSED drafts. */
async function proposeNodes() {
  const ctx = buildContext({ includeProcessSteps: true, includeDocuments: true });
  const out = await runTask({
    name: 'propose_nodes',
    taskClass: 'medium',
    instruction:
      'Propose HAZOP nodes for this plant from the process steps and equipment listed. Each node is a section of the process with one clear design intent. ' +
      'Group equipment that shares a design intent; split where the intent changes. Use the equipment tags exactly as given. ' +
      'Write the design intent as the plant intends the section to operate, in the plant\'s own terms, using ONLY the conditions given — if a temperature or quantity is not in the facts, do not state one.',
    shape:
      '[{"nodeNumber":"01","worksheetName":string,"description":string,"designIntent":string,"boundaries":string,' +
      '"equipmentTags":[string],"chemicalNames":[string],"utilities":[string],' +
      '"hasCharging":bool,"hasTransfer":bool,"hasDischarge":bool,"hasSampling":bool,"hasTimedStep":bool,' +
      '"isReactionStep":bool,"manualOperation":bool,"rationale":string}]',
    context: ctx,
  });
  const list = Array.isArray(out.result) ? out.result : [];
  return { runId: out.runId, nodes: list.map(sanitizeNodeProposal).filter(Boolean), envelope: out.envelope };
}

function sanitizeNodeProposal(n) {
  if (!n || typeof n !== 'object') return null;
  const tags = (n.equipmentTags || []).map(String);
  const equipment = scoped('equipment');
  const equipmentIds = tags.map((t) => (equipment.filter((e) => String(e.tag).toLowerCase() === t.toLowerCase())[0] || {}).id).filter(Boolean);
  const chems = scoped('chemicals');
  const chemicalIds = (n.chemicalNames || [])
    .map((nm) => (chems.filter((c) => String(c.canonicalName).toLowerCase() === String(nm).toLowerCase())[0] || {}).id)
    .filter(Boolean);
  return {
    nodeNumber: String(n.nodeNumber || '').slice(0, 12) || null,
    worksheetName: String(n.worksheetName || '').slice(0, 160),
    description: String(n.description || '').slice(0, 1200),
    designIntent: String(n.designIntent || '').slice(0, 1200),
    boundaries: String(n.boundaries || '').slice(0, 400),
    equipmentIds,
    chemicalIds,
    // Tags the model named that do not exist are reported, never silently created.
    unknownTags: tags.filter((t) => !equipment.some((e) => String(e.tag).toLowerCase() === t.toLowerCase())),
    utilities: (n.utilities || []).map(String).slice(0, 12),
    hasCharging: !!n.hasCharging,
    hasTransfer: !!n.hasTransfer,
    hasDischarge: !!n.hasDischarge,
    hasSampling: !!n.hasSampling,
    hasTimedStep: !!n.hasTimedStep,
    isReactionStep: !!n.isReactionStep,
    manualOperation: !!n.manualOperation,
    rationale: String(n.rationale || '').slice(0, 600),
    reviewStatus: 'PROPOSED',
    proposedBy: 'AI',
  };
}

/**
 * Draft worksheet rows for a node. The DEVIATION SET is supplied by the
 * deterministic guideword engine — the model fills causes, consequences and
 * safeguards for deviations the app has already decided are meaningful.
 */
async function draftScenarios(nodeId, deviations) {
  const node = nodeById(nodeId);
  if (!node) throw new Error('Node not found.');
  const gen = generateDeviations(node, { equipment: scoped('equipment'), chemicals: scoped('chemicals'), chemProperties: scoped('chem_properties') });
  const target = (deviations && deviations.length ? deviations : gen.combinations).slice(0, 14);
  const ctx = buildContext({ nodeId, includeVocabulary: true });
  ctx.deviationsToAddress = target.map((d) => ({ parameter: d.parameter, guideword: d.guideword, deviation: d.deviation, whyMeaningful: d.rationale }));

  const out = await runTask({
    name: 'draft_scenarios',
    taskClass: 'strong',
    instruction:
      'For each deviation in deviationsToAddress, draft the worksheet row: credible causes arising WITHIN this node, the consequences ASSUMING THE SAFEGUARDS DO NOT WORK, ' +
      'and the safeguards that already exist according to the facts given. Do not invent a safeguard that is not in existingSafeguardsOnNode or in the node\'s instruments, alarms, trips or reliefs. ' +
      'Do not rate risk. If a deviation has no credible cause in this node, set noMeaningfulDeviation true and give the reason. ' +
      'Classify each cause, consequence and safeguard using the vocabulary keys provided.',
    shape:
      '[{"parameter":string,"guideword":string,"noMeaningfulDeviation":bool,"noMeaningfulReason":string,' +
      '"causes":[{"text":string,"family":string}],"consequences":[{"text":string,"family":string}],' +
      '"existingSafeguards":[{"text":string,"class":string}],"notes":string}]',
    context: ctx,
  });

  const list = Array.isArray(out.result) ? out.result : [];
  return {
    runId: out.runId,
    rows: list.map((r) => sanitizeScenarioDraft(r, target)).filter(Boolean),
    envelope: out.envelope,
  };
}

function sanitizeScenarioDraft(r, target) {
  if (!r || typeof r !== 'object') return null;
  const match = target.filter((t) => t.parameter === r.parameter && t.guideword === r.guideword)[0];
  if (!match) return null; // the model may not add deviations of its own
  const famKeys = CAUSE_FAMILIES.map((f) => f.key);
  const consKeys = CONSEQUENCE_FAMILIES.map((f) => f.key);
  const sgKeys = SAFEGUARD_CLASSES.map((f) => f.key);
  return {
    parameter: match.parameter,
    parameterLabel: match.parameterLabel,
    guideword: match.guideword,
    guidewordLabel: match.guidewordLabel,
    deviation: match.deviation,
    deviationKind: match.kind,
    noMeaningfulDeviation: !!r.noMeaningfulDeviation,
    noMeaningfulReason: String(r.noMeaningfulReason || '').slice(0, 300),
    causes: (r.causes || []).slice(0, 8).map((c) => ({
      text: String((c && c.text) || c || '').slice(0, 300),
      family: famKeys.indexOf(c && c.family) !== -1 ? c.family : classifyCause((c && c.text) || c),
    })).filter((c) => c.text),
    consequences: (r.consequences || []).slice(0, 8).map((c) => ({
      text: String((c && c.text) || c || '').slice(0, 300),
      family: consKeys.indexOf(c && c.family) !== -1 ? c.family : classifyConsequence((c && c.text) || c),
    })).filter((c) => c.text),
    existingSafeguards: (r.existingSafeguards || []).slice(0, 10).map((s) => ({
      text: String((s && s.text) || s || '').slice(0, 300),
      class: sgKeys.indexOf(s && s.class) !== -1 ? s.class : classifySafeguard((s && s.text) || s),
    })).filter((s) => s.text),
    notes: String(r.notes || '').slice(0, 400),
    reviewerStatus: 'DRAFT',
    aiDrafted: true,
  };
}

/** Draft recommendations for a scenario. Never sets a residual rating. */
async function draftRecommendations(scenario) {
  const node = nodeById(scenario.nodeId);
  const ctx = buildContext({ nodeId: scenario.nodeId, includeVocabulary: true });
  ctx.scenario = {
    deviation: scenario.deviation,
    causes: (scenario.causes || []).map((c) => c.text),
    consequences: (scenario.consequences || []).map((c) => c.text),
    existingSafeguards: (scenario.existingSafeguards || []).map((s) => s.text),
  };
  const out = await runTask({
    name: 'draft_recommendations',
    taskClass: 'medium',
    instruction:
      'Draft recommendations for this scenario, working down the hierarchy of control: eliminate, substitute, engineering control, administrative control, PPE. ' +
      'Each recommendation must name a specific measure, where it goes, and the condition that would show it is done. ' +
      'Do not write "take care", "be careful", "use PPE" or "follow SOP" as an action. Do not state a residual risk rating. ' +
      'Give the technical basis in one sentence. Where a legal or standard basis is genuinely relevant, name it only if it appears in the facts.',
    shape: '[{"text":string,"technicalBasis":string,"controlLevel":string,"priority":"LOW|MEDIUM|HIGH|CRITICAL","responsibleDepartment":string,"legalBasis":string,"standardBasis":string}]',
    context: ctx,
  });
  const levels = CONTROL_LEVELS.map((l) => l.key);
  const list = (Array.isArray(out.result) ? out.result : []).slice(0, 6).map((r) => ({
    text: String((r && r.text) || '').slice(0, 700),
    technicalBasis: String((r && r.technicalBasis) || '').slice(0, 500),
    controlLevel: levels.indexOf(r && r.controlLevel) !== -1 ? r.controlLevel : null,
    priority: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'].indexOf(r && r.priority) !== -1 ? r.priority : null,
    responsibleDepartment: String((r && r.responsibleDepartment) || '').slice(0, 120),
    legalBasis: String((r && r.legalBasis) || '').slice(0, 300),
    standardBasis: String((r && r.standardBasis) || '').slice(0, 300),
    nodeId: scenario.nodeId,
    scenarioId: scenario.id,
    nodeNumber: node ? node.nodeNumber : null,
  })).filter((r) => r.text);
  // Run the quality assessment the human would otherwise have to run by eye.
  for (const r of list) r.quality = assessRecommendationQuality(r);
  return { runId: out.runId, recommendations: list, envelope: out.envelope };
}

/** Extract structured fields from document text, with page locators. */
async function extractFromDocument(doc, text) {
  const ctx = buildContext({ includeDocuments: true });
  ctx.documentUnderExtraction = { id: doc.id, title: doc.title, class: doc.docClass, pages: doc.pageCount };
  const out = await runTask({
    name: 'extract_fields',
    taskClass: 'strong',
    instruction:
      'Read the document excerpt and extract engineering facts into the field list. For EVERY value give the page and the exact original text you read it from. ' +
      'Extract only what the text states. Do not convert units — give the value and unit as written. Do not carry a value over from the project facts; extract only from this document. ' +
      'If the document states a value that conflicts with the project facts, still extract it: the app raises the conflict.',
    shape:
      '{"fields":[{"entityKind":"project|equipment|chemical|process_step","entityRef":string,"field":string,"value":string,"unit":string,"page":number,"quote":string,"confidence":0.0}],' +
      '"equipment":[{"tag":string,"type":string,"service":string,"capacity":string,"moc":string,"page":number,"quote":string}],' +
      '"chemicals":[{"name":string,"cas":string,"quantity":string,"unit":string,"state":string,"page":number,"quote":string}],' +
      '"processSteps":[{"stepNumber":string,"title":string,"description":string,"page":number}],' +
      '"teamMembers":[{"name":string,"designation":string,"department":string,"organization":string,"role":string,"page":number}]}',
    context: ctx,
    extraText: text,
    sourceIds: [doc.id],
  });
  return { runId: out.runId, extraction: out.result || {}, envelope: out.envelope };
}

/** Extract conditions from an uploaded licence / consent / EC, verbatim. */
async function extractPermitConditions(permit, text) {
  const out = await runTask({
    name: 'extract_permit_conditions',
    taskClass: 'strong',
    instruction:
      'Extract the conditions from this licence / consent / approval. Reproduce each condition VERBATIM in "text" — do not paraphrase, shorten or reinterpret it. ' +
      'Put any interpretation in "analysis", clearly separate from the condition, and mark what is your reading rather than the document\'s words. ' +
      'Identify recurring monitoring, return or inspection requirements and their stated frequency. Give the condition number as the document gives it. ' +
      'If a due date is stated, give it; do not calculate one.',
    shape:
      '[{"conditionNumber":string,"text":string,"category":"monitoring|return|capacity|infrastructure|reporting|other",' +
      '"frequency":"DAILY|WEEKLY|FORTNIGHTLY|MONTHLY|QUARTERLY|HALF_YEARLY|ANNUAL|BIENNIAL|FIVE_YEARLY|ON_EVENT|ONE_TIME",' +
      '"statedDueDate":string,"analysis":string,"namesEquipment":[string],"namesChemicals":[string]}]',
    context: { permit: { type: permit.permitType, authority: permit.issuingAuthority, number: permit.number }, equipmentTags: scoped('equipment').map((e) => e.tag), chemicalNames: scoped('chemicals').map((c) => c.canonicalName) },
    extraText: text,
  });
  const freqs = ['DAILY', 'WEEKLY', 'FORTNIGHTLY', 'MONTHLY', 'QUARTERLY', 'HALF_YEARLY', 'ANNUAL', 'BIENNIAL', 'FIVE_YEARLY', 'ON_EVENT', 'ONE_TIME'];
  const list = (Array.isArray(out.result) ? out.result : []).slice(0, 80).map((c) => ({
    conditionNumber: String((c && c.conditionNumber) || '').slice(0, 24),
    text: String((c && c.text) || '').slice(0, 2000),
    category: ['monitoring', 'return', 'capacity', 'infrastructure', 'reporting', 'other'].indexOf(c && c.category) !== -1 ? c.category : 'other',
    frequency: freqs.indexOf(c && c.frequency) !== -1 ? c.frequency : null,
    statedDueDate: /^\d{4}-\d{2}-\d{2}$/.test((c && c.statedDueDate) || '') ? c.statedDueDate : null,
    analysis: String((c && c.analysis) || '').slice(0, 900),
    analysisStatus: 'AI_INFERRED',
    namesEquipment: (c && c.namesEquipment) || [],
    namesChemicals: (c && c.namesChemicals) || [],
  })).filter((c) => c.text);
  return { runId: out.runId, conditions: list, envelope: out.envelope };
}

/** Explain a legal applicability finding. The status itself is never changed. */
async function explainApplicability(record) {
  const out = await runTask({
    name: 'explain_applicability',
    taskClass: 'strong',
    instruction:
      'Explain, for a plant engineer, why the system has given this obligation the status it has, and exactly what would resolve it. ' +
      'The status is fixed and computed by the application — do not propose a different one. Separate three things clearly: what the project facts say, ' +
      'what the application concluded from them, and what remains an open question. Do not state the content of any legal provision beyond what the facts below give.',
    shape: '{"factsSay":string,"systemConcluded":string,"openQuestions":[string],"toResolve":[string]}',
    context: {
      obligation: { instrument: record.instrumentTitle, topic: record.topic, section: record.sectionRuleSchedule, authority: record.authority, evidenceExpected: record.evidenceExpected },
      status: record.applicabilityStatus,
      engineReason: record.applicabilityReason,
      factsUsed: record.factsUsed,
      missingFacts: record.missingFacts,
      thresholdEvaluation: record.thresholdEvaluation ? { conclusion: record.thresholdEvaluation.conclusion, results: (record.thresholdEvaluation.results || []).map((r) => ({ chemical: r.chemicalName, status: r.status, arithmetic: r.arithmetic })) } : null,
      sourceRefs: record.sourceRefs,
    },
  });
  return { runId: out.runId, explanation: out.result || {} };
}

/** Write the narrative report sections from the project record. */
async function draftReportSection(sectionKey, label) {
  const ctx = buildContext({ includeDocuments: true, includeProcessSteps: true });
  ctx.nodes = scoped('nodes').map((n) => ({ number: n.nodeNumber, name: n.worksheetName, intent: n.designIntent }));
  ctx.recommendationCount = scoped('recommendations').length;
  const out = await runTask({
    name: 'draft_report_section',
    taskClass: 'medium',
    instruction:
      'Write the "' + label + '" section of a HAZOP report for this project, in formal engineering English, from the facts given only. ' +
      'Do not state conditions, capacities or conclusions that are not in the facts. Do not claim compliance with anything. Plain paragraphs, no markdown headings.',
    shape: '{"paragraphs":[string]}',
    context: ctx,
  });
  const paras = ((out.result && out.result.paragraphs) || []).map((p) => String(p).slice(0, 2500)).filter(Boolean);
  return { runId: out.runId, paragraphs: paras };
}

// DOCX is written as real OOXML (JSZip), so Word opens it as an editable
// document with styles, headings and tables — not as an HTML file with a .doc
// extension. XLSX uses SheetJS. PDF is the print stylesheet over the report
// view, which is what makes page breaks per node work.

// --------------------------------------------------------------------- JSON

function buildBackup() {
  const p = project();
  const collections = {};
  for (const name of ['documents', 'extracted_fields', 'field_conflicts', 'process_steps', 'equipment', 'chemicals', 'chem_properties', 'nodes', 'scenarios', 'safeguards', 'recommendations', 'team_members', 'workshop_sessions', 'assumptions', 'data_gaps', 'sources', 'compliance', 'permits', 'permit_conditions', 'compliance_tasks', 'compliance_evidence', 'legal_thresholds', 'legal_updates', 'legal_node_links', 'risk_matrices', 'ai_runs', 'report_versions']) {
    collections[name] = scoped(name);
  }
  return {
    schemaVersion: 'hazop-backup-1',
    exportedAt: nowIso(),
    exportedBy: S.actor.name || S.actor.id,
    engineVersions: engineVersions(),
    caution: CAUTION_TEXT,
    project: p,
    matrix: matrix(),
    collections,
    audit: scoped('audit'),
  };
}

async function exportJson() {
  const p = project();
  const data = JSON.stringify(buildBackup(), null, 1);
  return offerDownload(fileBase(p) + '-backup.json', data, 'application/json');
}

function sheetJs() {
  return window.XLSX || null;
}

async function exportHazopXlsx() {
  const XLSX = sheetJs();
  if (!XLSX) {
    toast('The spreadsheet library did not load. Use the JSON backup, or print the report to PDF.', 'err');
    return false;
  }
  const p = project();
  const m = matrix();
  const wb = XLSX.utils.book_new();

  const header = ['#', 'Parameter', 'Guideword', 'Deviation', 'Causes', 'Consequences', 'Existing safeguards', 'L', 'S', 'Initial risk', 'Score', 'Recommendations', 'L', 'S', 'Residual risk', 'Residual basis', 'Status'];
  const combined = [header];

  for (const node of nodesSorted()) {
    const rows = [
      ['Node', node.nodeNumber, node.worksheetName || ''],
      ['Design intent', node.designIntent || ''],
      ['Equipment', (node.equipmentIds || []).map((id) => (scoped('equipment').filter((e) => e.id === id)[0] || {}).tag).filter(Boolean).join(', ')],
      ['Chemicals', (node.chemicalIds || []).map((id) => (scoped('chemicals').filter((c) => c.id === id)[0] || {}).canonicalName).filter(Boolean).join(', ')],
      [],
      header,
    ];
    for (const s of scenariosFor(node.id)) {
      const line = worksheetRow(s, m, node);
      rows.push(line);
      combined.push(['Node ' + node.nodeNumber].concat(line.slice(1)));
    }
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 5 }, { wch: 13 }, { wch: 11 }, { wch: 22 }, { wch: 34 }, { wch: 34 }, { wch: 34 }, { wch: 4 }, { wch: 4 }, { wch: 13 }, { wch: 6 }, { wch: 34 }, { wch: 4 }, { wch: 4 }, { wch: 13 }, { wch: 28 }, { wch: 16 }];
    XLSX.utils.book_append_sheet(wb, ws, ('N' + (node.nodeNumber || '') + ' ' + (node.worksheetName || '')).slice(0, 31) || 'Node');
  }

  const cws = XLSX.utils.aoa_to_sheet(combined);
  XLSX.utils.book_append_sheet(wb, cws, 'All nodes');

  const meta = XLSX.utils.aoa_to_sheet([
    ['HAZOP worksheets'],
    ['Project', p.projectName || ''],
    ['Client', p.clientName || ''],
    ['Site', p.siteName || ''],
    ['Revision', p.revision || ''],
    ['Risk matrix', (m.name || m.id) + ' v' + m.version],
    ['Exported', nowIso()],
    [],
    ['Caution'],
    [CAUTION_TEXT],
  ]);
  meta['!cols'] = [{ wch: 18 }, { wch: 110 }];
  XLSX.utils.book_append_sheet(wb, meta, 'About');

  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  return offerDownload(fileBase(p) + '-hazop.xlsx', new Uint8Array(out), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

function worksheetRow(s, m, node) {
  const initial = tryRiskFromLS(m, s.initialLikelihood, s.initialSeverity);
  const residual = tryRiskFromLS(m, s.residualLikelihood, s.residualSeverity);
  const recs = scoped('recommendations').filter((r) => r.scenarioId === s.id);
  return [
    s.rowNumber || '',
    s.parameterLabel || s.parameter,
    s.guidewordLabel || s.guideword,
    s.deviation,
    s.noMeaningfulDeviation ? 'No meaningful deviation — ' + (s.noMeaningfulReason || '') : (s.causes || []).map((c) => '• ' + c.text).join('\n'),
    (s.consequences || []).map((c) => '• ' + c.text).join('\n'),
    (s.existingSafeguards || []).map((c) => '• ' + c.text).join('\n'),
    s.initialLikelihood === null || s.initialLikelihood === undefined ? '' : s.initialLikelihood,
    s.initialSeverity === null || s.initialSeverity === undefined ? '' : s.initialSeverity,
    initial.ok ? initial.bandLabel : 'Not rated',
    initial.ok && initial.score !== null ? initial.score : '',
    recs.map((r) => (r.recId || '') + ' ' + r.text).join('\n'),
    s.residualLikelihood === null || s.residualLikelihood === undefined ? '' : s.residualLikelihood,
    s.residualSeverity === null || s.residualSeverity === undefined ? '' : s.residualSeverity,
    residual.ok ? residual.bandLabel : '',
    s.residualBasisKind ? s.residualBasisKind + ': ' + (s.residualBasisText || '') : '',
    s.reviewerStatus || 'DRAFT',
  ];
}

// -------------------------------------------------------------------- DOCX

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function para(text, opts) {
  const o = opts || {};
  const runs = String(text === null || text === undefined ? '' : text)
    .split('\n')
    .map((line, i) => (i ? '<w:r><w:br/></w:r>' : '') + '<w:r>' + rPr(o) + '<w:t xml:space="preserve">' + esc(line) + '</w:t></w:r>')
    .join('');
  return '<w:p>' + pPr(o) + runs + '</w:p>';
}

function pPr(o) {
  let s = '<w:pPr>';
  if (o.style) s += '<w:pStyle w:val="' + o.style + '"/>';
  if (o.align) s += '<w:jc w:val="' + o.align + '"/>';
  if (o.pageBreakBefore) s += '<w:pageBreakBefore/>';
  if (o.spacingAfter !== undefined) s += '<w:spacing w:after="' + o.spacingAfter + '"/>';
  s += '</w:pPr>';
  return s === '<w:pPr></w:pPr>' ? '' : s;
}

function rPr(o) {
  let s = '';
  if (o.bold) s += '<w:b/>';
  if (o.italic) s += '<w:i/>';
  if (o.size) s += '<w:sz w:val="' + o.size + '"/>';
  if (o.color) s += '<w:color w:val="' + o.color + '"/>';
  if (o.mono) s += '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>';
  return s ? '<w:rPr>' + s + '</w:rPr>' : '';
}

function table(headers, rows, widths) {
  const w = widths || headers.map(() => Math.floor(9300 / headers.length));
  const grid = '<w:tblGrid>' + w.map((x) => '<w:gridCol w:w="' + x + '"/>').join('') + '</w:tblGrid>';
  const tblPr =
    '<w:tblPr><w:tblStyle w:val="HazopTable"/><w:tblW w:w="5000" w:type="pct"/>' +
    '<w:tblBorders>' +
    ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map((side) => '<w:' + side + ' w:val="single" w:sz="4" w:space="0" w:color="AAAAAA"/>').join('') +
    '</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr>';
  const headRow =
    '<w:tr><w:trPr><w:tblHeader/></w:trPr>' +
    headers.map((hd, i) => '<w:tc><w:tcPr><w:tcW w:w="' + w[i] + '" w:type="dxa"/><w:shd w:val="clear" w:fill="E8EDEB"/></w:tcPr>' + para(hd, { bold: true, size: 16 }) + '</w:tc>').join('') +
    '</w:tr>';
  const bodyRows = rows
    .map((r) => '<w:tr>' + r.map((cell, i) => '<w:tc><w:tcPr><w:tcW w:w="' + w[i] + '" w:type="dxa"/></w:tcPr>' + para(cell, { size: 16 }) + '</w:tc>').join('') + '</w:tr>')
    .join('');
  return '<w:tbl>' + tblPr + grid + headRow + bodyRows + '</w:tbl>' + para('');
}

async function exportDocx() {
  const JSZip = window.JSZip;
  if (!JSZip) {
    toast('The document library did not load. Use Print to produce a PDF, or the JSON backup.', 'err');
    return false;
  }
  const p = project();
  const m = matrix();
  const gate = qualityGate();
  const reg = recommendationRegister();
  const creg = complianceRegister();
  const gaps = dataGapsAll();
  const nodes = nodesSorted();
  const status = (S.selection.reportStatus || 'DRAFT');

  const body = [];
  const H1 = (t) => para(t, { style: 'Heading1', pageBreakBefore: true });
  const H2 = (t) => para(t, { style: 'Heading2' });
  const H3 = (t) => para(t, { style: 'Heading3' });

  // 1 Cover
  body.push(para('HAZOP STUDY REPORT', { style: 'Title' }));
  body.push(para(p.projectName || '', { bold: true, size: 30 }));
  body.push(
    table(
      ['Field', 'Detail'],
      [
        ['Client', p.clientName || '—'],
        ['Site', p.siteName || '—'],
        ['Site address', p.siteAddress || '—'],
        ['Product', p.product || '—'],
        ['Process', p.process || '—'],
        ['Process stage', p.processStage || '—'],
        ['Department', p.department || '—'],
        ['Project type', p.projectType || '—'],
        ['Revision', p.revision || 'R0'],
        ['Report status', status],
        ['Study period', (p.studyStartDate || '—') + ' to ' + (p.studyEndDate || '—')],
        ['Risk matrix', (m.name || m.id) + ' v' + m.version],
        ['Generated', todayIso()],
      ],
      [2600, 6700]
    )
  );
  if (status === 'DRAFT') body.push(para('DRAFT — not for issue', { bold: true, color: 'B84C17', size: 28, align: 'center' }));

  // 2 Revision history
  body.push(H1('1. Revision history'));
  const revs = scoped('report_versions').slice().sort((a, b) => String(a.generatedAt).localeCompare(String(b.generatedAt)));
  body.push(
    revs.length
      ? table(['Revision', 'Status', 'Generated', 'By', 'Notes'], revs.map((r) => [r.revision, r.status, String(r.generatedAt).slice(0, 10), r.generatedByName || '', r.notes || '']), [1300, 1400, 1800, 2000, 2800])
      : para('This is the first issue of this report.')
  );

  // 3 Caution
  body.push(H1('2. Caution and limitations'));
  body.push(para(CAUTION_TEXT, { style: 'Caution' }));

  // 4-6 Introduction, scope, process
  body.push(H1('3. Introduction'));
  body.push(para((p.clientName || 'The client') + ' commissioned a Hazard and Operability study of the ' + (p.process || 'process') + ' at ' + (p.siteName || 'the site') + '. This report records the study, the team\'s findings, the recommendations raised and the regulatory questions the study identified.'));
  body.push(H1('4. Scope of work'));
  body.push(para(p.processStage ? 'The study covered ' + (p.process || 'the process') + ', ' + p.processStage + '.' : 'The study covered ' + (p.process || 'the process') + '.'));
  body.push(H1('5. Process description'));
  body.push(para(p.processDescription || 'Not recorded.'));
  if (p.chemistry) {
    body.push(H2('5.1 Chemistry'));
    body.push(para(p.chemistry));
  }
  const steps = scoped('process_steps').slice().sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
  if (steps.length) {
    body.push(H2('5.2 Process sequence'));
    body.push(table(['Step', 'Description', 'T', 'P', 'Duration'], steps.map((s) => [(s.stepNumber || '') + ' ' + s.title, s.description || '', s.temperature || '', s.pressure || '', s.duration || '']), [1600, 4500, 1100, 1100, 1000]));
  }

  // 7 Documents
  body.push(H1('6. Documents reviewed'));
  const docs = scoped('documents');
  body.push(
    docs.length
      ? table(['Title', 'Class', 'Number', 'Rev', 'SHA-256', 'Parse'], docs.map((d) => [d.title, d.docClass || '', d.docNumber || '', d.docRevision || '', d.sha256 ? d.sha256.slice(0, 16) + '…' : '—', d.parseStatus || '']), [3000, 1500, 1400, 700, 1900, 800])
      : para('No documents registered.')
  );

  // 8 Methodology
  body.push(H1('7. HAZOP methodology'));
  body.push(para('The study followed the guideword approach: for each node the team stated the design intent, applied the guidewords to the parameters present in that node, developed credible causes, examined the consequences without credit for safeguards, recorded the safeguards already provided, rated the risk against the project matrix, and raised recommendations where the safeguards were judged insufficient.'));
  body.push(para('The meaningful guideword and parameter combinations for each node were generated deterministically from the node\'s own facts — its equipment, utilities, chemicals and operating steps — rather than from a fixed template, so the worksheet carries the deviations that apply to that node and not a cross-product of every possibility.'));
  body.push(para('Risk ratings, unit conversions, regulatory threshold comparisons and renewal dates were computed in code. Where automated analysis drafted text, the team reviewed it; the report marks any value that remains a model inference.'));

  // 9 Standards
  body.push(H1('8. Reference standards and guidance'));
  const stds = scoped('sources').filter((s) => s.sourceType === 'STANDARD' || s.sourceType === 'REGULATOR_GUIDANCE' || s.sourceType === 'COMPANY_STANDARD');
  body.push(para('The following are standards and guidance. A standard is mandatory only where it is incorporated by law, by a licence or consent condition, by contract or by a company standard; this report does not treat a standard as a statutory obligation.', { italic: true }));
  body.push(stds.length ? table(['Type', 'Title', 'Publisher', 'Locator'], stds.map((s) => [s.sourceType, s.title, s.publisher || '', s.locator || '']), [1900, 3800, 2000, 1600]) : para('None recorded.'));

  // 10 Legal summary
  body.push(H1('9. Legal and regulatory applicability summary'));
  const counts = { APPLICABLE_CONFIRMED: 0, POTENTIALLY_APPLICABLE: 0, NOT_ENOUGH_DATA: 0, NOT_APPLICABLE_CONFIRMED: 0, REQUIRES_LEGAL_REVIEW: 0 };
  for (const r of creg) if (Object.prototype.hasOwnProperty.call(counts, r.effectiveStatus)) counts[r.effectiveStatus] += 1;
  body.push(para('This section records which legal instruments the study identified as relevant, and on what project facts. A status of POTENTIALLY_APPLICABLE, NOT_ENOUGH_DATA or REQUIRES_LEGAL_REVIEW is an unresolved question, not a finding of compliance or non-compliance.', { italic: true }));
  body.push(table(['Applicability', 'Count'], Object.keys(counts).map((k) => [k.replace(/_/g, ' '), String(counts[k])]), [5000, 1400]));
  const shown = creg.filter((r) => r.effectiveStatus !== 'NOT_APPLICABLE_CONFIRMED');
  if (shown.length) {
    body.push(H2('9.1 Instruments identified'));
    body.push(table(['Law / rule', 'Section', 'Obligation', 'Applicability', 'Why', 'Authority'], shown.map((r) => [r.instrumentTitle, r.sectionRuleSchedule || '', r.topic, r.effectiveStatus.replace(/_/g, ' '), r.humanReason || r.applicabilityReason || '', r.authority || '']), [2200, 1500, 1700, 1400, 1700, 1200]));
  }
  const na = creg.filter((r) => r.effectiveStatus === 'NOT_APPLICABLE_CONFIRMED');
  if (na.length) {
    body.push(H2('9.2 Considered and not applicable'));

  const name = (p && p.projectName) || 'hazop';

  try {
    return await build(store, onProgress);

}

    )
  );

  const triGrid = h('div', { class: 'grid c2' });
  for (const f of TRI_FIELDS) {
    const cur = j[f.key];
    const value = cur === true ? true : cur === false ? false : null;
    const gated = run && run.pendingQuestions ? run.pendingQuestions.filter((q) => q.fact === factNameFor(f.key))[0] : null;
    triGrid.appendChild(
      h(
        'div',

      )
    );
  }
  card.appendChild(triGrid);

  card.appendChild(h('div', { class: 'section-rule' }, h('h2', { text: 'Resolved facts' })));
  const factRows = Object.keys(resolved.facts)
    .filter((k) => k !== 'always')
    .map((k) => {
      const v = resolved.facts[k];
      return h(
        'tr',
        {},
        h('td', { class: 'mono', text: k }),
        h('td', {}, v === true ? h('span', { class: 'badge verified', text: 'TRUE' }) : v === false ? h('span', { class: 'badge na', text: 'FALSE' }) : typeof v === 'number' ? h('span', { class: 'mono', text: String(v) }) : h('span', { class: 'badge missing', text: 'NOT RESOLVED' })),
        h('td', { class: 'small muted', text: (resolved.provenance[k] && (resolved.provenance[k].from || []).join(', ')) || '' }),

  );

  return card;
}

// The resolver's internal fact names differ from the profile field names in

  const map = {

function parseBadge(d) {

function uploadDialog(p) {
  const title = input({ placeholder: 'Document title', id: 'd-title' });

  const pasted = textarea({ placeholder: 'Or paste the document text here — extraction works from pasted text exactly as it does from a file.', rows: 5, id: 'd-text' });
  const status = h('div', { class: 'field-hint', text: '' });

  const body = h(
    'div',
    {},
    field('Title', title),
    h('div', { class: 'grid c2' }, field('Class', cls), field('Document number', number), field('Revision', rev), field('Issued date', issued)),
    field('File', file, 'PDF text layers, and plain text / CSV / Markdown, are read in the browser. A scanned PDF has no text layer — register it and paste the text, or use the server deployment for OCR.'),
    field('Document text', pasted),

  );

  drawer('Register a document', body, [
    h('button', { class: 'btn', text: 'Cancel', onclick: closeDrawer }),
    h('button', {
      class: 'btn primary',
      text: 'Register',
      onclick: async (e) => {
        const btn = e.target;
        btn.disabled = true;
        try {
          status.textContent = 'Reading…';
          const f = file.files && file.files[0];
          let text = pasted.value.trim();
          let sha = null;
          let pages = null;
          let parseStatus = 'METADATA_ONLY';
          let parseError = null;
          let assetId = null;
          let assetUrl = null;

          if (f) {
            const buf = await f.arrayBuffer();
            sha = await sha256Hex(buf);
            if (/\.pdf$/i.test(f.name)) {
              status.textContent = 'Extracting the PDF text layer…';
              const out = await extractPdfText(buf);
              pages = out.pages;
              if (out.text.trim().length > 40) {
                text = out.text;
                parseStatus = 'PARSED';
              } else {
                parseStatus = 'NO_TEXT_LAYER';
                parseError = 'The PDF has no usable text layer (' + out.pages + ' page(s) scanned). Paste the text, or run OCR in the server deployment.';
              }
            } else {
              text = new TextDecoder().decode(buf);
              parseStatus = 'PARSED';
            }
            const caps = window.__HAZOP_CAPS || {};
            if (caps.assets) {
              try {
                status.textContent = 'Storing the file…';
                const up = await caps.assets.upload(f);
                assetId = up.id;
                assetUrl = up.url;
              } catch (err) {
                parseError = (parseError ? parseError + ' ' : '') + 'File storage failed: ' + ((err && err.message) || 'unknown');
              }
            }
          } else if (text) {
            sha = await sha256Hex(new TextEncoder().encode(text).buffer);
            parseStatus = 'TEXT_ONLY';
          }

          const rec = await S.store.create(
            'documents',
            {
              projectId: p.id,
              title: title.value.trim() || (f ? f.name : 'Untitled document'),
              docClass: cls.value,
              docNumber: number.value.trim(),
              docRevision: rev.value.trim(),
              issuedDate: issued.value || null,
              fileName: f ? f.name : null,
              mimeType: f ? f.type : text ? 'text/plain' : null,
              byteSize: f ? f.size : text ? text.length : null,
              sha256: sha,
              pageCount: pages,
              version: 1,
              parseStatus,
              parseError,
              assetId,
              assetUrl,
              text: text ? text.slice(0, 400000) : null,
            },
            { projectId: p.id }
          );

          await S.store.create('sources', { projectId: p.id, sourceType: 'PROJECT_DOCUMENT', title: rec.title, locator: rec.docNumber || null, documentId: rec.id, sha256: sha, retrievedAt: nowIso() }, { projectId: p.id });

          closeDrawer();
          toast('Document registered', 'ok');
          if (text && aiAvailable()) runExtraction(rec);
          else render();
        } catch (err) {
          status.textContent = '';
          toast('Could not register the document: ' + ((err && err.message) || 'unknown error'), 'err');
          btn.disabled = false;
        }
      },
    }),
  ]);
}

async function sha256Hex(buf) {
  if (!(window.crypto && window.crypto.subtle)) return null;
  const digest = await window.crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function extractPdfText(buf) {
  const lib = window.pdfjsLib;
  if (!lib) return { text: '', pages: null };
  try {
    if (lib.GlobalWorkerOptions) lib.GlobalWorkerOptions.workerSrc = window.__PDFJS_WORKER || '';
    const pdf = await lib.getDocument({ data: buf, disableWorker: !window.__PDFJS_WORKER, isEvalSupported: false }).promise;
    const parts = [];
    const max = Math.min(pdf.numPages, 60);
    for (let i = 1; i <= max; i += 1) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const line = content.items.map((it) => it.str).join(' ');
      parts.push('[page ' + i + '] ' + line);
    }
    return { text: parts.join('\n'), pages: pdf.numPages };
  } catch (e) {
    return { text: '', pages: null, error: (e && e.message) || 'PDF read failed' };
  }
}

// -------------------------------------------------------------- extraction

async function runExtraction(doc) {
  if (!aiAvailable()) {
    toast('Extraction needs AI assistance, which is not available in this view. You can enter the values by hand on the process, equipment and chemicals pages.', 'err');
    return;
  }
  if (!doc.text) {
    toast('This document has no text to extract from. Paste its text on the document panel.', 'err');
    return;
  }
  const p = project();
  if (p && p.confidentialDocuments !== false) {
    const ok = await confirmAction('Send this document\'s text for extraction?', 'The project is set to treat documents as confidential. Extraction sends the text to Claude on your own account. Turn the setting off on the project profile to stop being asked, or cancel here.');
    if (!ok) return;
  }
  toast('Extracting…');
  try {
    const out = await extractFromDocument(doc, doc.text);
    const applied = await applyExtraction(doc, out.extraction, out.runId);
    await S.store.update('documents', doc.id, { parseStatus: 'PARSED', lastExtractedAt: nowIso(), lastAiRunId: out.runId }, { projectId: doc.projectId });
    toast(applied.fields + ' field(s), ' + applied.equipment + ' equipment, ' + applied.chemicals + ' chemical(s) extracted · ' + applied.conflicts + ' conflict(s) raised', 'ok');
    go('data-review');
  } catch (e) {
    toast('Extraction failed: ' + ((e && e.message) || 'unknown error'), 'err');
  }
}

/**
 * Write the extraction into the project model. Nothing overwrites a VERIFIED or
 * USER_CONFIRMED value; a disagreement becomes a conflict record.
 */
async function applyExtraction(doc, ex, runId) {
  const pid = doc.projectId;
  const counts = { fields: 0, equipment: 0, chemicals: 0, conflicts: 0, steps: 0, team: 0 };
  const refOf = (page, quote) => [{ sourceType: 'PROJECT_DOCUMENT', documentId: doc.id, documentName: doc.title, version: doc.version || 1, page: page || null, quote: quote ? String(quote).slice(0, 400) : null, extractedAt: nowIso() }];

  for (const f of (ex.fields || []).slice(0, 200)) {
    if (!f || !f.field) continue;
    const rec = await S.store.create(
      'extracted_fields',
      {
        projectId: pid,
        entityKind: f.entityKind || 'project',
        entityRef: f.entityRef || null,
        field: String(f.field).slice(0, 80),
        value: f.value === null || f.value === undefined ? null : String(f.value).slice(0, 300),
        unit: f.unit ? String(f.unit).slice(0, 24) : null,
        rawText: f.quote ? String(f.quote).slice(0, 400) : null,
        status: 'DOCUMENT_EXTRACTED',
        confidence: Number(f.confidence) >= 0 ? Number(f.confidence) : null,
        method: 'ai-extract',
        sourceRefs: refOf(f.page, f.quote),
        aiRunId: runId,
      },
      { projectId: pid, actorKind: 'ai', aiRunId: runId }
    );
    counts.fields += 1;
    const conflict = await checkConflict(pid, rec);
    if (conflict) counts.conflicts += 1;
  }

  for (const e of (ex.equipment || []).slice(0, 80)) {
    if (!e || !e.tag) continue;
    const existing = scoped('equipment').filter((x) => String(x.tag).toLowerCase() === String(e.tag).toLowerCase())[0];
    if (existing) {
      // Do not overwrite; record what this document says as an extracted field.
      for (const key of ['type', 'service', 'capacity', 'moc']) {
        if (!e[key]) continue;
        const target = key === 'moc' ? 'materialOfConstruction' : key;
        if (String(existing[target] || '') === String(e[key])) continue;
        const rec = await S.store.create('extracted_fields', { projectId: pid, entityKind: 'equipment', entityId: existing.id, entityRef: e.tag, field: target, value: String(e[key]).slice(0, 300), status: 'DOCUMENT_EXTRACTED', method: 'ai-extract', sourceRefs: refOf(e.page, e.quote), aiRunId: runId }, { projectId: pid, actorKind: 'ai', aiRunId: runId });
        counts.fields += 1;
        if (await checkConflict(pid, rec)) counts.conflicts += 1;
      }
      continue;
    }
    await S.store.create('equipment', { projectId: pid, tag: String(e.tag).slice(0, 40), type: e.type || null, service: e.service || null, capacity: e.capacity || null, materialOfConstruction: e.moc || null, sourceRefs: refOf(e.page, e.quote), status: 'DOCUMENT_EXTRACTED' }, { projectId: pid, actorKind: 'ai', aiRunId: runId });
    counts.equipment += 1;
  }

  for (const c of (ex.chemicals || []).slice(0, 60)) {
    if (!c || !c.name) continue;
    const existing = scoped('chemicals').filter((x) => String(x.canonicalName).toLowerCase() === String(c.name).toLowerCase())[0];
    if (existing) {
      if (c.quantity && String(existing.quantity || '') !== String(c.quantity)) {
        const rec = await S.store.create('extracted_fields', { projectId: pid, entityKind: 'chemical', entityId: existing.id, entityRef: c.name, field: 'quantity', value: String(c.quantity), unit: c.unit || null, status: 'DOCUMENT_EXTRACTED', method: 'ai-extract', sourceRefs: refOf(c.page, c.quote), aiRunId: runId }, { projectId: pid, actorKind: 'ai', aiRunId: runId });
        counts.fields += 1;
        if (await checkConflict(pid, rec)) counts.conflicts += 1;
      }
      continue;
    }
    const qty = parseQty(c.quantity);
    await S.store.create(
      'chemicals',
      {
        projectId: pid,
        canonicalName: String(c.name).slice(0, 160),
        cas: c.cas ? String(c.cas).slice(0, 20) : null,
        quantity: qty.value,
        quantityUnit: qty.unit || (c.unit ? String(c.unit) : null),
        quantityStatus: qty.value === null ? 'MISSING' : 'DOCUMENT_EXTRACTED',
        physicalState: c.state || null,
        identityStatus: 'DOCUMENT_EXTRACTED',
        sourceRefs: refOf(c.page, c.quote),
      },
      { projectId: pid, actorKind: 'ai', aiRunId: runId }
    );
    counts.chemicals += 1;
  }

  for (const s of (ex.processSteps || []).slice(0, 60)) {
    if (!s || !s.title) continue;
    if (scoped('process_steps').some((x) => String(x.title).toLowerCase() === String(s.title).toLowerCase())) continue;
    await S.store.create('process_steps', { projectId: pid, stepNumber: String(s.stepNumber || '').slice(0, 16), title: String(s.title).slice(0, 200), description: String(s.description || '').slice(0, 1600), sortOrder: counts.steps, sourceRefs: refOf(s.page, null) }, { projectId: pid, actorKind: 'ai', aiRunId: runId });
    counts.steps += 1;
  }

  for (const t of (ex.teamMembers || []).slice(0, 40)) {
    if (!t || !t.name) continue;
    if (scoped('team_members').some((x) => String(x.name).toLowerCase() === String(t.name).toLowerCase())) continue;
    await S.store.create('team_members', { projectId: pid, name: String(t.name).slice(0, 120), designation: t.designation || null, department: t.department || null, organization: t.organization || null, role: normalizeRole(t.role), sortOrder: counts.team, sourceRefs: refOf(t.page, null), status: 'DOCUMENT_EXTRACTED' }, { projectId: pid, actorKind: 'ai', aiRunId: runId });
    counts.team += 1;
  }

  return counts;
}

function parseQty(s) {
  if (s === null || s === undefined) return { value: null, unit: null };
  const m = /^\s*([0-9]+(?:\.[0-9]+)?)\s*([A-Za-z/³°%]+)?/.exec(String(s));
  if (!m) return { value: null, unit: null };
  return { value: Number(m[1]), unit: m[2] || null };
}

function normalizeRole(r) {
  const t = String(r || '').toLowerCase();
  const roles = ['chairman', 'facilitator', 'process engineer', 'production', 'maintenance', 'instrumentation', 'electrical', 'ehs', 'quality', 'project', 'r&d', 'consultant', 'recorder'];
  for (const role of roles) if (t.indexOf(role.split(' ')[0]) !== -1) return role;
  return 'other';
}

/** Raise a conflict when a new extracted value disagrees with an existing one. */
async function checkConflict(pid, rec) {
  const siblings = scoped('extracted_fields').filter(
    (f) => f.id !== rec.id && f.field === rec.field && f.entityKind === rec.entityKind && String(f.entityId || f.entityRef || '') === String(rec.entityId || rec.entityRef || '')
  );
  if (!siblings.length) return false;
  const candidates = siblings.concat([rec]).map((f) => ({ id: f.id, value: f.value, normalizedValue: normalizeForCompare(f.value, f.unit), normalizedUnit: f.unit, status: f.status }));
  const p = project();
  const resolution = sourcePrecedence(candidates, { allowPrecedence: !!(p && p.sourcePrecedenceEnabled) });
  if (resolution.status !== 'CONFLICT') return false;

  const key = rec.entityKind + '|' + (rec.entityId || rec.entityRef || '') + '|' + rec.field;
  const existing = scoped('field_conflicts').filter((c) => c.key === key && c.status === 'OPEN')[0];
  const ids = candidates.map((c) => c.id);
  if (existing) {
    await S.store.update('field_conflicts', existing.id, { candidateIds: Array.from(new Set((existing.candidateIds || []).concat(ids))) }, { projectId: pid });
    return true;
  }
  await S.store.create(
    'field_conflicts',
    { projectId: pid, key, entityKind: rec.entityKind, entityId: rec.entityId || null, entityRef: rec.entityRef || null, field: rec.field, candidateIds: ids, critical: CRITICAL_FIELDS.indexOf(rec.field) !== -1, status: 'OPEN', reason: resolution.reason },
    { projectId: pid }
  );
  return true;
}

function normalizeForCompare(value, unit) {
  const n = Number(String(value || '').replace(/[, ]/g, ''));
  if (!Number.isFinite(n)) return null;
  return n;
}

async function resolveConflict(c, chosen, status) {
  for (const id of c.candidateIds || []) {
    if (id === chosen.id) continue;
    const other = scoped('extracted_fields').filter((f) => f.id === id)[0];
    // The losing value is retained, marked so the report can still show it.
    if (other) await S.store.update('extracted_fields', id, { supersededBy: chosen.id, status: other.status === 'VERIFIED' ? other.status : 'NOT_APPLICABLE', supersededReason: 'Not selected in conflict resolution' }, { projectId: c.projectId, field: 'status' });
  }
  await S.store.update('extracted_fields', chosen.id, { status: 'USER_CONFIRMED' }, { projectId: c.projectId, field: 'status' });
  await S.store.update('field_conflicts', c.id, { status, resolvedValueId: chosen.id, resolvedBy: S.actor.id, resolvedAt: nowIso() }, { projectId: c.projectId });
  toast('Conflict resolved. The other value is kept in the record.', 'ok');
  render();
}

  const body = h(

    meta.type === 'number' ? h('div', { class: 'grid c2' }, field('Unit', unit), meta.needsTemperature ? field('At temperature (°C)', atT) : null) : null,
    field('Status', status, 'AI_INFERRED values are never used in an alert or a conclusion.'),
    h('div', { class: 'section-rule' }, h('h2', { text: 'Source' })),

    h('button', { class: 'btn', text: 'Cancel', onclick: closeDrawer }),

        let v = value.value;
        if (meta.type === 'boolean') v = v === '' ? null : v === 'true';

        const body2 = {
          projectId: c.projectId,
          chemicalId: c.id,
          group: meta.group,
          key: meta.key,
          value: v,

async function reorder(all, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= all.length) return;
  await S.store.update('nodes', all[i].id, { sortOrder: j }, { projectId: all[i].projectId });
  await S.store.update('nodes', all[j].id, { sortOrder: i }, { projectId: all[j].projectId });
  render();
}

async function advance(n, to) {
  const v = canAdvance(NODE_REVIEW, n.reviewStatus || 'PROPOSED', to);
  if (!v.ok) {
    toast('Cannot move from ' + n.reviewStatus + ' to ' + to + ': ' + v.reason.replace(/_/g, ' ').toLowerCase(), 'err');
    return;
  }
  if (to === 'APPROVED' && ['admin', 'facilitator'].indexOf(S.actor.role) === -1) {
    toast('Approving a node needs the facilitator role.', 'err');
    return;
  }
  await S.store.update('nodes', n.id, { reviewStatus: to, approvedBy: to === 'APPROVED' ? S.actor.id : n.approvedBy || null, approvedAt: to === 'APPROVED' ? nowIso() : n.approvedAt || null }, { projectId: n.projectId, field: 'reviewStatus', note: v.audit || null });
  toast('Node ' + n.nodeNumber + ' → ' + to, 'ok');
  render();
}

// app/views/hazop.js — the worksheet grid.
//
// Spreadsheet-like editing, sticky headers, row expansion, an evidence drawer,
// risk badges, a legal-relevance badge, filters and keyboard-friendly edits.
// Every risk value on screen comes from riskFromLS(); nothing is stored that
// the engine did not produce.











function renderHazop() {
  const p = project();
  if (!p) return h('div', { class: 'page' }, emptyState('No project selected', 'Pick a project first.', null));

  const nodes = nodesSorted();
  if (!nodes.length) {
    return h('div', { class: 'page' }, emptyState('No nodes yet', 'The worksheet is organised by node. Create a node first.', h('button', { class: 'btn primary', text: 'Go to nodes', onclick: () => go('nodes') })));
  }

  const nodeId = S.selection.nodeId && nodeById(S.selection.nodeId) ? S.selection.nodeId : nodes[0].id;
  S.selection.nodeId = nodeId;
  const node = nodeById(nodeId);
  const m = matrix();
  const page = h('div', { class: 'page wide' });

  page.appendChild(
    h(
      'div',
      { class: 'page-head' },
      h('div', {}, h('div', { class: 'eyebrow', text: 'HAZOP worksheet · ' + (m.name || m.id) + ' v' + m.version }), h('h1', { class: 'page-title', text: 'Node ' + (node.nodeNumber || '') + ' — ' + (node.worksheetName || 'Worksheet') })),
      h(
        'div',
        { class: 'page-actions' },
        h('button', { class: 'btn', text: 'Add row', onclick: () => addRowDialog(node) }),
        aiAvailable() ? h('button', { class: 'btn', text: 'Draft the uncovered rows', onclick: () => draftDialog(node) }) : null,
        h('button', { class: 'btn ghost', text: 'Legal relevance', onclick: () => legalPanel(node) })
      )
    )
  );

  // node switcher
  const tabs = h('div', { class: 'tabs' });
  for (const n of nodes) {
    tabs.appendChild(h('button', { class: 'tab', 'aria-selected': String(n.id === nodeId), text: 'Node ' + (n.nodeNumber || '?'), title: n.worksheetName || '', onclick: () => go('hazop', { nodeId: n.id }) }));
  }
  page.appendChild(tabs);

  if (node.reviewStatus === 'PROPOSED') {
    page.appendChild(h('div', { class: 'note warn', style: { 'margin-bottom': '12px' } }, h('strong', { text: 'This node is still PROPOSED. ' }), 'Approve it on the nodes page before the team works the sheet, so the report can show who approved the node boundaries.', h('div', { class: 'btn-row', style: { 'margin-top': '6px' } }, h('button', { class: 'btn sm', text: 'Go to nodes', onclick: () => go('nodes') }))));
  }

  page.appendChild(
    h('div', { class: 'card', style: { 'margin-bottom': '12px' } }, h('div', { class: 'tile-label', text: 'Design intent' }), h('p', { style: { margin: '3px 0 0' }, text: node.designIntent || 'Not recorded.' }), h('div', { class: 'row', style: { gap: '6px', 'margin-top': '8px' } }, chips((node.equipmentIds || []).map((id) => (equipById(id) || {}).tag).filter(Boolean)), node.operatingTemperature !== null && node.operatingTemperature !== undefined ? h('span', { class: 'tag', text: 'Op T ' + node.operatingTemperature + ' °C' }) : null, node.operatingTemperatureMax ? h('span', { class: 'tag', text: 'Max T ' + node.operatingTemperatureMax + ' °C' }) : null))
  );

  const all = scenariosFor(nodeId).map((s) => decorate(s, m));
  page.appendChild(filterBar(all));
  const rowsShown = applyFilters(all);

  if (!all.length) {
    page.appendChild(emptyState('No rows on this node', 'Add a row from the node\'s meaningful deviation set, or let the model draft the uncovered ones for the team to review.', h('div', { class: 'btn-row', style: { 'justify-content': 'center' } }, h('button', { class: 'btn primary', text: 'Add row', onclick: () => addRowDialog(node) }), aiAvailable() ? h('button', { class: 'btn', text: 'Draft the uncovered rows', onclick: () => draftDialog(node) }) : null)));
    return page;
  }

  page.appendChild(grid(node, rowsShown, m));
  page.appendChild(h('p', { class: 'muted small', style: { 'margin-top': '8px' }, text: 'Showing ' + rowsShown.length + ' of ' + all.length + ' row(s). Click a cell to edit; Tab moves on. Click the row number to open evidence, sources and the full row.' }));
  return page;
}

function decorate(s, m) {
  let initial;
  let residual;
  try {
    initial = riskFromLS(m, s.initialLikelihood, s.initialSeverity);
  } catch (e) {
    initial = { ok: false, reason: 'OFF_SCALE' };
  }
  try {
    residual = riskFromLS(m, s.residualLikelihood, s.residualSeverity);
  } catch (e) {
    residual = { ok: false, reason: 'OFF_SCALE' };
  }
  return Object.assign({}, s, { initial, residual });
}

// ------------------------------------------------------------------- filters

function filterBar(all) {
  const f = S.filters;
  const bar = h('div', { class: 'filters' });
  bar.appendChild(h('label', { text: 'Filter' }));
  bar.appendChild(
    select(
      [{ value: '', label: 'All rows' }, { value: 'HIGH', label: 'Top two risk bands' }, { value: 'UNRATED', label: 'Not rated' }, { value: 'NO_REC', label: 'High risk with no action' }, { value: 'DRAFT', label: 'Drafts' }, { value: 'AI', label: 'AI drafted' }, { value: 'NMD', label: 'No meaningful deviation' }],
      f.hazop || '',
      { onchange: (e) => { S.filters.hazop = e.target.value; render(); } }
    )
  );
  bar.appendChild(h('label', { text: 'Parameter' }));
  const params = Array.from(new Set(all.map((s) => s.parameterLabel || s.parameter))).sort();
  bar.appendChild(select([{ value: '', label: 'Any' }].concat(params.map((x) => ({ value: x, label: x }))), f.hazopParam || '', { onchange: (e) => { S.filters.hazopParam = e.target.value; render(); } }));
  bar.appendChild(h('label', { text: 'Search' }));
  bar.appendChild(input({ value: f.hazopQ || '', placeholder: 'cause, consequence, safeguard…', oninput: (e) => { S.filters.hazopQ = e.target.value; render(); } }));
  if (f.hazop || f.hazopParam || f.hazopQ) bar.appendChild(h('button', { class: 'btn sm ghost', text: 'Clear', onclick: () => { S.filters.hazop = ''; S.filters.hazopParam = ''; S.filters.hazopQ = ''; render(); } }));
  return bar;
}

function applyFilters(all) {
  const f = S.filters;
  const m = matrix();
  let out = all;
  if (f.hazop === 'HIGH') {
    const top = m.bands.slice(-2).map((b) => b.key);
    out = out.filter((s) => s.initial.ok && top.indexOf(s.initial.bandKey) !== -1);
  } else if (f.hazop === 'UNRATED') out = out.filter((s) => !s.noMeaningfulDeviation && !s.initial.ok);
  else if (f.hazop === 'NO_REC') {
    const top = m.bands.slice(-2).map((b) => b.key);
    out = out.filter((s) => s.initial.ok && top.indexOf(s.initial.bandKey) !== -1 && !scoped('recommendations').some((r) => r.scenarioId === s.id) && !(s.acceptanceRationale || '').trim());
  } else if (f.hazop === 'DRAFT') out = out.filter((s) => (s.reviewerStatus || 'DRAFT') === 'DRAFT');
  else if (f.hazop === 'AI') out = out.filter((s) => s.aiDrafted);
  else if (f.hazop === 'NMD') out = out.filter((s) => s.noMeaningfulDeviation);

  if (f.hazopParam) out = out.filter((s) => (s.parameterLabel || s.parameter) === f.hazopParam);
  if (f.hazopQ) {
    const q = String(f.hazopQ).toLowerCase();
    out = out.filter((s) => {
      const hay = [s.deviation, (s.causes || []).map((c) => c.text).join(' '), (s.consequences || []).map((c) => c.text).join(' '), (s.existingSafeguards || []).map((c) => c.text).join(' ')].join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  return out;
}

    { label: 'L', width: '38px', cls: 'num' },
    { label: 'S', width: '38px', cls: 'num' },

async function saveRating(s, key, v) {
  const m = matrix();
  const next = Object.assign({}, s);
  next[key] = v;

  // A residual entry must pass the basis guard before it is stored.
  if (key.indexOf('residual') === 0) {
    const check = validateResidual({
      matrix: m,
      initial: { likelihood: next.initialLikelihood, severity: next.initialSeverity },
      residual: { likelihood: next.residualLikelihood, severity: next.residualSeverity },
      basis: next.residualBasisKind ? { kind: next.residualBasisKind, text: next.residualBasisText } : null,
    });
    if (!check.ok) {
      residualBasisDialog(s, key, v, check);
      return;
    }
  }

  const patch = {};
  patch[key] = v;
  const initial = tryRiskFromLS(m, next.initialLikelihood, next.initialSeverity);
  const residual = tryRiskFromLS(m, next.residualLikelihood, next.residualSeverity);
  patch.initialRisk = initial.ok ? initial : null;
  patch.residualRisk = residual.ok ? residual : null;
  patch.severityDimensions = severityDimensions(next.consequences);
  await S.store.update('scenarios', s.id, patch, { projectId: s.projectId, field: key });
  render();
}

        const patch = {};

        const residual = tryRiskFromLS(m, next.residualLikelihood, next.residualSeverity);

async function recompute(stale, m) {
  for (const s of stale) {
    let initial = null;
    let residual = null;
    try {
      initial = riskFromLS(m, s.initialLikelihood, s.initialSeverity);
    } catch (e) {
      initial = null;
    }
    try {
      residual = riskFromLS(m, s.residualLikelihood, s.residualSeverity);
    } catch (e) {
      residual = null;
    }
    await S.store.update('scenarios', s.id, { initialRisk: initial && initial.ok ? initial : null, residualRisk: residual && residual.ok ? residual : null }, { projectId: s.projectId, field: 'initialRisk', note: 'Recomputed against ' + m.id + ' v' + m.version });
  }
  toast(stale.length + ' rating(s) recomputed against ' + m.id + ' v' + m.version, 'ok');
  render();
}

    CLOSURE_EVIDENCE_REQUIRED: 'This recommendation requires close-out evidence. Attach it first.',
    VERIFIER_REQUIRED: 'Name the person who verified the close-out.',

function attachEvidence(r) {
  const docs = scoped('documents');
  const title = input({ id: 're-title', placeholder: 'What the evidence is' });
  const docSel = select([{ value: '', label: '— none —' }].concat(docs.map((d) => ({ value: d.id, label: d.title }))), '', { id: 're-doc' });
  const note = textarea({ rows: 2, id: 're-note' });
  drawer('Attach close-out evidence', h('div', {}, field('Title', title), field('Document', docSel), field('Note', note)), [
    h('button', { class: 'btn', text: 'Cancel', onclick: closeDrawer }),
    h('button', {

async function renumber(reg) {
  const ok = await confirmAction('Renumber every recommendation?', 'IDs are reassigned in node order as R-001, R-002 and so on. Any report already issued will not match the new numbers.');
  if (!ok) return;
  const nodeKeys = Array.from(reg.byNode.keys()).sort();
  let n = 0;
  for (const key of nodeKeys) {
    for (const r of reg.byNode.get(key)) {
      n += 1;
      const id = 'R-' + String(n).padStart(3, '0');
      if (r.recId !== id) await S.store.update('recommendations', r.id, { recId: id }, { projectId: r.projectId, field: 'recId' });
    }
  }
  toast(n + ' recommendation(s) renumbered in node order', 'ok');
  render();
}

function linkedNodeCount(r) {
  const nodes = scoped('nodes');

  for (const node of nodes) if ((node.chemicalIds || []).some((id) => crossedChemIds.indexOf(id) !== -1)) n += 1;
  const stored = scoped('legal_node_links').filter((l) => l.obligationId === r.obligationId).length;
  return Math.max(n, stored);
}

function projectState() {
  const p = project();
  if (!p) return { note: 'No project is open.' };
  const m = matrix();
  const cc = complianceCounts();
  const gate = qualityGate();
  const reg = recommendationRegister();
  const comp = completeness();
  const al = alerts();
  const run = applicability();

  const nodes = nodesSorted().map((n) => {
    const rows = scoped('scenarios').filter((s) => s.nodeId === n.id);
    const gen = generateDeviations(n, { equipment: scoped('equipment'), chemicals: chemicalsResolved(), chemProperties: scoped('chem_properties') });
    return {
      number: n.nodeNumber,
      name: n.worksheetName,
      designIntent: truncate(n.designIntent || '', 300),
      status: n.reviewStatus,
      equipment: (n.equipmentIds || []).map((id) => (scoped('equipment').filter((e) => e.id === id)[0] || {}).tag).filter(Boolean),
      chemicals: (n.chemicalIds || []).map((id) => (scoped('chemicals').filter((c) => c.id === id)[0] || {}).canonicalName).filter(Boolean),
      utilities: n.utilities,
      operatingTemperature: n.operatingTemperature,
      rowCount: rows.length,
      meaningfulDeviations: gen.combinations.length,
      uncoveredDeviations: gen.combinations.filter((c) => !rows.some((s) => s.parameter === c.parameter && s.guideword === c.guideword)).map((c) => c.deviation).slice(0, 12),
      rows: rows.slice(0, 22).map((s) => {
        let risk = null;
        try {
          risk = riskFromLS(m, s.initialLikelihood, s.initialSeverity);
        } catch (e) {
          risk = null;
        }
        return {
          row: s.rowNumber,
          deviation: s.deviation,
          causes: (s.causes || []).map((c) => c.text),
          consequences: (s.consequences || []).map((c) => c.text),
          existingSafeguards: (s.existingSafeguards || []).map((c) => c.text),
          initialRisk: risk && risk.ok ? { band: risk.bandLabel, score: risk.score, basis: risk.basis, computedBy: 'application' } : 'not rated',
          residualBasis: s.residualBasisKind || null,
          recommendations: scoped('recommendations').filter((r) => r.scenarioId === s.id).map((r) => (r.recId || '') + ': ' + r.text),
          status: s.reviewerStatus,

      }),
    };
  });

  return {
