async function send(text) {
  if (!aiAvailable() || S.chatBusy) return;
  S.chat.push({ role: 'user', text });
  S.chatBusy = true;
  render();

  const turns = [{ role: 'user', content: instructions() + '\n\nPROJECT STATE:\n' + JSON.stringify(projectState()).slice(0, 46000) }];
  for (const m of S.chat.slice(-8)) {
    if (m.role === 'user') turns.push({ role: 'user', content: m.text });
    else if (m.role === 'ai') turns.push({ role: 'assistant', content: m.text });
  }
  if (turns[turns.length - 1].role !== 'user') turns.push({ role: 'user', content: text });

  controller = new AbortController();
  const msg = { role: 'ai', text: '' };
  S.chat.push(msg);
  const runId = uid('airun');
  const started = Date.now();

  try {
    const out = await getAdapter().chat(turns, {
      cache: false,
      signal: controller.signal,
      onText: ({ text: whole }) => {
        msg.text = whole;
        render();
      },
    });
    msg.text = out.text;
    const parsed = extractAction(out.text);
    if (parsed.action) {
      msg.text = parsed.text;
      S.chat.push({ role: 'action', action: parsed.action });
    }
    await logChatRun(runId, started, out, null);
  } catch (e) {
    if (e && e.code === 'cancelled') {
      msg.text = (e.text || msg.text || '') + '\n\n[stopped]';
    } else {
      S.chat.pop();
      S.chat.push({ role: 'system', text: chatError(e) });
    }
    await logChatRun(runId, started, null, e);
  } finally {
    S.chatBusy = false;
    controller = null;
    render();
  }
}

function chatError(e) {
  const code = (e && e.code) || '';
  const map = {
    not_granted: 'You have not allowed this page to use Claude. The deterministic parts of the app are unaffected.',
    rate_limited: 'Too many requests, or your usage limit was reached. Try again in a little while.',
    session_expired: 'Your session expired — sign in again.',
    prompt_too_large: 'This project is too large to send in one go. Ask about a single node or a single obligation.',
    refused: 'The assistant declined this request.',
    invalid_json: 'The reply could not be read. Try asking again.',
    sampling_disabled: 'Claude is not available for this account.',
  };
  return map[code] || 'The request failed' + (e && e.message ? ': ' + e.message : '') + '.';
}

async function logChatRun(runId, started, out, err) {
  if (!S.store) return;
  try {
    await S.store.create(
      'ai_runs',
      {
        id: runId,
        projectId: S.projectId,
        task: 'chat',
        taskClass: 'medium',
        provider: getAdapter() ? getAdapter().name : 'unknown',
        modelTierRequested: 'default',
        modelTierApplied: out && out.modelTierApplied ? out.modelTierApplied : null,
        promptVersion: 'chat-p1',
        schemaVersion: 'chat-s1',
        runtimeMs: Date.now() - started,
        outputValid: !err,
        validationErrors: err ? [String((err && err.code) || err)] : null,
        humanReviewRequired: true,
        requestedBy: S.actor.id,
        createdAt: nowIso(),
      },
      { projectId: S.projectId, actorKind: 'ai' }
    );
  } catch (e) {
    /* logging failure must not break the chat */
  }
}

const ALLOWED_ACTIONS = ['add_assumption', 'add_data_gap', 'add_recommendation', 'add_team_member', 'add_scenario_note'];

function extractAction(text) {
  const idx = text.lastIndexOf('ACTION:');
  if (idx === -1) return { text, action: null };
  const before = text.slice(0, idx).trim();
  const raw = text.slice(idx + 7).trim();
  let obj = null;
  try {
    const start = raw.indexOf('{');
    const end = raw.lastIndexOf('}');
    if (start !== -1 && end > start) obj = JSON.parse(raw.slice(start, end + 1));
  } catch (e) {
    obj = null;
  }
  if (!obj || ALLOWED_ACTIONS.indexOf(obj.kind) === -1 || !obj.summary) return { text: before || text, action: null };
  return { text: before, action: { kind: obj.kind, summary: String(obj.summary).slice(0, 300), payload: obj.payload || {} } };
}

async function applyAction(m) {
  const a = m.action;
  const p = project();
  if (!p) return;
  const pl = a.payload || {};
  try {
    if (a.kind === 'add_assumption') {
      await S.store.create('assumptions', { projectId: p.id, category: String(pl.category || 'Assistant').slice(0, 60), text: String(pl.text || a.summary).slice(0, 900), basis: String(pl.basis || 'Proposed by the assistant and confirmed by ' + (S.actor.name || 'a user')).slice(0, 300), raisedBy: S.actor.id }, { projectId: p.id, actorKind: 'ai', note: 'Confirmed by a user from the assistant panel' });
    } else if (a.kind === 'add_data_gap') {
      await S.store.create('data_gaps', { projectId: p.id, entityKind: String(pl.entityKind || 'project').slice(0, 30), field: String(pl.field || 'unspecified').slice(0, 60), label: String(pl.label || a.summary).slice(0, 160), blocks: Array.isArray(pl.blocks) ? pl.blocks.slice(0, 6).map(String) : [], detail: String(pl.detail || '').slice(0, 400), status: 'OPEN' }, { projectId: p.id, actorKind: 'ai' });
    } else if (a.kind === 'add_recommendation') {
      // A recommendation must attach to a real scenario; the assistant cannot
      // invent one, and a residual rating is never set here.
      const node = nodesSorted().filter((n) => String(n.nodeNumber) === String(pl.nodeNumber))[0];
      const sc = node ? scoped('scenarios').filter((s) => s.nodeId === node.id && String(s.rowNumber) === String(pl.rowNumber))[0] : null;
      if (!sc) {
        toast('That row could not be found, so the recommendation was not added. Add it from the worksheet row instead.', 'err');
        return;
      }
      const n = scoped('recommendations').length + 1;
      await S.store.create('recommendations', { projectId: p.id, scenarioId: sc.id, nodeId: sc.nodeId, recId: 'R-' + String(n).padStart(3, '0'), text: String(pl.text || a.summary).slice(0, 700), technicalBasis: String(pl.technicalBasis || '').slice(0, 500), controlLevel: ['ELIMINATE', 'SUBSTITUTE', 'ENGINEERING', 'ADMINISTRATIVE', 'PPE'].indexOf(pl.controlLevel) !== -1 ? pl.controlLevel : null, priority: ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'].indexOf(pl.priority) !== -1 ? pl.priority : null, responsibleDepartment: String(pl.responsibleDepartment || '').slice(0, 120), status: 'OPEN', closureEvidenceRequired: true }, { projectId: p.id, actorKind: 'ai', note: 'Confirmed by a user from the assistant panel' });
    } else if (a.kind === 'add_team_member') {
      await S.store.create('team_members', { projectId: p.id, name: String(pl.name || '').slice(0, 120), designation: String(pl.designation || '').slice(0, 120), department: String(pl.department || '').slice(0, 120), organization: String(pl.organization || '').slice(0, 120), role: String(pl.role || 'other').slice(0, 40), serialNumber: scoped('team_members').length + 1, sortOrder: scoped('team_members').length, status: 'USER_CONFIRMED' }, { projectId: p.id, actorKind: 'ai' });
    } else if (a.kind === 'add_scenario_note') {
      const node = nodesSorted().filter((n) => String(n.nodeNumber) === String(pl.nodeNumber))[0];
      const sc = node ? scoped('scenarios').filter((s) => s.nodeId === node.id && String(s.rowNumber) === String(pl.rowNumber))[0] : null;
      if (!sc) {
        toast('That row could not be found.', 'err');
        return;
      }
      await S.store.update('scenarios', sc.id, { notes: String(pl.note || a.summary).slice(0, 600) }, { projectId: p.id, field: 'notes', actorKind: 'ai' });
    }
    m.applied = true;
    toast('Applied', 'ok');
    render();
  } catch (e) {
    toast('Could not apply: ' + ((e && e.message) || 'unknown error'), 'err');
  }
}

function paint() {
  const app = qs('#app');
  if (!app) return;
  app.className = S.chatOpen ? 'with-chat' : '';

  paintTopbar();
  paintRail();

  const main = qs('#main');
  clear(main);
  const fn = VIEWS[S.view] || renderDashboard;
  try {
    main.appendChild(fn());
  } catch (e) {
    main.appendChild(
      h(
        'div',
        { class: 'page' },
        h('div', { class: 'note crit' }, h('strong', { text: 'This page could not be drawn. ' }), String((e && e.message) || e), h('div', { class: 'btn-row', style: { 'margin-top': '8px' } }, h('button', { class: 'btn sm', text: 'Go to the dashboard', onclick: () => go('dashboard') })))
      )
    );
    if (window.console) window.console.error(e);
  }

  const chat = qs('#chat');
  clear(chat);
  if (S.chatOpen) chat.appendChild(renderChat());
}

function paintTopbar() {
  const bar = qs('#topbar');
  clear(bar);
  const p = project();

  bar.appendChild(
    h('div', { class: 'brand' }, h('div', { class: 'brand-mark', text: 'HZ' }), h('div', {}, h('div', { class: 'brand-name', text: 'HAZOP Master' }), h('span', { class: 'brand-sub', text: 'process safety · compliance' })))
  );
  bar.appendChild(h('div', { class: 'bar-sep' }));

  const projects = allProjects();
  const sel = h('select', { 'aria-label': 'Project', onchange: (e) => { if (e.target.value === '__new') { go('projects'); return; } setProject(e.target.value); } });
  sel.appendChild(h('option', { value: '', text: projects.length ? '— select a project —' : 'No projects yet' }));
  for (const x of projects) {
    const o = h('option', { value: x.id, text: x.projectName || 'Untitled' });
    if (x.id === S.projectId) o.selected = true;
    sel.appendChild(o);
  }
  bar.appendChild(h('div', { class: 'project-pick' }, sel, p ? h('span', { class: 'rev-chip', text: 'REV ' + (p.revision || 'R0') }) : null, p && p.isWorkedExample ? h('span', { class: 'rev-chip', title: 'Seeded from the uploaded study report, including the contradictions that report contains.', text: 'WORKED EXAMPLE' }) : null));

    bar.appendChild(h('div', { class: 'meters' }, meter('Data', comp.data.percent, ''), meter('Critical', comp.critical.percent, ''), meter('Report', ready.percent, '')));
    bar.appendChild(h('div', { class: 'bar-sep' }));

    bar.appendChild(h('span', { class: 'badge conflict', title: S.storeMessage, text: 'NOT SAVED' }));
  }

  bar.appendChild(
    h('button', {
      class: 'btn sm' + (S.chatOpen ? ' primary' : ''),

        S.chatOpen = !S.chatOpen;

      },

function themeIcon() {
  const t = document.documentElement.getAttribute('data-theme');
  return t === 'dark' ? '☾' : t === 'light' ? '☀' : '◐';
}

function cycleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : cur === 'dark' ? null : 'light';
  if (next) document.documentElement.setAttribute('data-theme', next);
  else document.documentElement.removeAttribute('data-theme');
  try {
    if (next) localStorage.setItem('hazop.theme', next);
    else localStorage.removeItem('hazop.theme');
  } catch (e) {
    /* storage may be blocked */
  }
  render();
}

function paintRail() {
  const rail = qs('#rail');
  clear(rail);
  const hasProject = !!project();
  for (const group of RAIL) {
    const g = h('div', { class: 'rail-group' });
    g.appendChild(h('div', { class: 'rail-group-label', text: group.group }));
    for (const item of group.items) {
      const disabled = !hasProject && item.key !== 'projects' && item.key !== 'settings' && item.key !== 'dashboard';
      let count = null;
      let alert = false;
      if (hasProject) {
        try {
          count = item.count ? item.count() : null;
          alert = item.alert ? item.alert() : false;
        } catch (e) {
          count = null;
        }
      }
      g.appendChild(
        h(
          'button',
          { class: 'rail-item', 'aria-current': S.view === item.key ? 'page' : null, disabled, onclick: () => go(item.key) },
          h('span', { class: 'ri-label', text: item.label }),
          alert ? h('span', { class: 'ri-dot', title: 'Needs attention' }) : null,
          count !== null && count !== undefined ? h('span', { class: 'ri-count', text: String(count) }) : null
        )
      );
    }
    rail.appendChild(g);
  }
}

// --------------------------------------------------------------------- boot

async function boot() {
  try {
    const t = localStorage.getItem('hazop.theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    /* storage may be blocked */
  }

  setRenderer(paint);

  // Capabilities. Every one is optional and the app states what is missing.
  const caps = {};
  window.__HAZOP_CAPS = caps;
  window.__HAZOP_ON_DB_ERROR = (collection, err) => {
    if (err && err.code === 'revoked') toast('Your access to the shared store was withdrawn. The page is now read-only.', 'err');
    else if (err && err.code === 'quota_exceeded') toast('The project store is full. Delete some records, or export a JSON backup and start a fresh project.', 'err');
    else if (err) toast('The shared store reported a problem on ' + collection + ': ' + (err.code || 'unknown') + '.', 'err');
  };

  const claude = window.claude;
  if (claude && typeof claude.use === 'function') {
    const [db, sample, user, downloads, assets] = await Promise.all([
      claude.use('db').catch(() => null),
      claude.use('sample').catch(() => null),
      claude.use('user').catch(() => null),
      claude.use('downloads').catch(() => null),
      claude.use('assets').catch(() => null),
    ]);
    caps.db = db;
    caps.sample = sample;
    caps.user = user;
    caps.downloads = downloads;
    caps.assets = assets;

    if (sample) setAdapter(new SampleAdapter(sample));
    else setAdapter(new HttpAdapter());

    if (user) {
      const [isOwner, canEdit, canWrite, id, me] = await Promise.all([
        Promise.resolve(user.isOwner()).catch(() => false),
        Promise.resolve(user.canEdit()).catch(() => false),
        Promise.resolve(user.can('data.write')).catch(() => null),
        Promise.resolve(user.id ? user.id() : null).catch(() => null),
        Promise.resolve(user.me ? user.me() : null).catch(() => null),
      ]);
      // Sharing level maps onto the role matrix in docs/SECURITY.md.
      const level = isOwner ? 'owner' : canEdit ? 'admin' : canWrite === false ? 'view' : 'interact';
      S.actor = {
        id: id || 'local',
        name: (me && me.name) || 'You',
        role: isOwner ? 'admin' : canEdit ? 'facilitator' : canWrite === false ? 'viewer' : 'engineer',
        level,
      };
      caps.readOnly = canWrite === false;
    }
  } else {
    setAdapter(new HttpAdapter());
  }

  const store = await openStore((info) => {
    S.storeKind = info.kind;
    S.storeMessage = info.message;
  });
  store.setActor(S.actor);
  await attachStore(store, { kind: store.kind, message: S.storeMessage });

  // Route restore, then a first paint.
  const route = restoreRoute();
  if (route.view && VIEWS[route.view]) S.view = route.view;
  if (route.projectId) S.projectId = route.projectId;

  // Wait one tick for the first snapshots so the opening screen is not empty.
  setTimeout(() => {
    if (!S.projectId) {
      const first = allProjects()[0];
      if (first) S.projectId = first.id;
      else if (S.view === 'dashboard') S.view = 'projects';
    }
    if (window.innerWidth >= 1180 && aiAvailable() && S.projectId) S.chatOpen = true;
    render();
  }, 350);

  render();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
